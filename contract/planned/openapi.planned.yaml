          format: uuid
        orderNo:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - PLANNED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        location:
          $ref: "#/components/schemas/LocationRef"
        outputLocation:
          $ref: "#/components/schemas/LocationRef"
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingOutput"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingCost"
