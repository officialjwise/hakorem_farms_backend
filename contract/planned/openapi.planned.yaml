        runDate:
          type: string
          format: date
        outcome:
          type: string
          enum:
            - CREATED
            - HELD_FOR_CREDIT
            - SKIPPED_ON_HOLD
            - SKIPPED_NO_PRICE
            - MISSED
            - FAILED
        reason:
          type:
            - string
            - "null"
          description: "Null for `CREATED`."
        order:
          anyOf:
            - $ref: "#/components/schemas/DocumentRef"
            - type: "null"
        recordedAt:
          type: string
          format: date-time
      required:
        - runDate
        - outcome
        - reason
        - order
        - recordedAt
