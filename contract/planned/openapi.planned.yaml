          anyOf:
            - $ref: "#/components/schemas/Kilograms"
            - type: "null"
        expectedYieldPercent:
          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
        actualYieldPercent:
          anyOf:
            - $ref: "#/components/schemas/Percent"
            - type: "null"
        yieldVarianceFlag:
          type: boolean
        inputCostPesewas:
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
        directCostPesewas:
          $ref: "#/components/schemas/Pesewas"
        totalCostPesewas:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/Pesewas"
              description: "Input plus direct cost. Output costs sum to it exactly."
            - type: "null"
        currency:
          $ref: "#/components/schemas/Currency"
        branchId:
          type: string
          format: uuid
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
        postedAt:
          type:
            - string
            - "null"
          format: date-time
        postedBy:
          anyOf:
            - $ref: "#/components/schemas/PrincipalRef"
            - type: "null"
        reversal:
          description: "The posted reversal that corrected this completed order (FR-PRC-011), or null. The order itself stays COMPLETED and frozen; its movements were reversed under the reversal, the source document of the reversing movements. `reversedBy` asked for it; at or above the adjustment threshold `approvedBy` approved it, and the movements were posted as them (1.31.0). `valuePesewas` and `thresholdPesewas` are null only on a reversal posted before 1.31.0."
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                reason:
                  type: string
                reversedAt:
                  type: string
                  format: date-time
                reversedBy:
                  $ref: "#/components/schemas/PrincipalRef"
                approvedBy:
                  anyOf:
                    - $ref: "#/components/schemas/PrincipalRef"
                    - type: "null"
                approvalRequestId:
                  type:
                    - string
                    - "null"
                  format: uuid
                valuePesewas:
                  description: "What the reversal took back out of stock: the order's total cost."
                  anyOf:
                    - $ref: "#/components/schemas/Pesewas"
                    - type: "null"
                thresholdPesewas:
                  description: "The stock adjustment threshold in force when the reversal was asked for, copied onto it (ADR-0048)."
                  anyOf:
                    - $ref: "#/components/schemas/Pesewas"
                    - type: "null"
              required:
                - id
                - reason
                - reversedAt
                - reversedBy
                - approvedBy
                - approvalRequestId
                - valuePesewas
                - thresholdPesewas
            - type: "null"
        pendingReversal:
          description: "A reversal at or above the adjustment threshold waiting for a different approver (1.31.0, B06r), or null. Nothing has moved: the lots are still in stock and the animals still processed. Approved, it becomes `reversal`; rejected, it disappears and the order may be reversed again."
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                reason:
                  type: string
                requestedAt:
                  type: string
                  format: date-time
                requestedBy:
                  $ref: "#/components/schemas/PrincipalRef"
                approvalRequestId:
                  type: string
                  format: uuid
                valuePesewas:
                  $ref: "#/components/schemas/Pesewas"
                thresholdPesewas:
                  $ref: "#/components/schemas/Pesewas"
              required:
                - id
                - reason
                - requestedAt
                - requestedBy
                - approvalRequestId
                - valuePesewas
                - thresholdPesewas
            - type: "null"
      required:
        - id
        - orderNo
        - status
        - location
        - outputLocation
        - startedAt
        - completedAt
        - inputs
        - outputs
        - costs
        - inputWeightKg
        - outputWeightKg
        - wasteWeightKg
        - expectedYieldPercent
        - actualYieldPercent
        - yieldVarianceFlag
        - inputCostPesewas
        - directCostPesewas
        - totalCostPesewas
        - currency
        - branchId
        - version
        - createdAt
        - createdBy
        - postedAt
        - postedBy
        - reversal
        - pendingReversal
