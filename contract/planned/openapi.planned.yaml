        - currency
        - createdBy
        - createdAt
        - version
        - acceptanceLinkToken
        - acceptanceLinkId
        - links
    QuoteLink:
      type: object
      description: "One acceptance link of a quote version (2.21.0, the owner, 2026-11-18): several may be live at once. The token was shown once, in the answer that made it, and is never readable again (ADR-0074, ADR-0087)."
