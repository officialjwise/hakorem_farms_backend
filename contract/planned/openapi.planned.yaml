    DailyExceptionReport:
      type: object
      description: "The detection side of every abuse case in the threat model, for one Africa/Accra day (FR-RPT-007, FR-RPT-008, ADR-0103). Sent to the owner, not to the approvers. Items are urgent first; counts are by kind; each rate table lists people with a count, a value and, where the report has a base for it, a rate beside everyone's."
