        - priceBasis
        - priceListEntryId
        - listUnitPricePesewas
        - lineTotalPesewas
        - quoteRequiredReason
    HeldSaleCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "The held sale's client-generated UUIDv7."
        label:
          type: string
          description: "A note for the cashier, 1 to 120 characters: a first name, a description."
        payload:
          type: object
          additionalProperties: true
          description: "The lines as a counter sale carries them, without prices: `lines` (1 to 100), each with `productId`, `quantity`, and as needed `stockUnitId`, `weightKg` with `weightSource`, `gradeId`; and `customerId` if one is named. Nothing else is accepted (400)."
      required:
        - id
        - payload
      additionalProperties: false
    HeldSalePage:
      type: object
      description: "A page of `HeldSale` results."
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HeldSale"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    OfflineProduct:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/ProductRef"
        saleUom:
          type: string
        taxCategoryId:
          type: string
          format: uuid
        priceBasis:
          $ref: "#/components/schemas/PriceBasis"
        priceBand:
          anyOf:
            - $ref: "#/components/schemas/PriceBand"
            - type: "null"
          description: "The first selling unit's band; null when one of it has no single price (priced by grade or weight, or quote only)."
        priceListEntryId:
          type:
            - string
            - "null"
          format: uuid
        quoteOnly:
          type: boolean
        taxInclusive:
          type: boolean
          description: "Whether this product's prices include tax (its first selling unit's price list's `taxInclusive`): if true the customer pays the price, if false the till adds the `taxCells` levies on top. A pack can carry products of both kinds (CR-031, 1.45.0)."
        tileCategory:
          type:
            - string
            - "null"
        sellingUnits:
          type: array
          items:
            $ref: "#/components/schemas/OfflineSellingUnit"
          description: "Every unit the product is sold by at this register (CR-038, 2.11.0), `saleUom` first when the product is priced in it, the rest by code; the first is the unit a line that names none is sold in, and `priceBand`, `priceListEntryId`, `quoteOnly` and `taxInclusive` are its. A product priced in one unit has one entry. Always sent."
      required:
        - product
        - saleUom
        - taxCategoryId
        - priceBasis
        - priceBand
        - priceListEntryId
        - quoteOnly
        - taxInclusive
        - tileCategory
    OfflineStockUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        gradeId:
          type:
            - string
            - "null"
          format: uuid
        lastWeightKg:
          anyOf:
            - $ref: "#/components/schemas/Kilograms"
            - type: "null"
        lastWeighedAt:
          type:
            - string
            - "null"
          format: date-time
          description: "When the unit's last weight was taken (2.28.0, CR-052); null when it was never weighed."
        lastWeightSource:
          type:
            - string
            - "null"
          enum:
            - SCALE
            - MANUAL
            - ESTIMATE
            - null
          description: "How an animal's last weight was taken, from its weighing history (2.28.0, CR-052); null for a lot, for an animal never weighed, and for a weight the history does not hold."
        sellable:
          type: boolean
        priceListEntryId:
          type:
            - string
            - "null"
          format: uuid
          description: "The price list entry this animal's own price resolved from (2.28.0, CR-052); null for a lot and for an animal with no price here (`unpricedReason`)."
        priceBand:
          anyOf:
            - $ref: "#/components/schemas/PriceBand"
            - type: "null"
          description: "This animal's own band, resolved by the pricing engine as the counter would for a buyer with no account, from the animal's own grade and latest weight (`gradeId`, `lastWeightKg`), one head in the first unit its product is sold by here, never derived (2.28.0, CR-052). The till keeps an agreed price inside its floor and ceiling. Null for a lot (it sells at its product's `priceBand`; the scale gives the weight) and for an animal with no price here. The server prices every synced sale again (`syncOfflineSales`): the price charged stands and a difference is raised."
        unpricedReason:
          type:
            - string
            - "null"
          enum:
            - MISSING_GRADE_OR_WEIGHT
            - NO_RULE
            - QUOTE_ONLY
            - NOT_SELLABLE
            - null
          description: "Why an animal has no price at this till (2.28.0, CR-052): the engine's reason (it needs a grade or a weight the animal lacks, no list prices it, or it is sold only through a quote), or `NOT_SELLABLE` (reserved, on hold or otherwise not to be sold now). Null for a priced animal and for a lot."
      required:
        - id
        - identifier
        - productId
        - locationId
        - gradeId
        - lastWeightKg
        - sellable
    OfflinePolicy:
      type: object
      properties:
        maxOfflineHours:
          type: integer
        maxQueuedSales:
          type: integer
        offlineTenderMethodIds:
          type: array
          items:
            type: string
            format: uuid
        priceOverrideLimitPerLinePesewas:
          $ref: "#/components/schemas/Pesewas"
        priceOverrideLimitPerShiftPesewas:
          $ref: "#/components/schemas/Pesewas"
        pinMaxWrongTries:
          type: integer
          description: "Wrong till PIN tries before a PIN is locked until its owner sets a new one (2.17.0, CR-032 point 3, ADR-0080): 5. The server counts every try the tills report (`reportTillPinEvents`) and locks it too."
      required:
        - maxOfflineHours
        - maxQueuedSales
        - offlineTenderMethodIds
        - priceOverrideLimitPerLinePesewas
        - priceOverrideLimitPerShiftPesewas
        - pinMaxWrongTries
    OfflinePack:
      type: object
      description: "Everything a till needs to sell for a shift with no network. A cache with an age: the server re-prices and re-authorises every synced sale."
      properties:
        register:
          $ref: "#/components/schemas/RegisterRefLite"
        nextShiftSeq:
          type: integer
          description: "The sequence the register's next shift takes, which a shift opened offline prints in its provisional references (`P-<till>-<shift seq>-<counter>`) and sends as `ShiftOpen.shiftSeq` (2.15.0, OFFLINE_SYNC 10). Always sent; optional so no earlier example changes."
        generatedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        priceListVersionIds:
          type: array
          items:
            type: string
            format: uuid
        taxSchemeVersionId:
          type: string
          format: uuid
        taxCells:
          type: array
          items:
            $ref: "#/components/schemas/TaxCell"
        products:
          type: array
          items:
            $ref: "#/components/schemas/OfflineProduct"
        stockUnits:
          type: array
          items:
            $ref: "#/components/schemas/OfflineStockUnit"
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethodRef"
        reasonCodes:
          type: array
          items:
            $ref: "#/components/schemas/ReasonCode"
        policy:
          $ref: "#/components/schemas/OfflinePolicy"
        uoms:
          type: array
          description: "The units the pack's products are sold or counted in, with the names `Uom` gives them (2.17.0, CR-051), so the till says \"6 eggs\" and \"1 crate\" offline. In code order."
          items:
            $ref: "#/components/schemas/OfflineUom"
        receiptLinkTemplate:
          type:
            - string
            - "null"
          description: "The receipt link (2.24.0, CR-033 point 1, ADR-0083): an absolute `https` URL containing `{token}`, which the till fills with each sale's own token to show and print the link before the sale reaches the server. Null while the shop's address is not configured: the till then makes no link and sends no `receiptToken`, and the sale syncs as before. Always sent; optional so no earlier example changes."
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - register
        - generatedAt
        - validUntil
        - priceListVersionIds
        - taxSchemeVersionId
        - taxCells
        - products
        - stockUnits
        - paymentMethods
        - reasonCodes
        - policy
        - uoms
        - currency
    CounterSaleLine:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        stockUnitId:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          type: string
          pattern: "^[A-Z]{2,10}$"
          description: "The unit the line is sold in (CR-038, 2.11.0): one of the product's `OfflineProduct.sellingUnits` at this register; `quantity` and `agreedUnitPricePesewas` are in it. Absent, the first unit the product is sold by (its `saleUom` when it is priced in it, a crate of eggs). The server issues the stock in the base unit (30 eggs a crate) and prices the line by that unit's own entry. A unit the product is not sold by at the register is 400 `VALIDATION_FAILED` on `/lines/{i}/uom` (`UNIT_NOT_SOLD`)."
        weightKg:
          $ref: "#/components/schemas/Kilograms"
        weightSource:
          $ref: "#/components/schemas/WeightSource"
        gradeId:
          type: string
          format: uuid
        agreedUnitPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        varianceReasonCode:
          type: string
      required:
        - productId
        - quantity
        - agreedUnitPricePesewas
      additionalProperties: false
    OfflineSaleLine:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        stockUnitId:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        uom:
          type: string
          pattern: "^[A-Z]{2,10}$"
          description: "The unit the line is sold in (CR-038, 2.11.0): one of the product's `OfflineProduct.sellingUnits` at this register; `quantity` and `agreedUnitPricePesewas` are in it. Absent, the first unit the product is sold by (its `saleUom` when it is priced in it, a crate of eggs). The server issues the stock in the base unit (30 eggs a crate) and prices the line by that unit's own entry. A unit the product is not sold by at the register is 400 `VALIDATION_FAILED` on `/lines/{i}/uom` (`UNIT_NOT_SOLD`)."
        weightKg:
          $ref: "#/components/schemas/Kilograms"
        weightSource:
          $ref: "#/components/schemas/WeightSource"
        gradeId:
          type: string
          format: uuid
        agreedUnitPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        varianceReasonCode:
          type: string
        overrideApproval:
          type: object
          description: "A price beyond the cashier's own override limit approved on the till by a supervisor's PIN (2.17.0, the owner on 2026-11-18, ADR-0080). Checked at sync like every PIN approval: a supervisor of the branch, not the cashier, with that PIN version in force and not locked when the sale was made, and a variance within the supervisor's own line limit. The price charged always stands; every difference from the server's price is raised (`PRICE_OVERRIDE`, REVIEW within the cashier's limit, URGENT beyond it)."
          properties:
            approvedById:
              type: string
              format: uuid
            approvedByPinVersion:
              type: integer
              minimum: 1
              maximum: 1000000
          required:
            - approvedById
            - approvedByPinVersion
          additionalProperties: false
      required:
        - productId
        - quantity
        - agreedUnitPricePesewas
      additionalProperties: false
    TenderInput:
      type: object
      properties:
        paymentMethodId:
          type: string
          format: uuid
        amountPesewas:
          allOf:
            - $ref: "#/components/schemas/Pesewas"
          description: "Amount applied to the sale."
        paymentId:
          type: string
          format: uuid
          description: "For mobile money or card: the payment already initiated and cleared."
        tenderedPesewas:
          allOf:
            - $ref: "#/components/schemas/Pesewas"
          description: "Cash handed over, for change."
        unverifiedMobileMoney:
          allOf:
            - $ref: "#/components/schemas/UnverifiedMobileMoneyInput"
          description: "Offline only, and only while the setting pos.offline.allow_unverified_mobile_money is on for the branch: a mobile money tender that could not be verified. At sync it is recorded as an UNVERIFIED payment, PENDING, on the sale's own open shift and allocated to the receipt, with an UNVERIFIED_PAYMENT reconciliation break until a settlement or statement line matches it (ADR-0027, OFFLINE_SYNC 9.9, 2.15.0). With the setting off it is not recorded and is raised (UNMATCHED_PAYMENT)."
      required:
        - paymentMethodId
        - amountPesewas
      additionalProperties: false
    UnverifiedMobileMoneyInput:
      type: object
      properties:
        payerPhone:
          $ref: "#/components/schemas/PhoneNumber"
        network:
          type: string
          enum:
            - MTN
            - TELECEL
            - AIRTELTIGO
        providerReference:
          type: string
          description: "The transaction id the customer showed, if any."
        approvedByPinVersion:
          type: integer
          minimum: 1
          maximum: 1000000
          description: "The approver's till PIN version, which the till checked their PIN against (2.17.0, CR-032 point 4, ADR-0080). The server checks it at sync: a supervisor of the branch, not the cashier, with that version in force and not locked when the sale was made, is a verified approval (`approvalVerified: true` on the break, REVIEW); anything else is still recorded and its break is URGENT."
        approvedById:
          type: string
          format: uuid
          description: "The supervisor who approved taking it while offline, as the till records it. Kept on the break as the till's word (2.15.0): a person who holds no `pos.shift.close.approve` at the branch, or is the cashier, makes the break URGENT; the PIN that proves the approval is B09b continued 3's."
      required:
        - payerPhone
        - network
        - approvedById
      additionalProperties: false
    CounterSaleBuyer:
      type: object
      description: "A business buyer named at the counter (2.26.0, A-285 (c)). The TIN is Restricted (DC-25): printed in full on the receipt document and its archived render only; the counter sale's answer, its stored copy and every replay show it masked to its last four characters (2.28.0, the owner on A-285 (f)); never logged, audited only masked; a sync result and the exception report never carry it."
      properties:
        name:
          type: string
          maxLength: 400
          description: "As printed: trimmed, 1 to 160 characters, no control characters."
        tin:
          type: string
          maxLength: 40
          description: "A Ghana TIN: a GRA TIN (one of P, C, G, Q or V and ten digits, for example `C0000000042`) or an individual's Ghana Card PIN (`GHA-`, nine digits, `-`, a check digit). Trimmed and upper-cased as printed."
      required:
        - name
        - tin
    CounterSale:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Client-generated UUIDv7; becomes the order id. A resubmission returns the first result."
        shiftId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        customerPhone:
          allOf:
            - $ref: "#/components/schemas/PhoneNumber"
          description: "For an SMS or WhatsApp receipt."
        buyer:
          allOf:
            - $ref: "#/components/schemas/CounterSaleBuyer"
          description: "A business buyer named on the receipt without a customer account (2.26.0, A-285 (c)), so they can reclaim the input tax: printed as the receipt's customer name and TIN. Never with `customerId` (422 `COUNTER_SALE_INVALID` `BUYER_WITH_CUSTOMER`); naming a buyer creates no customer and the sale stays a walk-in's. A name or TIN of a form that may not be printed is refused before anything is posted: 422 `COUNTER_SALE_INVALID` with `BUYER_NAME_INVALID` at `/buyer/name` or `BUYER_TIN_INVALID` at `/buyer/tin`. Optional; left out, nothing changes."
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CounterSaleLine"
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/TenderInput"
        occurredAt:
          type: string
          format: date-time
        receiptToken:
          type: string
          pattern: "^[A-Za-z0-9_-]{22,86}$"
          description: "The receipt link's token for a live sale (2.51.0, BL-133, ADR-0083 Amendments, A-398), of `OfflineSale.receiptToken`'s form and made the same way: by the till once for this sale, from the device's cryptographically secure generator (at least 128 random bits, base64url without padding), never derived from the sale's id, the device, the shift or the time, and sent again unchanged with a resubmission of the same key. The server stores only its SHA-256, in the sale's own transaction, and the link (`OfflinePack.receiptLinkTemplate` filled with it) reads at once for twelve months (`getPublicReceipt`); a resubmission makes no second link. **A token already bound to another sale, or shaped like an identifier (a UUID), never refuses the sale**: the sale completes and answers as without it, only its link is refused, the refusal is recorded once and reaches the daily exception report's source as `RECEIPT_TOKEN_REFUSED` (URGENT, abuse case 37), and the refused token opens nothing for it. A token not of this form is 400 `VALIDATION_FAILED`, as in a sync. **The receipt SMS (A-396):** a sale with `customerPhone` and a till link gets one text linking its receipt; with no token, or a refused one, it gets none (`NO_LINK`; since 2.52.0 a sale with no token is counted on the daily exception report, `countLines`, and a refused one is its own item). Optional; left out, the sale is exactly as before."
      required:
        - id
        - shiftId
        - lines
        - tenders
        - occurredAt
      additionalProperties: false
    CounterSaleResult:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/SalesOrder"
        receipt:
          $ref: "#/components/schemas/BillingDocument"
        changeDuePesewas:
          $ref: "#/components/schemas/Pesewas"
        currency:
          $ref: "#/components/schemas/Currency"
        escPosBase64:
          type:
            - string
            - "null"
          description: "The thermal receipt, ready for the printer."
      required:
        - order
        - receipt
        - changeDuePesewas
        - currency
        - escPosBase64
    OfflineSale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceCounter:
          type: integer
          description: "Gap-free per shift on the device. A missing value is a suppressed sale and becomes an exception."
        provisionalRef:
          type: string
        occurredAt:
          type: string
          format: date-time
        customerPhone:
          $ref: "#/components/schemas/PhoneNumber"
        buyer:
          allOf:
            - $ref: "#/components/schemas/CounterSaleBuyer"
          description: "A business buyer named on the receipt without a customer account (2.26.0, A-285 (c), (e)), covered by `payloadHash`. Printed on the synced receipt when both the name and the TIN are of a form that may be printed. **A synced sale is always recorded:** otherwise the sale is recorded and its receipt issued without them, and the result names the exception `BUYER_DETAILS_REFUSED` (REVIEW, on the daily exception report's source once per sale; the TIN is never echoed whole). Creates no customer. Optional."
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OfflineSaleLine"
        tenders:
          type: array
          items:
            $ref: "#/components/schemas/TenderInput"
        receiptToken:
          type: string
          pattern: "^[A-Za-z0-9_-]{22,86}$"
          description: "The receipt link's token (2.24.0, CR-033 point 2, ADR-0083): made by the till once for this sale, when it is made, from the device's cryptographically secure generator (at least 128 random bits, base64url without padding), never derived from the sale's id, the device, the shift or the time, and kept with the sale so a resend carries the same token. Part of the canonical sale `payloadHash` covers. The server stores only its SHA-256 and the link reads from the sale's first sync for twelve months (`getPublicReceipt`); a resend (`DUPLICATE`) changes nothing. **A token already bound to another sale, or shaped like an identifier (a UUID), is refused**: the sale is still recorded, only its link is refused, the result names the exception `RECEIPT_TOKEN_REFUSED` (URGENT, abuse case 37, on the daily exception report's source once per refused sale, naming the device, the shift, the cashier and both sales), the refused token opens nothing for it, and the sale is marked as needing a fresh link made by the server, which B11's receipt SMS sends. Optional, so a till without the template still syncs."
        payloadHash:
          type: string
          description: "SHA-256 of the canonical sale, computed on the device."
      required:
        - id
        - deviceCounter
        - provisionalRef
        - occurredAt
        - lines
        - tenders
        - payloadHash
      additionalProperties: false
