    GoodsReceiptLineInput:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        purchaseOrderLineId:
          type: string
          format: uuid
        uom:
          type: string
          pattern: "^[A-Z]{2,10}$"
          description: "The unit `qtyReceived` and `qtyRejected` are counted in (B09e continued): the product's base unit when left out, or a unit it converts from (`listUomConversions`), converted by the server's exact conversion, never by a factor of the line's own. The line keeps it; stock moves in the base unit. A unit the product does not convert from is 422 `GOODS_RECEIPT_INVALID` with `NO_CONVERSION`, a quantity that would need a fourth decimal place in the base unit `INEXACT_QUANTITY`."
        qtyReceived:
          $ref: "#/components/schemas/Quantity"
          description: "Accepted, in `uom`."
        qtyRejected:
          $ref: "#/components/schemas/Quantity"
          description: "Rejected at the door, in `uom`."
        rejectionReasonCode:
          type: string
          pattern: "^[A-Z][A-Z_]{1,39}$"
          description: "Why `qtyRejected` was turned away: a `GOODS_RECEIPT_REJECTION` reason (CRACKED, BROKEN, DIRTY, SHORT, WRONG_ITEM_DELIVERED, QUALITY_REJECTED; B09e continued 2). Required when `qtyRejected` is above zero (422 `GOODS_RECEIPT_INVALID` with `REJECTION_REASON_REQUIRED`) and refused when it is zero or left out, or when the code is not a `GOODS_RECEIPT_REJECTION` reason (`REASON_NOT_ALLOWED`)."
        rejectionNote:
          type: string
          minLength: 1
          maxLength: 500
          description: "Required when the reason has `requiresNote` (`NOTE_REQUIRED`); refused with nothing rejected (`REASON_NOT_ALLOWED`)."
        weightKg:
          $ref: "#/components/schemas/Kilograms"
        weightSource:
          $ref: "#/components/schemas/WeightSource"
        valuePesewas:
          allOf:
            - $ref: "#/components/schemas/Pesewas"
          description: "The cost of the accepted quantity, typed from the supplier's paper; a typed value always wins. **Optional on a line that names `purchaseOrderLineId`** (CR-040, 2.9.0): left out, the server values the line from its order line for the accepted quantity, `half_up(unitPricePesewas x qtyOrdered x qtyReceived in the base unit / qtyOrdered in the base unit)`, rounded half-up once (ADR-0001), and the receipt's answer shows it on the line and in `totalValuePesewas`; 23 eggs of a 30-egg crate ordered at 4,751 are 3,642. That value is the order price only: a levy the farm cannot reclaim reaches purchase price variance through the supplier's invoice, never the receipt. An order line the server cannot use is 422 `GOODS_RECEIPT_INVALID` on `/lines/{i}/purchaseOrderLineId` with `ORDER_LINE_UNKNOWN` (not a line of the receipt's `purchaseOrderId`, or the receipt names no order) or `ORDER_LINE_OTHER_PRODUCT`. **Required on a line that names no order line**: left out, it is 400 `VALIDATION_FAILED` on `/lines/{i}/valuePesewas`, as before."
        batchNo:
          type: string
        expiresOn:
          type: string
          format: date
        animals:
          type: array
          items:
            $ref: "#/components/schemas/AnimalArrivalInput"
      required:
        - productId
        - qtyReceived
      additionalProperties: false
