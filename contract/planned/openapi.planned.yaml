    OrderCreditCheck:
      type: object
      description: "An order's credit check, worked out by the server as `confirmOrder` would judge it now (CR-046). The screen shows these figures and never computes them."
      properties:
        order:
          $ref: "#/components/schemas/DocumentRef"
        customer:
          anyOf:
            - $ref: "#/components/schemas/CustomerRef"
            - type: "null"
        outcome:
          type: string
          enum:
            - PASSES
            - OVER_LIMIT
            - PAST_TERMS
            - ON_HOLD
            - NOT_REQUIRED
            - NO_ACCOUNT
          description: "`NOT_REQUIRED`: not a credit order. `NO_ACCOUNT`: a credit order for a customer with no open business account, which confirmOrder refuses (`CREDIT_CHECK_UNAVAILABLE`). Otherwise the first reason, or `PASSES`."
        reasons:
          type: array
          items:
            type: string
            enum:
              - ON_HOLD
              - OVER_LIMIT
              - PAST_TERMS
          description: "Every reason that holds: the hold, then the limit, then the terms."
        creditLimitPesewas:
          $ref: "#/components/schemas/Pesewas"
        exposurePesewas:
          allOf:
            - $ref: "#/components/schemas/Pesewas"
          description: "Outstanding invoices plus confirmed credit orders not yet invoiced, before this order."
        orderPesewas:
          allOf:
            - $ref: "#/components/schemas/Pesewas"
          description: "This order's estimated total, as the limit counts it."
        overLimitPesewas:
          allOf:
            - $ref: "#/components/schemas/Pesewas"
          description: "By how much exposure plus this order exceeds the limit; nil within it (exactly at the limit is within)."
        overduePesewas:
          $ref: "#/components/schemas/Pesewas"
        oldestOverdueDays:
          type:
            - integer
            - "null"
        paymentTermsDays:
          type: integer
        override:
          anyOf:
            - $ref: "#/components/schemas/CreditOverrideState"
            - type: "null"
        checkedAt:
          type: string
          format: date-time
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - order
        - customer
        - outcome
        - reasons
        - creditLimitPesewas
        - exposurePesewas
        - orderPesewas
        - overLimitPesewas
        - overduePesewas
        - oldestOverdueDays
        - paymentTermsDays
        - override
        - checkedAt
        - currency
    CreditOverridePending:
      description: "The 202 of a credit override asked for (CR-046): the approval, with the credit check it was asked on, so the answer carries the amount over the limit and the reasons."
      allOf:
        - $ref: "#/components/schemas/ApprovalPending"
        - type: object
          properties:
            creditCheck:
              $ref: "#/components/schemas/OrderCreditCheck"
          required:
            - creditCheck
    OrderConfirm:
      type: object
      description: "Optional (CR-046). A credit order refused for credit is confirmed only under an approved override; with a written reason, and none waiting, the override is asked for instead (202)."
      properties:
        creditOverrideReason:
          type: string
          maxLength: 500
      additionalProperties: false
    OrderPendingConsent:
      type: object
      description: "What an order waits for its customer to answer (CR-053): a weighed total above the tolerance (`HIGHER_TOTAL`), a substitute (`SUBSTITUTION`) or a smaller quantity (`SHORT_PICK`). Answer it with `recordCustomerConsent` of the same `kind`."
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - HIGHER_TOTAL
            - SUBSTITUTION
            - SHORT_PICK
        lineId:
          type: string
          format: uuid
          description: "The order line asked about."
        proposed:
          anyOf:
            - type: object
              properties:
                productId:
                  type: string
                  format: uuid
                productName:
                  type: string
                quantity:
                  $ref: "#/components/schemas/Quantity"
                uom:
                  type: string
              required:
                - productId
                - productName
                - quantity
                - uom
            - type: "null"
          description: "The substitute, or the line's own product at the smaller quantity; null for a higher total."
        proposedTotalPesewas:
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
          description: "A substitute's line total at the price the engine gave when it was proposed; null otherwise."
        weighedTotalPesewas:
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
          description: "A higher total: the line's total at its weighed kilograms; null otherwise."
        askedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - lineId
        - proposed
        - proposedTotalPesewas
        - weighedTotalPesewas
        - askedAt
    ShortPickCreate:
      type: object
      description: "A smaller quantity of an open line, in its own unit (CR-054 point 2)."
      properties:
        lineId:
          type: string
          format: uuid
        quantity:
          allOf:
            - $ref: "#/components/schemas/Quantity"
          description: "What can be sent, at least nothing and less than was ordered."
        note:
          type: string
          maxLength: 500
      required:
        - lineId
        - quantity
        - note
      additionalProperties: false
    ExceptionReview:
      type: object
      description: "An exception item marked reviewed (CR-059): once, by a holder of `rpt.exceptions.review` other than the person the item names."
      properties:
        reviewedBy:
          $ref: "#/components/schemas/PrincipalRef"
        reviewedAt:
          type: string
          format: date-time
        note:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - reviewedBy
        - reviewedAt
        - note
    ExceptionReviewCreate:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: "What was done or found, as `ReasonRequest.reason`."
      required:
        - note
