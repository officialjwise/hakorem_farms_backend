          type:
            - string
            - "null"
          pattern: "^(0|[1-9][0-9]{0,10})\\.[0-9]{3}$"
          description: "2.43.0 (the owner, 2026-11-23, A-328 (c)): how much of this line's own quantity is available now, in the product's base unit (`availableNowUom`): what the quote holds for it and what is free to promise now, never more than the line asks for, so never the farm's stock level. Null for a free-text line, and once the quote is declined or expired."
