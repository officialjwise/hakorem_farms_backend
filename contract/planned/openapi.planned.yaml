    StandingOrderRun:
      type: object
      description: "One run date of a standing order, written once. `CREATED`: the order made, PLACED. `HELD_FOR_CREDIT`: the order made and left PLACED because the credit check refused it (over the limit or past the terms); it needs a credit override to be confirmed. `SKIPPED_ON_HOLD`, `SKIPPED_NO_PRICE` (a line needs a quote), `MISSED` (the job did not run that day) and `FAILED` made no order; `reason` says why."
