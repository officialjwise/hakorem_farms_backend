components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-hk_s_at
      description: "Staff access token, 10 minutes, set by /auth/staff/login and /auth/totp/verify. HttpOnly, Secure, SameSite=Strict, bound to the API host. Refresh cookie: `__Host-hk_s_rt`."
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-hk_c_at
      description: "Customer access token. Refresh cookie: `__Host-hk_c_rt`."
    investorSession:
      type: apiKey
      in: cookie
      name: __Host-hk_i_at
      description: "Investor access token. Refresh cookie: `__Host-hk_i_rt`."
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "hk_live_<prefix>.<secret>"
      description: "Integration API key. Scoped by the role grants of its integration principal and rate-limited per key."
    deviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: "Credential of an enrolled point-of-sale device, sent together with the cashier's staff session."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "A UUID generated by the client for this user action and reused on every retry. The same key with a different body is refused with 409."
      schema:
        type: string
        format: uuid
      example: "019a7b1d-1c55-7fe4-b51c-071c42887ffa"
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: "The `csrfToken` from GET /auth/session."
      schema:
        type: string
      example: c3f1a0b2e5d94c7f8a61b0e2d4c9f7a3
    CsrfTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: "Required when the caller has a session; not used by guests, or during login when a challenge token is sent instead."
      schema:
        type: string
      example: c3f1a0b2e5d94c7f8a61b0e2d4c9f7a3
  headers:
    CorrelationId:
      description: "The correlation id of the request. The same value appears in logs, traces and any error body."
      schema:
        type: string
        format: uuid
      example: "019a7b1d-3b44-79c8-8f00-a553bc391e31"
  responses:
    BadRequest:
      description: "The request is malformed or fails validation."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: "Some fields are not valid."
              correlationId: "019a7b1d-5a33-73ab-98e3-438b35eabc69"
              details:
                - field: "/lines/0/weightKg"
                  code: PATTERN
                  message: "Weight must have exactly three decimal places, for example 24.350."
    Unauthenticated:
      description: "No valid session or key."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHENTICATED
              message: "Please log in again."
              correlationId: "019a7b1d-7922-7d8f-a2c7-e1c2af9b5aa0"
              details: []
    Forbidden:
      description: "Authenticated, but not permitted. Also returned when the record exists but belongs to someone else."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: "You do not have permission to do this here."
              correlationId: "019a7b1d-9811-7772-bcaa-7ffa294cf8d8"
              details: []
    NotFound:
      description: "No such record, or not visible to the caller."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: "We could not find that record."
              correlationId: "019a7b1d-b700-7156-868e-1e31a2fd970f"
              details: []
    Conflict:
      description: "The record changed since it was read (version mismatch), or the idempotency key was reused with a different body."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VERSION_CONFLICT
              message: "Someone else changed this record. Reload and try again."
              correlationId: "019a7b1d-d5ef-7b39-9071-bc691cae3547"
              details: []
    BusinessRuleViolation:
      description: "The request is valid but a business rule refuses it. `code` says which; see docs/API.md."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: STOCK_UNIT_ON_HOLD
              message: "Goat G-0163 is under a veterinary withdrawal period until 28 November and cannot be sold."
              correlationId: "019a7b1d-f4de-751c-aa55-5aa0965fd37e"
              details: []
    RateLimited:
      description: "Too many requests. Retry after the number of seconds in `Retry-After`."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          description: "Seconds to wait."
          schema:
            type: integer
          example: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: "Too many attempts. Please wait a minute and try again."
              correlationId: "019a7b1e-13cd-7f00-b438-f8d8101071b5"
              details: []
    InternalError:
      description: "Unexpected failure. Nothing was committed. Quote the correlation id."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL
              message: "Something went wrong on our side. Please quote the reference if you call us."
              correlationId: "019a7b1e-32bc-78e3-8e1c-970f89c10fed"
              details: []
    ServiceUnavailable:
      description: "A dependency is down. The counter continues offline."
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: "The service is temporarily unavailable."
              correlationId: "019a7b1e-51ab-72c7-97ff-35470372ae24"
              details: []
  schemas:
    Pesewas:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: "An amount of money in integer pesewas (GHS 1.00 = 100). Never negative: direction is carried by a separate field. Never a float."
      examples:
        - 127500
    Currency:
      type: string
      enum:
        - GHS
      description: "ISO 4217 currency of every money field on the object. Only GHS in version 1."
    Kilograms:
      type: string
      pattern: "^(0|[1-9][0-9]{0,6})\\.[0-9]{3}$"
      description: "A weight in kilograms as a decimal string with exactly three decimal places. A string, never a JSON number, so it is never rounded by a float."
      examples:
        - "24.350"
    Quantity:
      type: string
      pattern: "^(0|[1-9][0-9]{0,10})\\.[0-9]{3}$"
      description: "A non-negative quantity in the stated unit of measure, as a decimal string with exactly three decimal places."
      examples:
        - "3.000"
    SignedQuantity:
      type: string
      pattern: "^-?(0|[1-9][0-9]{0,10})\\.[0-9]{3}$"
      description: "A quantity that may be negative (a variance, or a balance that an allowed movement took below zero), as a decimal string with three decimal places."
      examples:
        - "-2.000"
    Percent:
      type: string
      pattern: "^(100|[0-9]{1,2})(\\.[0-9]{1,4})?$"
      description: "A percentage from 0 to 100 as a decimal string, up to four decimal places."
      examples:
        - "15.00"
    Units:
      type: string
      pattern: "^(0|[1-9][0-9]{0,13})\\.[0-9]{4}$"
      description: "Investor shareholding units, as a decimal string with four decimal places."
      examples:
        - "1000.0000"
    Coordinate:
      type: string
      pattern: "^-?[0-9]{1,3}\\.[0-9]{1,6}$"
      description: "A latitude or longitude in decimal degrees, as a string."
      examples:
        - "5.787421"
    Celsius:
      type: string
      pattern: "^-?[0-9]{1,2}\\.[0-9]$"
      description: "A temperature in degrees Celsius to one decimal place, as a string."
      examples:
        - "3.5"
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: "A time of day in Africa/Accra, HH:MM."
      examples:
        - "09:00"
    PhoneInput:
      type: string
      pattern: "^\\+?[0-9][0-9 -]{6,22}$"
      description: "A phone number as a person types it (1.8.0). It is stored in E.164: a Ghanaian number typed locally, `0244123456`, `024 412 3456` or `233244123456`, becomes `+233244123456`. A value that is no Ghanaian or E.164 number is refused with 400 and `details[].code` `INVALID_PHONE`."
      examples:
        - "0244512876"
    PhoneNumber:
      type: string
      pattern: "^\\+[1-9][0-9]{7,14}$"
      description: "A phone number in E.164 form. Ghanaian numbers are +233 followed by nine digits."
      examples:
        - "+233244512876"
    WeightSource:
      type: string
      enum:
        - SCALE
        - MANUAL
        - ESTIMATE
      description: "How a weight was captured: read from a scale, typed in, or estimated."
    PageLimit:
      type: integer
      minimum: 1
      maximum: 100
      default: 25
      description: "Maximum number of results in a page."
    PageInfo:
      type: object
      description: "Cursor pagination. Pass `nextCursor` as `cursor` to get the next page."
      properties:
        nextCursor:
          type:
            - string
            - "null"
          description: "Opaque cursor for the next page. Null on the last page."
        limit:
          type: integer
        hasMore:
          type: boolean
      required:
        - nextCursor
        - limit
        - hasMore
    ErrorDetail:
      type: object
      properties:
        field:
          type:
            - string
            - "null"
          description: "JSON pointer to the offending input, when the error is about one field."
        code:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
    Error:
      type: object
      description: "The single error envelope. Every non-2xx response uses it."
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: "Stable machine code. See docs/API.md for the catalogue. Each implemented operation lists the codes it can raise in `x-error-codes`; INTERNAL can come from any operation."
        message:
          type: string
          description: "A sentence safe to show to a user. Never contains internal detail."
        correlationId:
          type: string
          format: uuid
          description: "Quote this to support. It appears in every log line and trace of the request."
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
      required:
        - code
        - message
        - correlationId
        - details
    BranchRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    LocationRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LocationKind"
      required:
        - id
        - code
        - name
        - kind
    LocationKind:
      type: string
      enum:
        - SITE
        - PEN
        - COLD_ROOM
        - STORE
        - SHOP_FLOOR
        - VEHICLE
        - RETURNS_HOLD
        - QUARANTINE
        - IN_TRANSIT
        - SUPPLIER
        - CUSTOMER
        - PRODUCTION
        - PROCESSING
        - CONSUMPTION
        - LOSS
        - ADJUSTMENT
        - OPENING
    PrincipalRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required:
        - id
        - displayName
    ProductRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
      required:
        - id
        - sku
        - name
    CategoryRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    CustomerPublicId:
      type: string
      pattern: "^cus_[0-9A-HJKMNP-TV-Z]{16}$"
      description: "A customer's public ID (2.0.0, ADR-0073): `cus_` and sixteen characters of Crockford base32 (no I, L, O or U) drawn by the server from a cryptographically secure source, 80 bits, so it cannot be guessed or counted through. What people see and type for a customer in place of the sequential number (`C-00001`), which is no longer shown; unique, never reused, never changed, never sent by a client. Ids (UUIDs) stay in paths and are never shown to people. Knowing one reads nothing without authorisation."
      example: cus_8F3K2M9Q7X4T1V6B
    SupplierPublicId:
      type: string
      pattern: "^sup_[0-9A-HJKMNP-TV-Z]{16}$"
      description: "A supplier's public ID (2.0.0, ADR-0073): `sup_` and sixteen characters of Crockford base32, as `CustomerPublicId`. In place of the sequential supplier number (`S-0001`), which is no longer shown."
      example: sup_4N7Q1X9K3M6T2V8B
    CustomerRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicId:
          $ref: "#/components/schemas/CustomerPublicId"
        name:
          type: string
      required:
        - id
        - publicId
        - name
    SupplierRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicId:
          $ref: "#/components/schemas/SupplierPublicId"
        name:
          type: string
      required:
        - id
        - publicId
        - name
    StockUnitRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
          description: "Tag number of an animal or batch number of a lot."
        tracking:
          type: string
          enum:
            - SERIAL
            - LOT
      required:
        - id
        - identifier
        - tracking
    DocumentRef:
      type: object
      description: "A reference to any business document, through the document registry."
      properties:
        id:
          type: string
          format: uuid
        docType:
          type: string
        number:
          type:
            - string
            - "null"
          description: "The document number, once one has been allocated."
      required:
        - id
        - docType
        - number
    TaxCategoryRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    SpeciesRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    GradeRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    WeightBandRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        minKg:
          $ref: "#/components/schemas/Kilograms"
        maxKg:
          $ref: "#/components/schemas/Kilograms"
      required:
        - id
        - code
        - minKg
        - maxKg
    DeliveryZoneRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    InvestorRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investorNo:
          type: string
        name:
          type: string
      required:
        - id
        - investorNo
        - name
    BankAccountRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - BANK
            - MOBILE_MONEY
        last4:
          type: string
      required:
        - id
        - name
        - kind
        - last4
    AccountRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    StoredFileRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
      required:
        - id
        - originalName
        - contentType
    PriceBand:
      type: object
      description: "A selling price band. Always a selling price, never a cost."
      properties:
        listPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        floorPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        ceilingPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        basis:
          $ref: "#/components/schemas/PriceBasis"
      required:
        - listPricePesewas
        - floorPricePesewas
        - ceilingPricePesewas
        - basis
    PriceBasis:
      type: string
      enum:
        - PER_HEAD
        - PER_KG
        - PER_UNIT
      description: "What the price multiplies."
    AddressSnapshot:
      type: object
      properties:
        recipientName:
          type: string
