    ExceptionKind:
      type: string
      enum:
        - SALE_VOID
        - PRICE_OVERRIDE
        - REFUND
        - MORTALITY
        - STOCK_ADJUSTMENT
        - STOCK_EXCEPTION
        - UNMATCHED_PAYMENT
        - WEBHOOK_REJECTED
        - DRIVER_VARIANCE
        - SHIFT_OVER_SHORT
        - DEVICE_COUNTER_GAP
        - AUTHORISATION_FAILURE
        - BULK_EXPORT
        - CREDIT_OVERRIDE
        - PAYOUT_DETAIL_CHANGE
        - PERMISSION_CHANGE
        - YIELD_VARIANCE
        - AUDIT_INTEGRITY
        - RECONCILIATION_BREAK
        - SYNC_REJECTED
        - LATE_POSTING
        - QUOTE_ACCEPTED_BY_STAFF
        - CASH_DROP
        - MORTALITY_PHOTO_REUSED
        - DELIVERY_PHOTO_REUSED
        - CASH_HANDED_IN_LATE
        - NEGATIVE_STOCK
        - GOODS_RECEIPT_UNMATCHED
        - ORDER_SPLITTING
        - SUPPLIER_VARIANCE
        - SUPPLIER_CREDIT_NOTE
        - PROCESSING_REVERSAL
        - ASSET_DISPOSAL
        - CREDIT_NOTE
        - PAYMENT_REVERSAL
        - RECEIPT_CLAIM
        - RECEIPT_TOKEN_REFUSED
        - OFFLINE_SALE_REVIEW
        - BAD_DEBT_WRITE_OFF
        - WRITTEN_OFF_CUSTOMER_PAID
        - CONSENT_RECORDED_BY_STAFF
        - DELIVERY_FAILURE
        - DELIVERY_WRITE_OFF
        - DELIVERY_RETURN
        - DELIVERY_REASSIGNED
        - PART_DELIVERY
        - DELIVERY_CANCELLED
        - BACKORDER_HELD
        - SALE_RETURN
        - MESSAGE_REPORT_REJECTED
        - MESSAGE_SUPPRESSED
        - MESSAGE_FAILED
        - DOCUMENT_SENT
        - QUOTE_HOLD
        - QUOTE_WITHDRAWN
        - ACCEPTED_QUOTE_LAPSED
        - PAYMENT_AFTER_PAYOUT_CHANGE
        - CAPITAL_WITHDRAWAL
        - DISTRIBUTION
        - BACKDATED_CONTRIBUTION
        - RETENTION_RATE
        - LOAN_OR_GRANT
        - ACCRUAL_BLOCKED
        - OVERHEAD_ALLOCATION
        - PROJECTION_DRIFT
        - CHECKOUT_HOLDING
      description: "One kind per detection in the threat model; every abuse case lands as at least one kind (FR-RPT-007). The first twenty-two since 1.0.0; 2.48.0 (B12 continued 3, ADR-0103) adds the rest, CR-059's five controls among them (`CASH_DROP`, `MORTALITY_PHOTO_REUSED` beside `DELIVERY_PHOTO_REUSED`, `QUOTE_ACCEPTED_BY_STAFF`, `CASH_HANDED_IN_LATE`, `NEGATIVE_STOCK`). A kind the client does not know is shown by its code. The source's own finer kind is `sourceKind`."
    ExceptionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        exceptionDate:
          type: string
          format: date
        branchId:
          type:
            - string
            - "null"
          format: uuid
          description: "The branch the item belongs to; a company-wide item (a supplier, a webhook, a permission) is kept at the head office branch. Null only before a head office is set."
        kind:
          $ref: "#/components/schemas/ExceptionKind"
        severity:
          type: string
          enum:
            - INFO
            - REVIEW
            - URGENT
        abuseCases:
          type: array
          items:
            type: integer
          description: "Numbers of the abuse cases in docs/security/THREAT_MODEL.md this item helps detect."
        actor:
          anyOf:
            - $ref: "#/components/schemas/PrincipalRef"
            - type: "null"
        subjectDocument:
          anyOf:
            - $ref: "#/components/schemas/DocumentRef"
            - type: "null"
        amountPesewas:
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
        currency:
          $ref: "#/components/schemas/Currency"
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
          description: "What the item needs to be acted on, by kind: always `sourceEvent` ({id, type}) or the record it was swept from; a break also `breakId` and, as read now, `breakState` ({status, ageDays})."
        raisedAt:
          type: string
          format: date-time
        sourceKind:
          type:
            - string
            - "null"
          description: "The source's own finer kind where it has one: a till finding's `exceptionKind` (`TILL_PIN_LOCKED`, `LOCKED_CASHIER_SIGNED_OUT`, `OFFLINE_LATE_CASH`), a break's kind (`PROVIDER_PAID_AFTER_FAILURE`, `REFUND_FAILED`), `UNWITNESSED_CASH_DROP` or `WITNESSED_CASH_DROP`, `SHIFT_FORCE_CLOSED`, a void's `VOID_REQUESTED` or `VOIDED`, and so on."
        review:
          anyOf:
            - $ref: "#/components/schemas/ExceptionReview"
            - type: "null"
          description: "Who marked the item reviewed, when, and their note (CR-059); null until then."
      required:
        - id
        - exceptionDate
        - branchId
        - kind
        - severity
        - abuseCases
        - actor
        - subjectDocument
        - amountPesewas
        - currency
        - summary
        - details
        - raisedAt
        - sourceKind
        - review
      description: "One thing a manager must look at (FR-RPT-007, ADR-0103), raised by an event or a record the report reads. Its id is fixed by its source, so it is the same after a rebuild. No contact or identity details are ever copied into `details`."
    ExceptionItemPage:
      type: object
      description: "A page of `ExceptionItem` results."
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExceptionItem"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
