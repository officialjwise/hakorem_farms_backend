        - acceptedAt
    QuoteVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
        status:
          description: "`APPROVED` (2.19.0, the owner, 2026-11-19): a version below the margin floor that a second person approved and nobody has issued yet. It holds no stock, has sent nothing and has no link; `issueQuoteVersion` by someone other than its approver issues it and answers its link once."
          type: string
          enum:
            - DRAFT
            - PENDING_APPROVAL
            - APPROVED
            - ISSUED
            - SUPERSEDED
            - ACCEPTED
        validUntil:
          type: string
          format: date-time
        terms:
          type:
            - string
            - "null"
        deliveryEstimate:
          type:
            - string
            - "null"
        deliveryFeePesewas:
          $ref: "#/components/schemas/Pesewas"
          description: "The delivery fee as entered, in the version's pricing mode (`taxInclusive`), as the order and its invoice carry it; taxed as a delivery service (2.43.0, A-352)."
        taxInclusive:
          type: boolean
        netPesewas:
          $ref: "#/components/schemas/Pesewas"
        taxPesewas:
          $ref: "#/components/schemas/Pesewas"
          description: "The calculator's tax on the product lines and, from 2.43.0 (LOUD, the owner, 2026-11-23, A-352), on the delivery fee exactly as the invoice taxes it at dispatch: a `DELIVERY_SERVICE` line of the same calculation in the version's pricing mode (added on top of a tax-exclusive fee, taken out of a tax-inclusive one). Until 2.43.0 the fee was untaxed in the estimate. The quote's totals and the invoice's for the same lines and fee agree to the pesewa."
        grossPesewas:
          $ref: "#/components/schemas/Pesewas"
        estimatedCostPesewas:
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
        marginPercent:
          anyOf:
            - type: string
              pattern: "^-?[0-9]{1,7}\\.[0-9]{2}$"
            - type: "null"
          deprecated: true
          description: "**Deprecated (2.29.0, LOUD): this figure is markup, not margin** (the owner, 2026-11-23: margin is over the selling price, and anything worked over cost is markup and is named markup). It is unchanged: (lines' net less cost) over cost, as a percentage to two places rounded half away from zero, 19.05 for 1,700,000 over 1,428,000, and always equal to `markupPercent`. Kept under its old name for one release; read `markupPercent` for this figure and `marginOverPricePercent` for the margin. Never compared with the floor."
        markupPercent:
          anyOf:
            - type: string
              pattern: "^-?[0-9]{1,18}\\.[0-9]{2}$"
            - type: "null"
          description: "2.29.0 (the owner, 2026-11-23): markup over cost, (the product lines' net less cost) over cost, as a percentage to two places rounded half away from zero: 19.05 for 1,700,000 over 1,428,000. It may be negative (sold below cost) or above 100, so it is not a `Percent`. Null when the cost is unknown or nil. Not the margin, and never compared with the floor."
        marginOverPricePercent:
          anyOf:
            - type: string
              pattern: "^-?[0-9]{1,18}\\.[0-9]{2}$"
            - type: "null"
          description: "2.29.0 (the owner, 2026-11-23, A-342): the margin, over the selling price: (net less cost) over net, the net being the lines and the delivery fee before tax, as a percentage to two places rounded half away from zero. UAT scenario 2: 30.75 for 1,906,000 over a cost of 1,320,000, 30.77 for 1,716,000 over 1,188,000. Never above 100 (a nil cost is 100.00), negative when sold below cost; null when the cost is unknown or the net is nil. The floor (`belowMarginFloor`) is a margin over price too, but judged exactly on the amounts of the product lines alone, without the delivery fee, so a fee never lifts a version over it."
        belowMarginFloor:
          type: boolean
        subjectToStock:
          type: boolean
          description: "2.23.0 (the owner, 2026-11-18, A-328): a line was not wholly on hand when the version was issued; it was issued all the same, holding only what was there (see each line's `availableQuantity` and `heldQuantity`). False before issue."
        approvalRequestId:
          type:
            - string
            - "null"
          format: uuid
        changeNote:
          type:
            - string
            - "null"
        issuedAt:
          type:
            - string
            - "null"
          format: date-time
        issuedBy:
          anyOf:
            - $ref: "#/components/schemas/PrincipalRef"
            - type: "null"
        approvedBy:
          anyOf:
            - $ref: "#/components/schemas/PrincipalRef"
            - type: "null"
          description: "2.50.0 (LOUD, a new field on an existing answer; the owner, 2026-11-24, from the frontend's F10o): who approved this version below the margin floor, the person whose decision on its `QUOTE_BELOW_MARGIN` approval approved it (read from that decision, never stored again). Null unless the version went through approval and was approved: issued at once, still `PENDING_APPROVAL`, or rejected, it is null. It stays on the version once issued, superseded or accepted. `issueQuoteVersion` by this person is refused (422 `QUOTE_INVALID` `APPROVER_CANNOT_ISSUE`), so a console hides \"Issue and send\" from them. Always sent by this version of the server; a client may treat it as optional. Staff only: never on `PublicQuote`."
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
        acceptance:
          anyOf:
            - $ref: "#/components/schemas/QuoteAcceptance"
            - type: "null"
        documentId:
          type:
            - string
            - "null"
          format: uuid
          description: "2.23.0 (FR-QUO-007, A-330): the archived rendering of this version (`getArchivedDocument`), its own revision of the quote's document, set once a few seconds after issue; null before."
        currency:
          $ref: "#/components/schemas/Currency"
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
          description: "The version's author (FR-QUO-006: each version with its author, time and totals)."
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          description: "Optimistic lock: `updateQuoteVersion` names it."
        acceptanceLinkToken:
          type:
            - string
            - "null"
          description: "The acceptance link's token (CR-047, ADR-0074): `quo_` and 256 random bits, answered only by the `issueQuoteVersion` call that made it and null everywhere else; the server keeps only its SHA-256. The link is `/shop/quotes/{token}`. Each call answers a fresh token for the same version; every token of a version opens it until the version is replaced, accepted, declined, withdrawn or its validity ends, or that one link is revoked (`revokeQuoteLink`)."
        acceptanceLinkId:
          type:
            - string
            - "null"
          format: uuid
          description: "2.21.0: the id of the link whose token this answer carries, to revoke it by (`revokeQuoteLink`); null wherever `acceptanceLinkToken` is null."
        links:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLink"
          description: "2.21.0 (the owner, 2026-11-18): every acceptance link made for this version, oldest first, each with its state. Several may be live at once; each is revoked on its own. Never a token: only its hash is kept."
      required:
        - id
        - versionNo
        - status
        - validUntil
        - terms
        - deliveryEstimate
        - deliveryFeePesewas
        - taxInclusive
        - netPesewas
        - taxPesewas
        - grossPesewas
        - estimatedCostPesewas
        - marginPercent
