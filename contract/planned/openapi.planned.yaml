            - DECLINED
            - EXPIRED
            - REPLACED
            - WITHDRAWN
            - REVOKED
          description: "What the buyer meets through this link now: `OPEN` (it opens the live version), `ACCEPTED` or `DECLINED` (it shows the decision), `EXPIRED`, `REPLACED` or `WITHDRAWN` (it answers 422 `QUOTE_LINK_CLOSED`), or `REVOKED` (it opens nothing, 404, as a link that never existed)."
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        revokedBy:
          anyOf:
            - $ref: "#/components/schemas/PrincipalRef"
            - type: "null"
        revokeReason:
          type:
            - string
            - "null"
      required:
        - id
        - state
        - createdAt
        - createdBy
        - expiresAt
        - revokedAt
        - revokedBy
        - revokeReason
