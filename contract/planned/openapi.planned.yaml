        - page
    StatementLine:
      type: object
      description: "One line of a customer statement: the brought-forward line first, then each line of the customer's trade receivables in ledger order with the running balance after it."
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          description: "`OPENING` brings the opening balance forward and moves nothing. `INVOICE` is an invoice or a receipt to the customer; `REFUND` a refund paid out; `PAYMENT_REVERSAL` a payment reversed or an allocation taken off; `ADJUSTMENT` a journal (an opening balance entered by the accountant included) or anything else posted to the account."
          enum:
            - OPENING
            - INVOICE
            - PAYMENT
            - CREDIT_NOTE
            - DEBIT_NOTE
            - REFUND
            - PAYMENT_REVERSAL
            - ADJUSTMENT
        reference:
          type: string
          description: "The source document's number, or `Payment` or `Journal` and the journal's number where the source has none."
        debitPesewas:
          $ref: "#/components/schemas/Pesewas"
        creditPesewas:
          $ref: "#/components/schemas/Pesewas"
        balancePesewas:
          $ref: "#/components/schemas/Pesewas"
        balanceSide:
          type: string
          description: "`D` when the customer owes the balance, `C` when it is in the customer's favour. A balance of zero is `D`."
          enum:
            - D
            - C
      required:
        - date
        - kind
        - reference
        - debitPesewas
        - creditPesewas
        - balancePesewas
        - balanceSide
