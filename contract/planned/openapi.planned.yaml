openapi: "3.1.0"
info:
  title: "HaKorem Farms Platform API"
  version: "2.52.0"
  summary: "The only interface between the HaKorem Farms backend and its frontends."
  description: "Trading, stock, money and investor reporting for a livestock, meat and produce business in Ghana.\n\nThis contract was written by hand in backend session B1, before any endpoint exists, so the frontend can build against a mock server. From B2 the backend generates it from code and CI fails if the generated file differs from this one.\n\nConventions, which apply to every operation, are in `docs/API.md`. In brief:\n\n- Money is integer pesewas in fields named `...Pesewas`, never a float and never negative; each object that carries money also carries `currency`.\n\n- Weights are decimal strings in kilograms with three places (`...Kg`), quantities are decimal strings with three places, and every captured weight carries its `weightSource`.\n\n- Every state-changing request sends `Idempotency-Key`; cookie-authenticated ones also send `X-CSRF-Token`.\n\n- Lists use cursor pagination. Errors use one envelope that carries a `correlationId`.\n\n- Times are UTC in RFC 3339; business dates are calendar dates in Africa/Accra.\n\n- A business refusal is 422 with a stable code; an action that needs a second person returns 202 with `ApprovalPending`.\n\nChanges are versioned and recorded in `docs/CONTRACT_CHANGELOG.md`."
  contact:
    name: "HaKorem Farms backend track"
    url: "https://github.com/officialjwise/hakorem_farms_backend"
  license:
    name: "Proprietary. All rights reserved."
    identifier: LicenseRef-Proprietary
servers:
  - url: "https://api.hakoremfarms.com/v1"
    description: Production
  - url: "https://api.staging.hakoremfarms.com/v1"
    description: Staging
  - url: "http://localhost:3000/v1"
    description: "Local development"
  - url: "http://localhost:4010"
    description: "Prism mock server, run from this file"
security:
  - staffSession: []
  - apiKey: []
tags:
  - name: platform
    description: "Health and files. Mechanisms shared by every module."
    x-displayName: Platform
  - name: auth
    description: "Login, sessions, passwords and second factor for the three realms: staff, customer and investor. Cookies are host-bound to the API and `SameSite=Strict`. See docs/API.md, Authentication."
    x-displayName: Authentication
  - name: iam
    description: "Staff accounts, roles, grants by branch and location, sessions, API keys, and the maker-checker approval inbox."
    x-displayName: "Users, roles and approvals"
  - name: aud
    description: "The audit log (Owner and Accountant only), its integrity, settings, number series, business profile, retention and data-subject requests."
    x-displayName: "Audit and administration"
  - name: mdm
    description: "Catalogue, categories, units, species, grades and weight bands, customers, suppliers, branches and locations, payment methods, delivery zones, reason codes, and spreadsheet import and export."
    x-displayName: "Master data"
  - name: pricing
    description: "Price lists in approved, effective-dated versions; the pricing engine; promotions and coupons. A price that does not resolve is a `QUOTE_REQUIRED` result, never an error."
    x-displayName: "Pricing and promotions"
  - name: tax
    description: "Named levies per tax category, each with its own rate, base and reclaimable flag, in effective-dated versions; and the tax calculator."
    x-displayName: Tax
  - name: inv
    description: "The append-only stock movement ledger, on-hand and valuation at cost, stock units and traceability, receipts, transfers, adjustments, stock takes, reservations, holds, exceptions, alerts and cold chain."
    x-displayName: Inventory
  - name: liv
    description: "The animal register, weights and growth, health and withdrawal periods, breeding, mortality and culling, rations and feed."
    x-displayName: Livestock
  - name: prc
    description: "Processing orders that turn animals into meat lots, offal and waste, with yield, exact cost allocation, packs and labels."
    x-displayName: Processing
  - name: pur
    description: "Supplier terms and payout details, requisitions, purchase orders with approval limits, supplier invoices with three-way match, supplier payments and performance."
    x-displayName: Procurement
  - name: fin
    description: "Chart of accounts, bank accounts, periods with lock and close, journals, manual journals, posting rules, financial statements and fixed assets."
    x-displayName: "General ledger"
  - name: doc
    description: "The immutable archive of every rendered document, signed download links, and branded templates editable without a deployment."
    x-displayName: Documents
  - name: ord
    description: "The single order record for every channel: placing, confirming, picking with weight capture, packing, dispatch, substitution with consent, cancellation, void and returns."
    x-displayName: "Orders and fulfilment"
  - name: pos
    description: "Registers and devices, shifts with blind close, cash movements, counter sales, held sales, the offline pack and idempotent offline sync."
    x-displayName: "Point of sale"
  - name: shp
    description: "The public catalogue, carts, delivery quotes and slots, catch-weight checkout with timed reservation, order tracking, and the customer account."
    x-displayName: "Online store"
  - name: quo
    description: "Requests for quote from the storefront, phone and WhatsApp; versioned quotes; acceptance by signed link; conversion to an order; pipeline reporting."
    x-displayName: Quotations
  - name: whl
    description: "Business accounts with credit limits and holds, credit overrides, standing orders, statements, ageing, dunning and bad debt."
    x-displayName: "Wholesale and credit"
  - name: bil
    description: "Invoices, receipts, proformas, credit and debit notes with the full levy breakdown, gap-free numbers, reprints and sending."
    x-displayName: Billing
  - name: pay
    description: "Payments by every method, mobile money initiation and verification, provider webhooks, allocation, refunds, store credit, open items, settlement and bank reconciliation, and the break queue."
    x-displayName: "Payments and reconciliation"
  - name: del
    description: "Slots and capacity, deliveries, routes, the driver view with proof of delivery, cash on delivery and driver cash reconciliation."
    x-displayName: Delivery
  - name: cap
    description: "Investors, capital contributions and withdrawals as units, the capital register, profit distribution by unit-days, loans and grants, and return metrics."
    x-displayName: "Capital and investors"
  - name: investor
    description: "Read-only views of the signed-in investor's own capital, share, distributions, statement and documents. Nothing else is reachable from this realm."
    x-displayName: "Investor portal"
  - name: cst
    description: "Cost per animal, pen, batch and processing order; margins by product, line, channel, customer, salesperson and branch; break-even; losses; overhead allocation."
    x-displayName: "Costing and profitability"
  - name: rpt
    description: "The owner dashboard, daily sales, the daily exception report, every other report through one run endpoint, exports and schedules."
    x-displayName: "Reports and dashboards"
  - name: ntf
    description: "Templates, trigger rules, the message log, opt-outs, preferences and in-app notifications."
    x-displayName: Notifications
  - name: api
    description: "Integrations, outbound webhooks with signed payloads and retries, the event catalogue, and accounting export."
    x-displayName: Integrations
x-tagGroups:
  - name: Platform
    tags:
      - platform
  - name: "Identity and access"
    tags:
      - auth
      - iam
      - aud
  - name: "Master data and pricing"
    tags:
      - mdm
      - pricing
      - tax
  - name: "Stock and production"
    tags:
      - inv
      - liv
      - prc
  - name: "Procurement and finance"
    tags:
      - pur
      - fin
      - doc
  - name: Selling
    tags:
      - ord
      - pos
      - shp
      - quo
      - whl
      - del
  - name: Money
    tags:
      - bil
      - pay
  - name: "Capital and insight"
    tags:
      - cap
      - investor
      - cst
      - rpt
      - ntf
      - api
