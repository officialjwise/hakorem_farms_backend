    Uom:
      type: object
      description: "A unit of measure from a fixed list seeded by migration: there is no operation that creates, changes or archives one (CR-011). A unit carries no conversion of its own: a product holds its stock in `baseUom` and is sold in `saleUom`, and the price list entry's `basis` says what a price multiplies. A countable product may also have alternative units, each an exact `UomConversion` to its base unit (FR-MDM-003, `listUomConversions`): grower pellets held by the kilogram come in a 50 kg `BAG`. Eggs are counted one by one in `EGG` (the egg unit, B09u) and sold by the `CRATE` of 30, each with a price of its own. A meat pack is held and priced by the kilogram (`baseUom` `KG`) with `nominalPackKg` as its standard size for estimates only; the weighed kilograms are what is charged, so a catch-weight product never has a conversion."
      properties:
        code:
          type: string
        name:
          type: string
          description: "The unit's title, as a heading or a column shows it (`Egg`, `Crate`)."
        singularName:
          type: string
          description: "The unit's name for one of it, lowercase, for a sentence: `egg`, `crate`, `kilogram`, `head` (B09u, 2.9.0). A screen says \"1 egg\" and \"from 1 crate\" with it."
        pluralName:
          type: string
          description: "The unit's name for more than one (or none), lowercase, for a sentence: `eggs`, `crates`, `kilograms`, `head` (B09u, 2.9.0). A screen says \"540 eggs\" and \"from 10 crates\" with it; a quantity that is not exactly 1 takes this name."
        kind:
          type: string
          enum:
            - COUNT
            - WEIGHT
            - VOLUME
        displayDecimals:
          type: integer
          minimum: 0
          maximum: 3
          description: "Decimal places a quantity in this unit is shown with: 0 for counted units, 3 for weight and volume (CR-003). The wire format keeps three places."
      required:
        - code
        - name
        - singularName
        - pluralName
        - kind
        - displayDecimals
    UomPage:
      type: object
      description: "A page of `Uom` results."
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Uom"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    UomConversion:
      type: object
      description: "An exact conversion from a countable product's alternative unit to its base unit (FR-MDM-003): one `fromUom` is `numerator / denominator` of `toUom`, in lowest terms, with a denominator that divides 1,000. A conversion never changes; a new factor for a unit is a new conversion after the old one is archived. To put a quantity in the base unit, multiply its thousandths by `numerator` and divide by `denominator`; a result that is not a whole number of thousandths is not a quantity, and the server refuses it rather than rounding."
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/ProductRef"
        fromUom:
          type: string
          description: "The alternative unit, a counted one (`BAG`, `CRATE`, `PACK`, `BUNCH`)."
        toUom:
          type: string
          description: "The product's base unit."
        numerator:
          type: integer
          minimum: 1
          maximum: 1000000000
        denominator:
          type: integer
          minimum: 1
          maximum: 1000
        factor:
          type: string
          pattern: "^[0-9]+\\.[0-9]{3}$"
          description: "`numerator / denominator` with three decimal places, exact (`50.000` for a 50 kg bag, `0.500` for a 500 g pack)."
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
        archiveReason:
          type:
            - string
            - "null"
      required:
        - id
        - product
        - fromUom
        - toUom
        - numerator
        - denominator
        - factor
        - version
        - createdAt
        - archivedAt
        - archiveReason
    UomConversionPage:
      type: object
      description: "A page of `UomConversion` results."
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UomConversion"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    UomConversionCreate:
      type: object
      additionalProperties: false
      description: "One `fromUom` of the product is `numerator / denominator` of its base unit. Whole numbers only; the server reduces the fraction and refuses one that is not exact to three decimal places."
      properties:
        productId:
          type: string
          format: uuid
        fromUom:
          type: string
          pattern: "^[A-Z]{2,10}$"
        numerator:
          type: integer
          minimum: 1
          maximum: 1000000000000
        denominator:
          type: integer
          minimum: 1
          maximum: 1000000000000
      required:
        - productId
        - fromUom
        - numerator
        - denominator
