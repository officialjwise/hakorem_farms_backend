        date:
          type: string
          format: date
        branchId:
          type:
            - string
            - "null"
          format: uuid
        counts:
          type: array
          items:
            $ref: "#/components/schemas/ExceptionCount"
        countLines:
          type: array
          items:
            $ref: "#/components/schemas/ExceptionCountLine"
          description: "2.52.0 (the owner, 2026-11-25, A-400: \"Count them, list only refusals\"). Controls the report counts rather than lists, one line per branch and day, each branch with nothing to count left out. Always sent; empty when there is nothing to count."
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExceptionItem"
        voidsByCashier:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        overridesByUser:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        refundsByUser:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        mortalityByHandler:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        adjustmentsByUser:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        driverVariances:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        exportsByUser:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        shiftOverShort:
          type: array
          items:
            $ref: "#/components/schemas/RateByUser"
        approvalPairs:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalPair"
          description: "Who approved whom, and how often. A pair that approves most of each other's requests is the collusion risk R1."
        currency:
          $ref: "#/components/schemas/Currency"
        generatedAt:
          type: string
          format: date-time
      required:
        - date
        - branchId
        - counts
        - items
        - voidsByCashier
        - overridesByUser
        - refundsByUser
        - mortalityByHandler
        - adjustmentsByUser
        - driverVariances
        - exportsByUser
        - shiftOverShort
        - approvalPairs
        - currency
        - generatedAt
    ExceptionCountLine:
      type: object
      description: "A control the daily exception report counts rather than lists (2.52.0, A-400). The only one: `TILL_SALES_WITHOUT_RECEIPT_TOKEN`, the till sales of the branch and day, live or synced, whose till sent no receipt token, so the receipt text the buyer's phone number called for was held back (`NO_LINK` in the message log; abuse case 60). A sale whose token was sent and refused is not counted here: it is its own item (`RECEIPT_TOKEN_REFUSED`, abuse case 37)."
