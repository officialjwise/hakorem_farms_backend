    get:
      operationId: listReportDefinitions
      tags:
        - rpt
      summary: "List the reports available to me"
      description: "The reports the caller may run, each with the parameters it takes as a JSON schema. `from` and `to` are business dates in Africa/Accra, both included; `branchId` narrows to one branch, and without it a report covers every branch the caller holds `rpt.report.read` at. `STOCK_ON_HAND` takes `branchId` and `to` (stock as it stood at the end of that day; today without it). `EXPIRING_LOTS` takes `branchId`, `from` and `to` (lots whose expiry date falls in the period). `AGEING_STOCK` takes `branchId` and `to`. `MORTALITY_RATE`, `FEED_CONVERSION`, `DELIVERY_PERFORMANCE`, `SALES_BY_CASHIER`, `SALES_SUMMARY` (sales by day, channel and payment method) and `PURCHASES` (goods received and supplier invoices) take `branchId`, `from` and `to`. `CUSTOMER_LIST` takes none and is a bulk export above 100 rows. `runReport` answers every code listed here from B12; until then only the mock serves it.\n\nPermission: `rpt.report.read`."
