    post:
      operationId: createAccountingExport
      tags:
        - api
      summary: "Export a period's journals for an external accounting package"
      description: "Audited with its row count. The format is an adapter behind the accounting export port.\n\nPermission: `api.accounting_export.create`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
      x-permission: api.accounting_export.create
      x-requires-step-up: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      security:
        - staffSession: []
        - apiKey: []
