          $ref: "#/components/schemas/Quantity"
        qtyRejectedBase:
          $ref: "#/components/schemas/Quantity"
        orderUom:
          type: string
          description: "The unit the order line was bought in, which `orderUnitPricePesewas` is per."
        orderUnitPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        lineValuePesewas:
          $ref: "#/components/schemas/Pesewas"
        acceptedValuePesewas:
          $ref: "#/components/schemas/Pesewas"
        claimedValuePesewas:
          $ref: "#/components/schemas/Pesewas"
      required:
        - id
        - lineNo
        - goodsReceiptLineId
        - purchaseOrderLineId
        - product
        - rejectionReasonCode
        - baseUom
        - qtyDeliveredBase
        - qtyAcceptedBase
        - qtyRejectedBase
        - orderUom
        - orderUnitPricePesewas
        - lineValuePesewas
        - acceptedValuePesewas
        - claimedValuePesewas
    SupplierClaim:
      type: object
      description: "A claim raised from a posted purchase receipt's rejected lines (CR-036, ADR-0076, 2.4.0). It moves no stock and posts nothing, and stays `OPEN` on the supplier's account until it is settled once: by the approved invoice that left the rejected goods out (`settleSupplierClaim`), or by the credit note drafted from it (`draftSupplierClaimCreditNote`) once that is approved."
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - OPEN
            - SETTLED
        supplier:
          $ref: "#/components/schemas/SupplierRef"
        purchaseOrder:
          $ref: "#/components/schemas/DocumentRef"
        goodsReceipt:
          $ref: "#/components/schemas/DocumentRef"
        receivedBy:
          $ref: "#/components/schemas/PrincipalRef"
        note:
          type:
            - string
            - "null"
        claimedPesewas:
          $ref: "#/components/schemas/Pesewas"
        currency:
          $ref: "#/components/schemas/Currency"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SupplierClaimLine"
        creditNote:
          description: "The credit note drafted from the claim and not cancelled, waiting or approved; null if none."
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                supplierInvoiceNo:
                  type: string
                status:
                  type: string
              required:
                - id
                - supplierInvoiceNo
                - status
            - type: "null"
        settlement:
          type:
            - string
            - "null"
          enum:
            - INVOICE
            - CREDIT_NOTE
            - null
        settledBy:
          description: "The invoice or credit note that settled the claim; null while it is open."
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum:
                    - INVOICE
                    - CREDIT_NOTE
                supplierInvoiceNo:
                  type: string
              required:
                - id
                - kind
                - supplierInvoiceNo
            - type: "null"
        settledAt:
          type:
            - string
            - "null"
          format: date-time
        branchId:
          type: string
          format: uuid
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
      required:
        - id
        - status
        - supplier
        - purchaseOrder
        - goodsReceipt
        - receivedBy
        - note
        - claimedPesewas
        - currency
        - lines
        - creditNote
        - settlement
        - settledBy
        - settledAt
        - branchId
        - version
        - createdAt
        - createdBy
    SupplierClaimPage:
      type: object
      description: "A page of `SupplierClaim` results."
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupplierClaim"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
    SupplierClaimRaise:
      type: object
      additionalProperties: false
      description: "No amount and no quantity: the claim is the receipt's rejected lines at the order price. A body naming any other field is refused."
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 500
    SupplierClaimCreditNoteDraft:
      type: object
      additionalProperties: false
      description: "The supplier's credit note for the claim: the approved invoice it reduces, the supplier's own number and its date. Its lines and amounts are the claim's, never keyed."
      properties:
        originalInvoiceId:
          type: string
          format: uuid
        supplierInvoiceNo:
          type: string
          minLength: 1
          maxLength: 60
        invoiceDate:
          type: string
          format: date
      required:
        - originalInvoiceId
        - supplierInvoiceNo
        - invoiceDate
    SupplierClaimSettle:
      type: object
      additionalProperties: false
      properties:
        supplierInvoiceId:
          type: string
          format: uuid
          description: "The approved invoice of the claim's order that left the rejected goods out."
      required:
        - supplierInvoiceId
    SupplierBalance:
      type: object
      description: "A supplier's account (CR-042, 2.9.0): what the farm owes, what is entered and waiting, what is claimed back, what is in payment and what is paid, within the branches the caller reads supplier invoices at as a whole, as `listSupplierInvoices` is scoped. Every figure is integer pesewas summed on the server from PUR's own records, never negative; its direction is in its name. `owedPesewas` and `inPaymentPesewas` overlap: an invoice is still owed until its payment is paid."
      properties:
        supplier:
          $ref: "#/components/schemas/SupplierRef"
        asOf:
          type: string
          format: date-time
          description: "When the server worked the figures out."
        owedPesewas:
          description: "What approved invoices (status `APPROVED`, never cancelled) still owe: their gross less credit notes approved against them and payments paid."
          $ref: "#/components/schemas/Pesewas"
        awaitingApprovalPesewas:
          description: "The gross of invoices entered and not yet approved for payment (`DRAFT`, `MATCHED`, `MISMATCH`). A credit note is never counted here."
          $ref: "#/components/schemas/Pesewas"
        claimedPesewas:
          description: "The claimed value of the supplier's `OPEN` claims (`SupplierClaim.claimedPesewas`), not yet settled by an invoice or a credit note."
          $ref: "#/components/schemas/Pesewas"
        inPaymentPesewas:
          description: "The amount of payments waiting for approval or approved (`PENDING_APPROVAL`, `APPROVED`) and not yet paid."
          $ref: "#/components/schemas/Pesewas"
        paidPesewas:
          description: "The amount of the supplier's `PAID` payments."
          $ref: "#/components/schemas/Pesewas"
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - supplier
        - asOf
        - owedPesewas
        - awaitingApprovalPesewas
        - claimedPesewas
        - inPaymentPesewas
        - paidPesewas
        - currency
    SupplierInvoiceLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
        product:
          anyOf:
            - $ref: "#/components/schemas/ProductRef"
            - type: "null"
        description:
          type: string
        purchaseOrderLineId:
          type:
            - string
            - "null"
          format: uuid
        goodsReceiptLineId:
          type:
            - string
            - "null"
          format: uuid
        qty:
          $ref: "#/components/schemas/Quantity"
        uom:
          type:
            - string
            - "null"
          description: "The unit `qty` and `unitPricePesewas` are in: the order line's unit, else the product's base unit; null for a pure expense line with no product (1.28.0)."
        unitPricePesewas:
          $ref: "#/components/schemas/Pesewas"
        lineNetPesewas:
          $ref: "#/components/schemas/Pesewas"
        taxCategory:
          $ref: "#/components/schemas/TaxCategoryRef"
        levies:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLevyAmount"
        qtyVariance:
          description: "In the product's base unit (`baseUom` of the product, not the line's `uom`): the invoiced quantity converted to the base unit, less what is left to invoice of what was received (received less what other live invoices hold). Positive when the invoice charges more than is left to invoice, negative when less, `0.000` when exactly that; null on a line with no order line or another product (CR-044, 2.9.0)."
          anyOf:
            - $ref: "#/components/schemas/SignedQuantity"
            - type: "null"
        priceVariancePesewas:
          description: "The absolute difference **per unit** of the line's `uom` (the order line's unit) between the invoiced and the order unit price, which the 1 percent tolerance is judged on; its direction is `priceVarianceDirection`. Not the line's whole difference: that is `priceVarianceLinePesewas`. Null without an order line (CR-044, 2.9.0)."
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
        priceVarianceLinePesewas:
          description: "The line's whole difference from the order price: `priceVariancePesewas` times the line's `qty`, rounded half-up once (ADR-0001). 500 head at 1,290 against an order at 1,250 is 40 a head and 20,000 for the line. Null exactly when `priceVariancePesewas` is (CR-044, 2.9.0)."
          anyOf:
            - $ref: "#/components/schemas/Pesewas"
            - type: "null"
        priceVarianceDirection:
          description: "`OVER` when the invoiced unit price is above the order's, `UNDER` when below, null when equal or without an order line (CR-044)."
          type:
            - string
            - "null"
          enum:
            - OVER
            - UNDER
            - null
        matchStatus:
          type: string
          enum:
            - UNMATCHED
            - MATCHED
            - MISMATCH
            - NOT_REQUIRED
        matchReasons:
          type: array
          items:
            type: string
          description: "Why the line does not match, as codes in this fixed order: `NO_ORDER_LINE`, `PRODUCT_DIFFERS`, `QTY_EXCEEDS_RECEIVED`, `PRICE_OUTSIDE_TOLERANCE` (more than 1 percent from the order price, SA-08), `LEVY_DIFFERS`. Empty unless `matchStatus` is `MISMATCH` (1.28.0)."
        returnFromLocationId:
          type:
            - string
            - "null"
          format: uuid
          description: "On a credit note only: where the goods sent back to the supplier leave from. They move, as INV's SUPPLIER_RETURN movement, when the credit note is approved (FR-PUR-011, 1.30.0). Null on an invoice and on a credit with no goods returned."
        returnStockUnitId:
          type:
            - string
            - "null"
          format: uuid
          description: "On a credit note only: the lot or animal sent back, for a tracked product (1.30.0)."
        supplierClaimLineId:
          type:
            - string
            - "null"
          format: uuid
          description: "On a credit note drafted from a claim only: the claim line it credits. Its quantity is the rejected base quantity, its net the claim line's claimed value, and its unit price 0, since that value is a share of the delivery, not a quantity times a price (ADR-0076, 2.4.0). Null otherwise."
      required:
        - id
        - lineNo
        - product
        - description
        - purchaseOrderLineId
        - goodsReceiptLineId
        - qty
        - uom
        - unitPricePesewas
        - lineNetPesewas
        - taxCategory
        - levies
        - qtyVariance
        - priceVariancePesewas
        - priceVarianceLinePesewas
        - priceVarianceDirection
        - matchStatus
        - matchReasons
        - returnFromLocationId
        - returnStockUnitId
        - supplierClaimLineId
    SupplierInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - INVOICE
            - CREDIT_NOTE
        status:
          type: string
          enum:
            - DRAFT
            - MATCHED
            - MISMATCH
            - APPROVED
            - PAID
            - CANCELLED
        supplier:
          $ref: "#/components/schemas/SupplierRef"
        supplierInvoiceNo:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        purchaseOrder:
          anyOf:
            - $ref: "#/components/schemas/DocumentRef"
            - type: "null"
        originalInvoiceId:
          type:
            - string
            - "null"
          format: uuid
        netPesewas:
          $ref: "#/components/schemas/Pesewas"
        taxPesewas:
          $ref: "#/components/schemas/Pesewas"
        grossPesewas:
          $ref: "#/components/schemas/Pesewas"
        paidPesewas:
          $ref: "#/components/schemas/Pesewas"
        creditedPesewas:
          $ref: "#/components/schemas/Pesewas"
          description: "The gross of the approved credit notes against this invoice (FR-PUR-011); 0 on a credit note (1.30.0)."
        outstandingPesewas:
          $ref: "#/components/schemas/Pesewas"
          description: "What is still owed: gross less `creditedPesewas` less `paidPesewas`. A credit of 11,000 approved against a 110,000 invoice leaves 99,000. Always 0 on a credit note (1.30.0)."
        currency:
          $ref: "#/components/schemas/Currency"
        matchStatus:
          type: string
          enum:
            - UNMATCHED
            - MATCHED
            - MISMATCH
            - NOT_REQUIRED
            - VARIANCE_APPROVED
          description: "`VARIANCE_APPROVED` (1.30.0): the invoice mismatched on price or a levy only and a different person approved the variance through `requestSupplierInvoiceVariance`, so it is APPROVED and may be paid as invoiced; its lines keep their MISMATCH results. A credit note is UNMATCHED until approved, then NOT_REQUIRED."
        approvalRequestId:
          type:
            - string
            - "null"
          format: uuid
          description: "A credit note's approval (SUPPLIER_CREDIT_NOTE) or an invoice's variance approval (SUPPLIER_INVOICE_VARIANCE), waiting or decided. While it waits, the document cannot change (422 `APPROVAL_PENDING`) (1.30.0)."
        varianceReason:
          type:
            - string
            - "null"
          description: "Why the variance was asked for, as its maker wrote it; null unless a variance is waiting or approved (1.30.0)."
        returnReasonCode:
          type:
            - string
            - "null"
          description: "A credit note's reason for goods sent back (a `RETURN` reason code such as `RETURN_QUALITY`); null otherwise (1.30.0)."
        supplierClaimId:
          type:
            - string
            - "null"
          format: uuid
          description: "A credit note drafted from a goods receipt's claim (`draftSupplierClaimCreditNote`); null otherwise (ADR-0076, 2.4.0)."
        file:
          anyOf:
            - $ref: "#/components/schemas/StoredFileRef"
            - type: "null"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SupplierInvoiceLine"
        branchId:
          type: string
          format: uuid
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
      required:
        - id
        - kind
        - status
        - supplier
        - supplierInvoiceNo
        - invoiceDate
        - dueDate
        - purchaseOrder
        - originalInvoiceId
        - netPesewas
        - taxPesewas
        - grossPesewas
        - paidPesewas
        - creditedPesewas
        - outstandingPesewas
        - currency
        - matchStatus
        - approvalRequestId
        - varianceReason
        - returnReasonCode
        - supplierClaimId
        - file
        - lines
        - branchId
        - version
        - createdAt
        - createdBy
