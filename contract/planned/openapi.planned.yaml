              description: "As a share of that user's sales, or of head kept for mortality."
            - type: "null"
        comparisonRatePercent:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/Percent"
              description: "The average of everyone in the same role, or the pen average."
            - type: "null"
      required:
