  "/reports/{code}/run":
    post:
      operationId: runReport
      tags:
        - rpt
      summary: "Run a report on screen or export it"
      description: "Runs in the worker against the reporting schema with a statement timeout, so it cannot slow the counter. Export is a separate permission; every run is audited with its row count; a bulk export needs step-up and lands on the exception report. Every code `listReportDefinitions` lists is answered, `SALES_SUMMARY` and `PURCHASES` included, with the parameters it lists; each code has its own named example (`Prefer: example=<CODE>` on the mock). Not answered by the API until B12.\n\nPermission: `rpt.report.read, plus rpt.report.export for PDF or XLSX`."
      x-permission: "rpt.report.read, plus rpt.report.export for PDF or XLSX"
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      security:
        - staffSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
