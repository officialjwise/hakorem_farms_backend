            - PAY_IN
        amountPesewas:
          $ref: "#/components/schemas/Pesewas"
        reasonCode:
          type: string
          description: "From the CASH_MOVEMENT list, required for every kind (2.5.0): SAFE_DROP for a drop, FUEL_PAYOUT, SUPPLIER_PAYOUT or OTHER_PAYOUT for a pay-out, FLOAT_TOP_UP for a pay-in."
        note:
          type: string
        witnessId:
          type: string
          format: uuid
          description: "Who received a cash drop: a holder of pos.shift.close.approve at the branch who is neither the cashier nor the caller. Required while such a supervisor is signed in at the branch; with none signed in a drop may leave it out and is recorded unwitnessed (A-273 (d), 2.6.0). From 2.17.0 the witness confirms the drop with their till PIN on the till and the till sends `witnessPinVersion`: a named supervisor without it is no witness (the owner on 2026-11-18)."
        witnessPinVersion:
          type: integer
          minimum: 1
          maximum: 1000000
          description: "The witness's till PIN version, which the till checked their PIN against (2.17.0, CR-050, ADR-0080). Required with `witnessId`: the server checks that it is the witness's version in force, not replaced and not locked (`WITNESS_PIN_REQUIRED`, `WITNESS_PIN_UNKNOWN`, `WITNESS_PIN_SUPERSEDED`, `WITNESS_PIN_LOCKED`), and the database holds it again."
        occurredAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - amountPesewas
        - occurredAt
      additionalProperties: false
