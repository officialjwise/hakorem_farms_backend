operationId: listCapitalTransactions
tags:
  - cap
summary: "List capital contributions and withdrawals"
description: "FR-CAP-003, FR-CAP-004. Contributions and withdrawals, latest value date first, filtered by investor, kind and a range of value dates. The investor books are kept at the head office branch: the permission is checked there, so a grant at another branch reads nothing (A-381).\n\nPermission: `cap.capital.read`."
x-permission: cap.capital.read
parameters:
  - name: investorId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: kind
    in: query
    required: false
    schema:
      type: string
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
