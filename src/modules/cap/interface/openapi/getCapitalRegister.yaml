operationId: getCapitalRegister
tags:
  - cap
summary: "The capital register: units and share per investor at a date"
description: "FR-CAP-005. Each investor's units on `asOf` (today when absent): units issued on or before it less units redeemed on or before it, their share of the units in issue that day to four places, and what they had paid in and taken out by then. `totalUnits` and `totalNetCapitalPesewas` cover every investor, not the page. The investor books are kept at the head office branch: the permission is checked there, so a grant at another branch reads nothing (A-381).\n\nPermission: `cap.capital.read`."
x-permission: cap.capital.read
parameters:
  - name: asOf
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
