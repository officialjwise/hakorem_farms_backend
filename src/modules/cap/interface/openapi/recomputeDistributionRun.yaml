operationId: recomputeDistributionRun
tags:
  - cap
summary: "Recompute a draft run from the ledger"
description: "FR-CAP-006 to FR-CAP-008. Recomputes a draft from the ledger and the capital transactions as they stand (a backdated contribution, a journal posted since): a new computation; the old one is kept. Only a draft: a submitted run is never edited, so its approval always decides what was submitted, and a run that must change is rejected, or its maker withdraws the request, and a new one is drafted (A-382): 422 `DISTRIBUTION_RUN_INVALID` `RUN_NOT_EDITABLE`. The investor books are kept at the head office branch: the permission is checked there, so a grant at another branch reads nothing (A-381).\n\nPermission: `cap.distribution.create`."
x-permission: cap.distribution.create
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
