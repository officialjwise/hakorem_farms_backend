operationId: listMyInvestorDocuments
tags:
  - investor
summary: "My agreements, statements and distribution schedules"
description: "The investor portal (FR-IAM-013, FR-CAP-013, 2.46.0): a signed-in investor reads only their own record, found by their session, never by an id in the request; a staff or customer session, or an investor login no investor holds, is 403. The investor's own documents, newest first."
x-owner-module: cap
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - investorSession: []
