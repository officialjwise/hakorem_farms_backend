operationId: listDistributionRuns
tags:
  - cap
summary: "List profit distribution runs"
description: "FR-CAP-006 to FR-CAP-012. Distribution runs, latest period first, with their lines. The investor books are kept at the head office branch: the permission is checked there, so a grant at another branch reads nothing (A-381).\n\nPermission: `cap.distribution.read`."
