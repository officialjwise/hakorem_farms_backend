operationId: createDistributionRun
tags:
  - cap
summary: "Compute a draft distribution for a closed period"
description: "FR-CAP-006 to FR-CAP-009, ADR-0028. Drafts a numbered run (`DST-...`) for a period that has ended, every day of it in an accounting period and every one of those locked or closed. Net profit is the ledger's for the period (income less cost of sales less expenses); a loss or a break-even records zero and `isLoss`. Retained is `half_up(net profit x retention rate)` (40 percent unless `retentionRatePercent` names another, snapshotted on the run); the rest is allocated by unit-days (units held multiplied by days held, actual Africa/Accra calendar days, both ends counted, the contribution day counted and the withdrawal day not) with largest-remainder rounding, leftover pesewas to the largest remainders and equal remainders to the lower investor number, so the lines sum exactly to the distributable amount. Tax withheld is zero until the accountant confirms a rate (A-030). The example is UAT scenario 4: GHS 25,000.02 across five investors, three leftover pesewas to Esi, Kofi and Yaw. Refusals: 422 `DISTRIBUTION_RUN_INVALID` with `details[].code` (`PERIOD_REVERSED`, `PERIOD_NOT_ENDED`, `PERIOD_NOT_IN_LEDGER`, `PERIOD_NOT_LOCKED`, `PERIOD_ALREADY_DISTRIBUTED` when a run that was not rejected covers a day of it, `NO_UNIT_DAYS` when nobody held units: never an equal split). The investor books are kept at the head office branch: the permission is checked there, so a grant at another branch reads nothing (A-381).\n\nPermission: `cap.distribution.create`."
x-permission: cap.distribution.create
