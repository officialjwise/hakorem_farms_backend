operationId: listInvestors
tags:
  - cap
summary: "List investors"
description: "FR-CAP-001. The investor register in investor-number order (INV-001, INV-002 and on, never reused), each with the units held now and their share of the units in issue, to four places, computed on request. The investor books are kept at the head office branch: the permission is checked there, so a grant at another branch reads nothing (A-381).\n\nPermission: `cap.investor.read`."
x-permission: cap.investor.read
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
