operationId: closePurchaseOrder
tags:
  - pur
summary: "Close a purchase order with nothing more to receive"
description: "Closes an order once something was received against it, fully or short (FR-PUR-006): closing 15 of 20 received leaves 5 outstanding on the line, recorded with the reason in the audit trail. With nothing received it is 422 `PURCHASE_ORDER_INVALID` (`NOTHING_RECEIVED`): cancel it instead.\n\nPermission: `pur.purchase_order.close`."
x-permission: pur.purchase_order.close
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - PURCHASE_ORDER_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Supplier cannot deliver the balance"
