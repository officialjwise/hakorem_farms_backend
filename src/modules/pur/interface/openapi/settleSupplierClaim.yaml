operationId: settleSupplierClaim
tags:
  - pur
summary: "Settle a claim by the invoice that left the rejected goods out"
description: "An OPEN claim with no credit note drafted is settled by an APPROVED or PAID invoice of its order that names every order line the claim names, when no live invoice holds more of any of them than was received and what other claims' credit notes cover: the supplier did not charge the rejected goods (ADR-0076, 2.4.0). Refused with 422 `SUPPLIER_CLAIM_INVALID`: `CLAIM_INVOICED` (the supplier charged them: draft the claim's credit note instead), `INVOICE_NOT_APPROVED`, `ORDER_DIFFERS`, `ORDER_LINE_NOT_INVOICED` or `CREDIT_NOTE_EXISTS`; a settled claim is 422 `INVALID_STATE_TRANSITION`. Once settled by an invoice, the claim no longer lets an invoice carry the rejected quantity in the three-way match.\n\nPermission: `pur.supplier_invoice.match`."
x-permission: pur.supplier_invoice.match
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - SUPPLIER_CLAIM_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
