        schema:
          $ref: "#/components/schemas/SupplierRemittance"
        example:
          id: "019a7ad2-7e95-7b84-a3c6-1f9d8b0e2c53"
          supplierPaymentId: "019a7ad2-5d76-7e49-8c1b-6a2e9f3d0b64"
          paymentNo: null
          supplier:
            id: "019a7a89-16ae-7e6d-a3a5-efa6f28f6884"
            publicId: sup_TGKEXYTAZ99G0NNC
            name: "Awutu Poultry Farm"
          method: MOBILE_MONEY
          payeeDetailsMasked: "MTN Mobile Money, Awutu Poultry Farm, ****0014"
          amountPesewas: 99000
          currency: GHS
          paidAt: "2026-11-15T14:00:00Z"
          externalReference: "MTN-7741029"
          lines:
            - supplierInvoiceId: "019a7ad0-1c33-7b06-9f4e-5d8a2c6b1e75"
