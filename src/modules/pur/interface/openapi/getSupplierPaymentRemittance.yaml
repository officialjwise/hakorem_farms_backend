operationId: getSupplierPaymentRemittance
tags:
  - pur
summary: "Get a paid supplier payment's remittance advice data"
description: "The remittance advice data of a PAID supplier payment (FR-PUR-013, 1.30.0): each invoice it pays with the invoice's gross, the credits approved against it, the amount this payment puts on it and what was left after, and the payment's method, masked payee, time and reference. It is fixed once, in the transaction that marks the payment paid, and never changes; replaying or repeating `markSupplierPaymentPaid` makes no second one, and `pur.SupplierRemittanceReady` is published once. A payment not yet paid has none (404 `NOT_FOUND`). The advice is rendered and archived by the worker after the payment is marked paid, once (B08 continued 2c, ADR-0062): `remittanceDocumentId` is null until then, usually seconds, and then names the archived PDF (`getArchivedDocument`, `downloadArchivedDocument` once scanned). Sending it to the supplier follows with notifications in B11.\n\nPermission: `pur.supplier_payment.read`."
x-permission: pur.supplier_payment.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
