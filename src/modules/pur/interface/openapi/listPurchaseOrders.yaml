operationId: listPurchaseOrders
tags:
  - pur
summary: "List purchase orders"
description: "Purchase orders newest first, within the branches (and, for a location grant, the delivery locations) the caller holds the permission at. Filters: `status`, `supplierId`, and an order date from `from` to `to` inclusive.\n\nPermission: `pur.purchase_order.read`."
x-permission: pur.purchase_order.read
x-error-codes:
  - VALIDATION_FAILED
  - INVALID_CURSOR
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: supplierId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
