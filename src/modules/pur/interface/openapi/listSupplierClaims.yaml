operationId: listSupplierClaims
tags:
  - pur
summary: "List supplier claims"
description: "Claims newest first, within the branches the caller holds the permission at as a whole (2.4.0). Filters: `status` (`OPEN` is what the supplier still owes the farm a credit or an invoice for), `supplierId`, `purchaseOrderId` and `goodsReceiptId`.\n\nPermission: `pur.supplier_invoice.read`."
x-permission: pur.supplier_invoice.read
x-error-codes:
  - VALIDATION_FAILED
  - INVALID_CURSOR
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - OPEN
        - SETTLED
  - name: supplierId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: purchaseOrderId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: goodsReceiptId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
