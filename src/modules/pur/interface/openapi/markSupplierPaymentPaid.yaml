operationId: markSupplierPaymentPaid
tags:
  - pur
summary: "Record that an approved payment was made"
description: "Records an APPROVED payment as paid, with the time and the bank or mobile money reference, which is unique per method so a replayed confirmation collides. The payment is numbered from its `SPY` series in the same transaction, gap-free (`paymentNo`, `SPY-<year>-<branch>-<sequence>`, the Africa/Accra year it was paid; B09x, A-205), and its remittance advice prints that number. Each invoice it allocates to carries the amount as paid, and is PAID once settled. Publishes pur.SupplierPaymentMade for the ledger. In the same transaction the remittance advice data is fixed, once per payment (`getSupplierPaymentRemittance`), and `pur.SupplierRemittanceReady` is published once; the worker then renders and archives the advice once (B08 continued 2c, ADR-0062: `remittanceDocumentId` is null in this answer and set seconds later), and sending it to the supplier waits for B11 (FR-PUR-013, 1.30.0). Each invoice is PAID once payments and approved credits reach its gross.\n\nPermission: `pur.supplier_payment.pay`."
x-permission: pur.supplier_payment.pay
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - DUPLICATE_VALUE
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
