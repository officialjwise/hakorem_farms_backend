operationId: markSupplierPaymentPaid
tags:
  - pur
summary: "Record that an approved payment was made"
description: "Records an APPROVED payment as paid, with the time and the bank or mobile money reference, which is unique per method so a replayed confirmation collides. Each invoice it allocates to carries the amount as paid, and is PAID once settled. Publishes pur.SupplierPaymentMade for the ledger. The remittance advice is rendered and archived once document rendering exists (B8).\n\nPermission: `pur.supplier_payment.pay`."
x-permission: pur.supplier_payment.pay
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - DUPLICATE_VALUE
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/SupplierPaymentMarkPaid"
      example:
        paidAt: "2026-11-14T11:00:00Z"
        externalReference: GCB-TRF-20261114-0007
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/SupplierPayment"
        example:
          id: "019a7acf-2c2a-75c8-ab00-6556a793de34"
          paymentNo: SPY-2026-DDW-000024
          status: PAID
          supplier:
            id: "019a7a89-16ae-7e6d-a3a5-efa6f28f6884"
            supplierNo: S-0019
            name: "Awutu Poultry Farm"
          method: BANK
          bankAccount:
            id: "019a7a92-6491-77d8-bd10-86568cccff34"
            name: "GCB current account"
            kind: BANK
            last4: "4821"
          amountPesewas: 625000
          currency: GHS
          scheduledFor: "2026-11-18"
          paidAt: "2026-11-13T14:00:00Z"
          externalReference: GCB-TRF-20261113-0042
          approvalRequestId: "019a7acf-4b19-7fab-b4e4-038e21447c6c"
          allocations:
            - supplierInvoiceId: "019a7acd-3d3a-7790-acc9-81df0c83fabc"
              supplierInvoiceNo: AWT-0441
