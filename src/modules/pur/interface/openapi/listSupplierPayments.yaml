operationId: listSupplierPayments
tags:
  - pur
summary: "List supplier payments"
description: "Supplier payments newest first, within the branches the caller holds the permission at as a whole. Filters: `status`, `supplierId`, `scheduledBefore`.\n\nPermission: `pur.supplier_payment.read`."
x-permission: pur.supplier_payment.read
x-error-codes:
  - VALIDATION_FAILED
  - INVALID_CURSOR
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: supplierId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: scheduledBefore
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
