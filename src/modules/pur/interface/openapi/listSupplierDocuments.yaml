operationId: listSupplierDocuments
tags:
  - pur
summary: "List a supplier's documents"
description: "The documents held for a supplier, newest first (FR-PUR-003). Each file is served only by `createFileSignedUrl`, a signed link that lives 5 minutes, each issue logged.\n\nPermission: `pur.supplier.read`."
x-permission: pur.supplier.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/SupplierDocumentPage"
        example:
          data:
            - id: "019a7ac8-2a04-783f-8d77-8cc5157905a2"
              kind: REGISTRATION
              file:
