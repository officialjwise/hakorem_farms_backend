operationId: approveSupplierInvoice
tags:
  - pur
summary: "Approve a matched invoice for payment"
description: "Matches the invoice again as things are now and approves it for payment: publishes pur.SupplierInvoiceMatched (or ExpenseInvoiceApproved) for the ledger. Refused with 422 THREE_WAY_MATCH_FAILED while any line is a mismatch, or before the invoice is matched (`UNMATCHED`); each detail names the line and its reason. A mismatch on price or a levy may instead be paid on an approved variance (`requestSupplierInvoiceVariance`). A credit note is approved through `submitSupplierCreditNote` (422 `SUPPLIER_INVOICE_INVALID`, `CREDIT_NOTE_NEEDS_APPROVAL`); an invoice whose variance waits is 422 `APPROVAL_PENDING` (1.30.0).\n\nPermission: `pur.supplier_invoice.approve`."
x-permission: pur.supplier_invoice.approve
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - THREE_WAY_MATCH_FAILED
  - SUPPLIER_INVOICE_INVALID
  - APPROVAL_PENDING
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
