operationId: sendPurchaseOrder
tags:
  - pur
summary: "Send an approved purchase order to the supplier"
description: "Sends an APPROVED order to its supplier: records when and by whom and publishes `pur.PurchaseOrderSent`, which the notification module delivers on the channels asked (B11). The order document is rendered and archived once document rendering exists (B8). An order waiting for approval is 422 `INVALID_STATE_TRANSITION`.\n\nPermission: `pur.purchase_order.send`."
x-permission: pur.purchase_order.send
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PurchaseOrderSend"
      example:
        channels:
          - EMAIL
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PurchaseOrder"
        example:
          id: "019a7acb-106c-7592-8aca-61f87e11dad6"
