operationId: createPurchaseRequisition
tags:
  - pur
summary: "Raise a purchase requisition"
description: "Raises a DRAFT requisition (FR-PUR-004): products and quantities in each product's base unit, a needed-by date and a justification, at `locationId`, or, when it is left out, at the one location or branch the requester's grants name. Refusals are 422 `PURCHASE_REQUISITION_INVALID`: `NO_LINES`, `LINE_REPEATED`, `PRODUCT_NOT_ACTIVE`, `NOT_PURCHASABLE`, `NEEDED_BY_PAST` and `LOCATION_REQUIRED`; an unknown product is 422 `REFERENCE_NOT_FOUND`.\n\nPermission: `pur.requisition.create`."
x-permission: pur.requisition.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - PURCHASE_REQUISITION_INVALID
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PurchaseRequisitionCreate"
      example:
        locationId: "019a7a83-a6ab-7171-96a9-1fe68e7298c4"
        neededBy: "2026-11-18"
        justification: "Feed store below reorder point"
        lines:
          - productId: "019a7a8e-e37e-7913-ae4c-9a0dc3bf12eb"
            qty: "10.000"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PurchaseRequisition"
        example:
          id: "019a7aca-18f4-7676-8bae-703cb089e91a"
          requisitionNo: REQ-2026-DDW-000033
          status: DRAFT
          requestedBy:
            id: "019a7a86-8d13-7ec4-93fc-f519f70a6df7"
            displayName: "Yaw Boateng"
          location:
