operationId: draftSupplierClaimCreditNote
tags:
  - pur
summary: "Draft the credit note for a claim"
description: "The supplier's credit note for an OPEN claim, as a DRAFT against the APPROVED invoice of the claim's order that charged the rejected goods (ADR-0076, 2.4.0). One line per claim line, in the product's base unit: the rejected quantity, the claimed value as its net (unit price 0) and the levies MDM's calculator gives; nothing is keyed. The claim must have no other credit note that is not cancelled. Refused with 422 `SUPPLIER_CLAIM_INVALID`: `CLAIM_NOT_INVOICED` when the invoice names no line of an order line the claim names, or the live invoices hold no more of it than was received and other claims credit (the supplier left the rejected goods out: settle the claim by that invoice instead, so the same goods are never credited twice); `CREDIT_NOTE_EXISTS`; or the credit target's refusal (`ORIGINAL_NOT_APPROVED`, `ORIGINAL_SETTLED`, `ORDER_DIFFERS`, `BRANCH_DIFFERS`, `ORIGINAL_NOT_AN_INVOICE`, `ORIGINAL_OF_ANOTHER_SUPPLIER`). 422 `CREDIT_NOTE_EXCEEDS_INVOICE` when the invoice has less left; 409 `DUPLICATE_SUPPLIER_INVOICE` for a number already entered. Nothing is credited or posted until the credit note is submitted (`submitSupplierCreditNote`) and approved; its approver may be neither its maker, its submitter, the claim's maker nor whoever posted the receipt (`INVOICE_MAKER_CANNOT_APPROVE`). Its approval settles the claim. A claim's credit note cannot be changed (`updateSupplierInvoice` answers `CLAIM_CREDIT_NOTE_FIXED`): cancel it and draft it again.\n\nPermission: `pur.supplier_invoice.create`."
x-permission: pur.supplier_invoice.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
