operationId: convertPurchaseRequisition
tags:
  - pur
summary: "Turn a requisition into a draft purchase order"
description: "Turns a SUBMITTED requisition into a DRAFT purchase order in one transaction (FR-PUR-004): each named requisition line is ordered once at the price agreed with the supplier and at its requisitioned quantity unless `qty` says otherwise; a line left out is not ordered. The requisition becomes CONVERTED and names the order; the order then follows its own approval limit (`submitPurchaseOrder`). The caller also needs `pur.requisition.approve` at the requisition's scope (403 `FORBIDDEN`), so a requester cannot convert their own request without it. A rejected or draft requisition is 422 `INVALID_STATE_TRANSITION`; `LINE_NOT_ON_REQUISITION`, `LINE_REPEATED` and `NO_LINES` are 422 `PURCHASE_REQUISITION_INVALID`; the order's own refusals are 422 `PURCHASE_ORDER_INVALID`.\n\nPermission: `pur.purchase_order.create`."
x-permission: pur.purchase_order.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - REFERENCE_NOT_FOUND
  - PURCHASE_REQUISITION_INVALID
  - PURCHASE_ORDER_INVALID
  - INVALID_STATE_TRANSITION
  - RATE_LIMITED
