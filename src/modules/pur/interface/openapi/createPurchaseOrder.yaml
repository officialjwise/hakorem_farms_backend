operationId: createPurchaseOrder
tags:
  - pur
summary: "Draft a purchase order"
description: "Drafts an order to a supplier for delivery to a physical location (FR-PUR-005). Each line's net is its quantity times its unit price, rounded half-up once; its levies come from the tax calculator on the order date by the product's tax category; the totals are the sums. A line bought by another unit than the product's base unit names it in `uom` (feed by the 50 kg `BAG`) and converts by the product's exact conversion, or is refused (`NO_CONVERSION`, `INEXACT_QUANTITY`). Refused with 422 `PURCHASE_ORDER_INVALID`: `NO_LINES`, `LINE_REPEATED`, `PRODUCT_NOT_ACTIVE`, `NOT_PURCHASABLE`, `SUPPLIER_NOT_ACTIVE`, `NOT_A_RECEIVING_LOCATION`, `EXPECTED_BEFORE_ORDER`, and `TAX_INCLUSIVE_NOT_AVAILABLE` (orders are tax-exclusive for now, A-164). Order numbers are allocated once numbering exists (B8); until then `orderNo` is null.\n\nPermission: `pur.purchase_order.create`."
x-permission: pur.purchase_order.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - PURCHASE_ORDER_INVALID
  - TAX_SCHEME_NOT_IN_FORCE
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
