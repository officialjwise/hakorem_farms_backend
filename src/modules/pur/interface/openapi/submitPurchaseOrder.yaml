operationId: submitPurchaseOrder
tags:
  - pur
summary: "Submit a purchase order"
description: "Approves at once within the requester's limit; above it, waits for a different approver. The limit is the `PURCHASE_ORDER` approval policy at the order's branch (seeded so that above 200,000 pesewas needs approval, FR-PUR-005, A-164): 20 broilers at 5,500 (110,000) is approved on submit; 250,000 answers 202. The database refuses an order approved, sent or received at or above its threshold without an approval request. A refused or withdrawn request returns the order to DRAFT.\n\nPermission: `pur.purchase_order.create`."
x-permission: pur.purchase_order.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - PURCHASE_ORDER_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PurchaseOrder"
        example:
          id: "019a7acb-106c-7592-8aca-61f87e11dad6"
          orderNo: PO-2026-DDW-000043
          status: SENT
          supplier:
            id: "019a7a88-f7bf-7489-99c2-516f78deca4d"
            supplierNo: S-0003
            name: "Agrivet Ghana Ltd"
          deliverToLocation:
            id: "019a7a84-6045-7cc6-b1fe-d53368984e11"
            code: STORE-1
            name: "Feed and produce store"
            kind: STORE
          orderDate: "2026-11-07"
          expectedOn: "2026-11-12"
          taxInclusive: false
          netPesewas: 85000
          taxPesewas: 0
          grossPesewas: 85000
          currency: GHS
          approvalRequestId: null
          sentAt: "2026-11-07T11:00:00Z"
          lines:
            - id: "019a7acb-2f5b-7f75-94ae-002ff7c2790d"
              lineNo: 1
              product:
                id: "019a7a8f-026d-72f7-b82f-38453d70b123"
                sku: FEED-0005
                name: "Oxytetracycline 20% injection, 100 ml"
              description: null
              qtyOrdered: "10.000"
