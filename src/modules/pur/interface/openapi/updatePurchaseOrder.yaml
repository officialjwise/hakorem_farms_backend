operationId: updatePurchaseOrder
tags:
  - pur
summary: "Change a draft purchase order"
description: "Changes a DRAFT order: its expected date, or its lines, which replace the old ones and are priced and taxed again. Any other status is 422 `INVALID_STATE_TRANSITION`.\n\nPermission: `pur.purchase_order.create`."
x-permission: pur.purchase_order.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - REFERENCE_NOT_FOUND
  - PURCHASE_ORDER_INVALID
  - TAX_SCHEME_NOT_IN_FORCE
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
