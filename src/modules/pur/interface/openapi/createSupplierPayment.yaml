operationId: createSupplierPayment
tags:
  - pur
summary: "Prepare a supplier payment"
description: "Prepares a payment as DRAFT, its amount the sum of its allocations (FR-PUR-012). Each allocation is to an APPROVED invoice of the same supplier that matched or needed no match, and never more than the invoice has left after other live payments and its credit notes not cancelled (1.30.0), and an invoice approved on a variance (`VARIANCE_APPROVED`) may be paid: paying 110,000 across invoices of 60,000 and 50,000 allocates exactly, and 60,001 against the first is 422 `ALLOCATION_EXCEEDS_AVAILABLE`. An unmatched invoice is 422 `THREE_WAY_MATCH_FAILED` (FR-PUR-010), and the database refuses the allocation too. Other refusals are 422 `SUPPLIER_PAYMENT_INVALID`: `NO_ALLOCATIONS`, `OTHER_SUPPLIER`, `DUPLICATE_INVOICE`, `NOT_APPROVED`, `BRANCH_DIFFERS`, `BANK_ACCOUNT_NOT_AVAILABLE` (the optional `bankAccountId`, the farm's own account the payment leaves from, must be an active account of the method's kind: a bank for `BANK` and `CHEQUE`, a wallet for `MOBILE_MONEY`, none for `CASH`; the ledger then credits that account's own subledger party, and a payment that names none posts to the \"Bank account not yet named\" party, A-185, A-194, 1.36.0), and `PAYOUT_DETAILS_MISSING` or `PAYOUT_METHOD_DIFFERS` (1.29.0): a bank or mobile money payment pays the supplier's approved payout details of that method in force now, fixed on the payment as `payeeDetailsMasked`; a change still waiting for approval is never used (FR-PUR-002).\n\nPermission: `pur.supplier_payment.create`."
x-permission: pur.supplier_payment.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - THREE_WAY_MATCH_FAILED
  - ALLOCATION_EXCEEDS_AVAILABLE
  - SUPPLIER_PAYMENT_INVALID
  - RATE_LIMITED
