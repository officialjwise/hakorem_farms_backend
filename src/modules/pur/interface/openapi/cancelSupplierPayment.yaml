operationId: cancelSupplierPayment
tags:
  - pur
summary: "Cancel an unpaid supplier payment"
description: "Cancels a DRAFT or APPROVED payment that has not been paid; its allocations stop counting against its invoices. A payment waiting for approval is withdrawn through the approval inbox instead.\n\nPermission: `pur.supplier_payment.create`."
x-permission: pur.supplier_payment.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Counted twice in error at the morning check"
