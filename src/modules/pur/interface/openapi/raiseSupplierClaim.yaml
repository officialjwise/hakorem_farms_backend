operationId: raiseSupplierClaim
tags:
  - pur
summary: "Raise a claim from a goods receipt's rejected lines"
description: "From a POSTED purchase receipt against an order with rejected lines, a claim against its supplier in one step (CR-036, ADR-0076, 2.4.0): one line per rejected line, each with the line's `GOODS_RECEIPT_REJECTION` reason and its base quantities as the receipt stored them. The value is the server's, never the client's: the delivered quantity at the order line's price, rounded half-up once, split with the kernel's `allocate` between accepted and rejected (a crate at 4,751 with 7 of 30 eggs rejected claims 1,109, and 3,642 is accepted). The body takes an optional `note` and nothing else; an amount sent is refused (400 `VALIDATION_FAILED`). One claim per receipt. Raising a claim moves no stock and posts nothing; `pur.SupplierClaimRaised` is published for the daily exception report. Refusals: 422 `SUPPLIER_CLAIM_INVALID` with `RECEIPT_NOT_POSTED`, `NOT_A_PURCHASE`, `NO_ORDER`, `NOTHING_REJECTED`, `NO_ORDER_LINE`, `NOTHING_TO_CLAIM` or `CLAIM_EXISTS`.\n\nPermission: `pur.supplier_invoice.create`."
x-permission: pur.supplier_invoice.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - SUPPLIER_CLAIM_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/SupplierClaimRaise"
      example:
        note: "Seven cracked in the top tray"
