operationId: createSupplierInvoice
tags:
  - pur
summary: "Capture a supplier invoice or credit note"
description: "Enters a supplier's invoice as DRAFT (FR-PUR-008). The same supplier invoice number cannot be entered twice for one supplier (422 `DUPLICATE_SUPPLIER_INVOICE`; another supplier may use it). Each line names its order line, takes that line's unit and converts to the base unit by the product's exact conversion; a pure expense line names no product. Every levy of the line's tax category is calculated on the invoice date and stored with its reclaimable flag; `leviesCharged` records what the supplier actually charged where it differs, and the difference fails the match. When `statedGrossPesewas` is given the lines must add up to it exactly. Refused with 422 `SUPPLIER_INVOICE_INVALID`: `NO_LINES`, `ORDER_OF_ANOTHER_SUPPLIER`, `ORDER_NOT_RECEIVABLE`, `ORDER_REQUIRED`, `ORDER_LINE_NOT_ON_ORDER`, `PRODUCT_DIFFERS`, `NO_CONVERSION`, `INEXACT_QUANTITY`, `BRANCH_REQUIRED`, `BRANCH_DIFFERS`, `DUE_BEFORE_INVOICE`, `STATED_TOTAL_DIFFERS`, `LEVY_NOT_IN_SCHEME`, `LEVY_REPEATED`, `FILE_NOT_USABLE`, and `CREDIT_NOTE_NOT_AVAILABLE` (credit notes arrive with B07 continued). The due date defaults to the invoice date until supplier terms exist.\n\nPermission: `pur.supplier_invoice.create`."
x-permission: pur.supplier_invoice.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - SUPPLIER_INVOICE_INVALID
  - DUPLICATE_SUPPLIER_INVOICE
  - TAX_SCHEME_NOT_IN_FORCE
  - RATE_LIMITED
