operationId: listSupplierInvoices
tags:
  - pur
summary: "List supplier invoices and credit notes"
description: "Supplier invoices newest first, within the branches the caller holds the permission at as a whole. Filters: `status`, `kind` (`INVOICE` or `CREDIT_NOTE`, 1.30.0), `supplierId`, `matchStatus` (with `VARIANCE_APPROVED`, 1.30.0), `dueBefore` (due before that date) and `outstandingOnly` (invoices not settled by payments and credits, not cancelled).\n\nPermission: `pur.supplier_invoice.read`."
x-permission: pur.supplier_invoice.read
x-error-codes:
  - VALIDATION_FAILED
  - INVALID_CURSOR
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: kind
    in: query
    required: false
    schema:
      type: string
      enum:
        - INVOICE
        - CREDIT_NOTE
  - name: supplierId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: matchStatus
    in: query
    required: false
    schema:
      type: string
  - name: dueBefore
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: outstandingOnly
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
