operationId: listGoodsReceiptClaims
tags:
  - pur
summary: "List the claims raised from a goods receipt"
description: "The receipt answers its claims (CR-036 point 2, 2.4.0): at most one, raised by `raiseSupplierClaim`, open or settled. A receipt the caller cannot read, or none, answers an empty page.\n\nPermission: `pur.supplier_invoice.read`."
x-permission: pur.supplier_invoice.read
x-error-codes:
  - VALIDATION_FAILED
  - INVALID_CURSOR
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
