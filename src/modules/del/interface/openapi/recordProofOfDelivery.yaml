operationId: recordProofOfDelivery
tags:
  - del
summary: "Record proof of delivery and cash collected"
description: "Completes a delivery assigned to the caller that is `ASSIGNED` or `OUT_FOR_DELIVERY` (else 422 `INVALID_STATE_TRANSITION`), in one serializable transaction (B11 continued, FR-DEL-008, FR-DEL-009): the recipient's name and a `signatureFileId` (a `SIGNATURE` file) or a `photoFileId` (a `PROOF_OF_DELIVERY` file), each uploaded by the caller and not held by the malware scan; the position when known; and the cash collected. The cash is never above the amount due fixed at dispatch; less than due needs `codVarianceReasonCode` (a `COD_VARIANCE` reason) and its `codVarianceNote` when the reason asks for one, and is reported short for the driver variance report and the daily exception report; collected cash is recorded as a payment held by the driver (account 1020), allocated to the delivery's billing document, and handed in later at a till shift (B11 continued 2). The order's goods are issued from the vehicle to the customer, and the order moves to `DELIVERED`, then `COMPLETED` when nothing is left to pay. Refusals: 422 `DELIVERY_INVALID` with `EVIDENCE_REQUIRED`, `FILE_UNKNOWN`, `FILE_NOT_PROOF`, `FILE_NOT_YOURS`, `FILE_NOT_CLEAN`, `ABOVE_DUE`, `REASON_REQUIRED`, `REASON_UNKNOWN`, `REASON_NOT_ALLOWED`, `NOTE_REQUIRED`, `REASON_NOT_NEEDED`, `POSITION_INCOMPLETE`, `CAPTURED_BEFORE_DISPATCH` or `ID_IN_USE` (the proof's id already used for another delivery); another driver's delivery 403. **A part delivery (2.35.0, CR-055, ADR-0093):** `lines` names what the customer kept of each line (a line not named was kept whole), with a `DELIVERY_FAILURE` `returnedReasonCode`; what was kept is issued for the sale from the vehicle, the rest goes from the vehicle into the branch's returns hold (not sellable until inspected), and the document is credited for it through the `CREDIT_NOTE` approval (the driver its maker; the delivery fee is never credited). The cash due at the door is the delivery's `codDuePesewas` less that credit (`proof.returnedCreditPesewas`), never below zero: never more is collected, less only with a `COD_VARIANCE` reason as before; what the customer paid ahead beyond what they kept is refunded to the original method once the credit note is issued. The delivery's `codDuePesewas` itself never changes. Refusals as 422 `DELIVERY_INVALID`: `LINE_UNKNOWN`, `LINE_REPEATED`, `ABOVE_DISPATCHED`, `WEIGHED_LINE_WHOLE`, `NOTHING_DELIVERED`, `REASON_REQUIRED`, `NOTE_REQUIRED` (`returnedNote`, where the reason asks for one), `REASON_UNKNOWN`, `REASON_NOT_ALLOWED`, `REASON_NOT_NEEDED`, `UNIT_SPLIT` (a quantity that is not a whole number of the line's base units), `NO_RETURNS_HOLD`.\n\nPermission: `del.proof.create`. Ownership: deliveries assigned to the caller.\n\nAccepted from an offline queue: the client supplies the record id (UUIDv7), and a resubmission with the same id returns the delivery as it stands and records nothing again."
x-permission: del.proof.create
