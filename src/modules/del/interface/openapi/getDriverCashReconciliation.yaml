operationId: getDriverCashReconciliation
tags:
  - del
summary: "Get a driver cash reconciliation"
description: "One hand-in of a driver's cash at a till shift (2.31.0, B11 continued 2) at its branch: another branch's is refused 403, an unknown id 404.\n\nPermission: `del.cash_reconciliation.read`."
x-permission: del.cash_reconciliation.read
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
responses:
