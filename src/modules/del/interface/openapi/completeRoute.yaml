operationId: completeRoute
tags:
  - del
summary: "Close a route"
description: "Closes a started run (2.32.0, B11 continued 3; the owner, 2026-11-23): **only when nothing is left on the van and nothing is still held by the driver.** Every stop's goods must have left the van, delivered (`DELIVERED`) or returned to stock (`RETURNED`) or written off with a reason (`WRITTEN_OFF`, 2.33.0); a stop still assigned, on its way or failed with its goods aboard is refused 422 `ROUTE_INVALID` `GOODS_ON_VAN`, one detail per stop (`field` `/stops/{deliveryId}`). Every collection made on the run must have been handed in at a till shift (`handInDriverCash`); while any is held, 422 `ROUTE_INVALID` `CASH_NOT_HANDED_IN`. Closed, the run is `COMPLETED` and frozen, and its `handIns` name the till hand-ins that took its cash, recorded against it by the database (A-345 (g)). The database holds the same rule at commit. A planned or closed run is refused 422 `INVALID_STATE_TRANSITION`. The same key answers the first close. Audited.\n\nPermission: `del.route.manage`."
x-permission: del.route.manage
x-error-codes:
  - ROUTE_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
