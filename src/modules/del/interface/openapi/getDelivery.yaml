operationId: getDelivery
tags:
  - del
summary: "Get a delivery"
description: "A delivery as dispatch made it (B11 continued, FR-DEL-003): the order, the recipient, the address and the contents as dispatched (each line naming its `orderLineId`, CR-055 point 1), the driver and the vehicle, the cash due on delivery fixed by the server at dispatch from the billing document on the weighed quantity, and the proof once delivered. Read at the delivery's branch; another branch's is refused 403, an unknown one 404. `slot` is null until delivery booking arrives (B11 continued 2).\n\nPermission: `del.delivery.read`."
x-permission: del.delivery.read
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
