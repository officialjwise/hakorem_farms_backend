operationId: listDeliverySlots
tags:
  - del
summary: "List delivery slots with capacity"
description: "Slots at the branches the caller's grants name, in the order they start, with capacity, bookings and what remains (FR-DEL-001). Bookings stay 0 until B11 books deliveries into slots (SA-13).\n\nPermission: `del.slot.read`."
x-permission: del.slot.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
