    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
