operationId: rescheduleDelivery
tags:
  - del
summary: "Move a delivery to another slot"
description: "Booking and reattempt (2.34.0; FR-DEL-001 to FR-DEL-003, FR-DEL-011): a slot of the delivery's own zone for a delivery waiting on the van (`ASSIGNED`) or back from a failed attempt (`FAILED`), with the reason (1 to 500 characters). The slot is read under its row lock: never more bookings than its capacity, whoever books at the same time. The old slot is freed and the new one taken in the same transaction; the database keeps the slots' counts. Today's slots are offered only up to the zone's cut-off (Africa/Accra); after it the earliest is tomorrow's. **A reattempt:** a `FAILED` delivery goes back to `ASSIGNED` and its order from `DELIVERY_FAILED` to `DISPATCHED`; the goods never left the van. The same slot is taken again for a reattempt without a second booking. A delivery that is a stop of a run keeps its stop and van, so its slot falls on the run's day. The customer is told through the outbox (`del.DeliveryRescheduled`). Audited. **Refusals:** a delivery on its way or finished 422 `INVALID_STATE_TRANSITION`; 422 `DELIVERY_INVALID` with `SLOT_UNKNOWN`, `SLOT_OTHER_ZONE`, `SLOT_STARTED`, `PAST_CUT_OFF`, `SLOT_FULL`, `NOT_ON_RUN_DAY`, `SAME_SLOT` (the same slot for a delivery waiting on the van), `ZONE_NOT_DELIVERING` or `WRITE_OFF_PENDING`; another branch's delivery 403.\n\nPermission: `del.delivery.assign`."
x-permission: del.delivery.assign
x-error-codes:
  - DELIVERY_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
