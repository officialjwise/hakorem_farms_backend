operationId: listDriverCashReconciliations
tags:
  - del
summary: "List driver cash reconciliations"
description: "The driver variance report (2.31.0, B11 continued 2, FR-DEL-010, CR-057): every hand-in of a driver's cash at a till shift at the branches the caller reads whole, newest first, by driver, by Africa/Accra date (`from`, `to`, inclusive) or only those short or over (`varianceOnly`). Detection for abuse cases 6 and 43: a short count is short, posted to 6900, never typed in as loose cash.\n\nPermission: `del.cash_reconciliation.read`."
x-permission: del.cash_reconciliation.read
parameters:
  - name: driverId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: varianceOnly
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
