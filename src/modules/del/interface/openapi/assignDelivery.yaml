operationId: assignDelivery
tags:
  - del
summary: "Assign a driver and vehicle"
description: "Reassignment (2.34.0; FR-DEL-004): another driver who drives for the delivery's branch (holds `del.proof.create` there), or another live `VEHICLE` location of it, or both, for a delivery waiting on the van (`ASSIGNED`) or back from a failed attempt (`FAILED`). A delivery made at dispatch already has its driver and van, so this is how it changes hands. The previous driver can no longer open it; the new one sees it among their own. **When the vehicle changes the goods follow:** each dispatched item moves from the one van to the other in the same transaction (still the farm's stock); a van that no longer holds them 422 `INSUFFICIENT_STOCK`, nothing written. Audited with the before and after. **Refusals:** a delivery on its way or finished 422 `INVALID_STATE_TRANSITION`; one that is a stop of a planned or started run keeps its driver and van, 422 `DELIVERY_INVALID` `ON_A_RUN`; the same driver and vehicle `UNCHANGED`; a person who does not drive for the branch `NOT_A_DRIVER`; a location that is not a live vehicle of the branch `NOT_A_VEHICLE`; a failed delivery whose write-off waits for approval `WRITE_OFF_PENDING`; another branch's delivery 403.\n\nPermission: `del.delivery.assign`."
x-permission: del.delivery.assign
x-error-codes:
  - DELIVERY_INVALID
  - INSUFFICIENT_STOCK
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
