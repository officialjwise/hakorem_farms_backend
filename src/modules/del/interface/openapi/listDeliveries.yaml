operationId: listDeliveries
tags:
  - del
summary: "List deliveries"
description: "A branch's deliveries, newest first, at the branches the caller reads whole, by the Africa/Accra date they were dispatched (`date`), `status`, `driverId`, `zoneId` or `orderId` (B11 continued, additive). Each is as `getDelivery` shows it.\n\nPermission: `del.delivery.read`."
x-permission: del.delivery.read
parameters:
  - name: date
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: driverId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: zoneId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: orderId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
