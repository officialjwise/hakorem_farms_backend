operationId: getMyDelivery
tags:
  - del
summary: "Get one of my deliveries"
description: "A delivery assigned to the caller (B11 continued, FR-DEL-004): another driver's, or one assigned to nobody, is refused 403 whatever else the caller holds; an unknown id is 404. The same `Delivery` the back office reads, with the cash to collect (`codDuePesewas`).\n\nPermission: `del.delivery.read.assigned`. Ownership: deliveries assigned to the caller."
x-permission: del.delivery.read.assigned
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
