operationId: reorderRouteStops
tags:
  - del
summary: "Set the order of a route's stops"
description: "Sets the order of a planned run's stops (2.32.0): exactly the stops it has, each once, at the `version` read (409 otherwise). A started or closed run is refused 422 `INVALID_STATE_TRANSITION`; other stops 422 `ROUTE_INVALID` `NOT_THE_SAME_STOPS` or `STOP_REPEATED`. Audited.\n\nPermission: `del.route.manage`."
x-permission: del.route.manage
x-error-codes:
  - ROUTE_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/RouteStopsReplace"
      example:
