operationId: recordFailedDelivery
tags:
  - del
summary: "Record a failed attempt"
description: "A failed attempt (2.32.0; FR-DEL-011): on a delivery assigned to the caller, waiting on the van or on its way, a reason from the fixed `DELIVERY_FAILURE` list, what the driver asks next (`REATTEMPT` or `RETURN_TO_STOCK`), the time and the position when known. The delivery is `FAILED` with one attempt more and the order `DELIVERY_FAILED`, in one transaction; the goods stay on the van, the farm's, until a reattempt or a return to stock, and a run cannot be closed while they are there. **Accepted from an offline queue:** the attempt's `id` is the device's (UUIDv7); sent again it answers the delivery as it stands and records nothing; an id used for another delivery 422 `ID_IN_USE`. **Refusals:** 422 `DELIVERY_INVALID` with `REASON_UNKNOWN`, `REASON_NOT_ALLOWED`, `OCCURRED_BEFORE_DISPATCH`, `POSITION_INCOMPLETE` or `ROUTE_NOT_STARTED`; a finished or failed delivery 422 `INVALID_STATE_TRANSITION`; another driver's delivery 403. Audited.\n\nPermission: `del.delivery.update.assigned`. Ownership: deliveries assigned to the caller."
x-permission: del.delivery.update.assigned
x-error-codes:
  - DELIVERY_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
