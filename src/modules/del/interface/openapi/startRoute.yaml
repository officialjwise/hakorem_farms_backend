operationId: startRoute
tags:
  - del
summary: "Start a route"
description: "Starts a planned run on or after its day (2.32.0): `IN_PROGRESS`, with its start time. The goods are already on the vehicle, loaded at dispatch and still the farm's stock (ADR-0092), so nothing moves here. Until its run has started a stop cannot be marked on the way, delivered or failed (422 `DELIVERY_INVALID` `ROUTE_NOT_STARTED`). Before its day 422 `ROUTE_INVALID` `NOT_ITS_DAY`; a run already started or closed 422 `INVALID_STATE_TRANSITION`. Audited.\n\nPermission: `del.route.manage`."
x-permission: del.route.manage
x-error-codes:
  - ROUTE_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
