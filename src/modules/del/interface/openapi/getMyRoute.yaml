operationId: getMyRoute
tags:
  - del
summary: "Get my route for a day"
description: "The caller's own run for a day (today in Africa/Accra by default), small and cacheable for a weak connection: the stops in order with what is due on each, and the cash collected and still held. **A driver with no run that day gets 404** (CR-057 point 2), whatever else they hold; nobody else's run is ever answered.\n\nPermission: `del.delivery.read.assigned`. Ownership: the driver's own route."
x-permission: del.delivery.read.assigned
parameters:
  - name: date
    in: query
    required: false
    schema:
      type: string
      format: date
security:
  - staffSession: []
  - apiKey: []
