operationId: createRoute
tags:
  - del
summary: "Plan a driver's route for a day"
description: "A driver's run for a day (2.32.0, B11 continued 3; FR-DEL-005, A-337): the deliveries dispatch loaded onto the vehicle (ADR-0092), in the order given, for one driver who drives for the vehicle's branch, on that live vehicle, on a date not past; one run per driver per day. Each stop is a delivery `ASSIGNED` to that driver on that vehicle at that branch, on no other run, dispatched on or before the run's date. Written `PLANNED`; stops are ordered by a person (no optimisation). **Refusals:** 422 `ROUTE_INVALID` with `NO_STOPS`, `STOP_REPEATED`, `DELIVERY_UNKNOWN`, `OTHER_BRANCH`, `NOT_ASSIGNED`, `NOT_THE_DRIVERS`, `NOT_ON_THE_VEHICLE`, `ON_ANOTHER_ROUTE`, `DISPATCHED_AFTER_ROUTE_DATE`, `ROUTE_DATE_PAST`, `DRIVER_HAS_A_ROUTE` or `NOT_A_VEHICLE`; 422 `DELIVERY_INVALID` with `NOT_A_DRIVER` or `NOT_A_VEHICLE`. The same key answers the first run. Audited.\n\nPermission: `del.route.manage`."
x-permission: del.route.manage
x-error-codes:
  - ROUTE_INVALID
  - DELIVERY_INVALID
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
