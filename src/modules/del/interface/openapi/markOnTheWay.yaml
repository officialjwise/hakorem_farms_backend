operationId: markOnTheWay
tags:
  - del
summary: "Tell the customer I am on the way"
description: "The driver sets off for a stop (2.32.0; FR-DEL-007, FR-DEL-012): a delivery assigned to the caller and waiting on the van moves to `OUT_FOR_DELIVERY`, its time recorded once, and the customer's message is queued through the outbox in the same transaction. One already on its way answers as it stands and records nothing more. A delivered, failed, returned or cancelled stop is refused 422 `INVALID_STATE_TRANSITION`; a stop on a run not started 422 `DELIVERY_INVALID` `ROUTE_NOT_STARTED`; a time before dispatch `OCCURRED_BEFORE_DISPATCH`. Another driver's delivery 403. The same key answers the first result. Audited.\n\nPermission: `del.delivery.update.assigned`. Ownership: deliveries assigned to the caller."
x-permission: del.delivery.update.assigned
x-error-codes:
  - DELIVERY_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
