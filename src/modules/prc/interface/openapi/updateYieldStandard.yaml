operationId: updateYieldStandard
tags:
  - prc
summary: "Change an expected yield"
description: "Changes the expected percentage or the tolerance. Send the `version` you read; a stale version is refused with 409. Orders already completed keep the yield they were judged with.\n\nPermission: `prc.yield_standard.manage`."
x-permission: prc.yield_standard.manage
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - VERSION_CONFLICT
  - YIELD_STANDARD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/YieldStandardUpdate"
      example:
        version: 1
        tolerancePercent: "4"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/YieldStandard"
        example:
          id: "019a7ac7-328c-7923-8e5b-9b0947f113e7"
          inputProduct:
            id: "019a7a8d-137d-74bf-b9f8-54cda260cdab"
            sku: LIV-GOAT
            name: Goat
          outputProduct:
            id: "019a7a8e-48d3-77a2-9cda-82f8634afbd6"
            sku: MEAT-GOAT
            name: "Goat meat, 15 kg pack"
          expectedPercent: "48"
          tolerancePercent: "5"
          version: 1
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
