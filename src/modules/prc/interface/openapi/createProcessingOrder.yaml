operationId: createProcessingOrder
tags:
  - prc
summary: "Plan a processing order"
description: "Plans an order of input animals at the processing location, each with its weight at input and the source of that weight. Each input must be an animal (a SERIAL stock unit) standing at the processing location, not sold, consumed or written off (`PROCESSING_ORDER_INVALID`: `INPUT_NOT_AN_ANIMAL`, `INPUT_NOT_AVAILABLE`, `INPUT_NOT_HERE`, `INPUT_REPEATED`, `NO_INPUTS`), and under no unreleased hold: an animal under a veterinary withdrawal hold or a quarantine is refused with 422 `STOCK_UNIT_ON_HOLD`, each detail naming the hold and its end. The output location is a physical location of the same branch, usually the cold room. Nothing moves until the order completes; until then each input shows the cost it would carry now, its whole cost pool. The order number is allocated once document numbering exists; until then `orderNo` is null.\n\nPermission: `prc.order.create`, scoped to the order's branch and processing location."
x-permission: prc.order.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - PROCESSING_ORDER_INVALID
  - STOCK_UNIT_ON_HOLD
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
