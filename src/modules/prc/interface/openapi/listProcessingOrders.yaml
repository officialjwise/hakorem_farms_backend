operationId: listProcessingOrders
tags:
  - prc
summary: "List processing orders"
description: "Processing orders, newest first, within the reader's grants: an order is listed where the reader holds the permission for its branch or its processing location. `from` and `to` are Accra calendar dates of creation.\n\nPermission: `prc.order.read`."
x-permission: prc.order.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: yieldVarianceFlag
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
