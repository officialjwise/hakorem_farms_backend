operationId: createYieldStandard
tags:
  - prc
summary: "Set an expected yield"
description: "Creates the standard for an input and an output product; one per pair (`YIELD_STANDARD_INVALID`: `STANDARD_EXISTS`, `SAME_PRODUCT`, `EXPECTED_ZERO`). The tolerance is 5 percent when none is given.\n\nPermission: `prc.yield_standard.manage`."
x-permission: prc.yield_standard.manage
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - YIELD_STANDARD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/YieldStandardCreate"
      example:
        inputProductId: "019a7a8d-515b-7886-9dbe-913c95c20a1a"
        outputProductId: "019a7a8e-67c2-7185-a6be-212fdcfb9a0d"
        expectedPercent: "62"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/YieldStandard"
        example:
          id: "019a7ac7-328c-7923-8e5b-9b0947f113e7"
          inputProduct:
            id: "019a7a8d-137d-74bf-b9f8-54cda260cdab"
            sku: LIV-GOAT
            name: Goat
          outputProduct:
            id: "019a7a8e-48d3-77a2-9cda-82f8634afbd6"
            sku: MEAT-GOAT
            name: "Goat meat, 15 kg pack"
          expectedPercent: "48"
          tolerancePercent: "5"
          version: 1
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
