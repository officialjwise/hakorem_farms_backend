operationId: completeProcessingOrder
tags:
  - prc
summary: "Complete a processing order and create the output lots"
description: "Completes an IN_PROGRESS order in one transaction. Every input is consumed by a PROCESS_CONSUME movement carrying its whole cost pool (the input cost). Each saleable output's reference price per kilogram is snapshotted from the counter's price list for the branch, before promotions; an output without a per-kilogram price is refused (`REFERENCE_PRICE_MISSING`). The total, input cost plus direct cost, is allocated across the outputs by relative sales value (grams times reference price) with largest-remainder rounding, ties to the lowest line, so the output costs sum exactly to the total; waste takes no cost, and an order with nothing saleable is refused (`NO_SALEABLE_OUTPUT`). In the example 72,100 pesewas (goat 66,100 plus direct cost 6,000) splits to 64,035 for goat meat and 8,065 for offal. Each saleable output becomes a new lot in the output location, received by a PROCESS_OUTPUT movement at its allocated cost, with lineage to every input. Yield is judged against the standards of the input product: an output outside its tolerance sets `yieldVarianceFlag`, which never blocks completion, and publishes `prc.YieldVarianceFlagged`. The database checks the sums again at commit. A completed order is frozen.\n\nPermission: `prc.order.process`, scoped to the order's branch and processing location."
x-permission: prc.order.process
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - PROCESSING_ORDER_INVALID
  - STOCK_UNIT_ON_HOLD
  - STOCK_UNIT_NOT_AVAILABLE
  - STOCK_UNIT_RESERVED
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
