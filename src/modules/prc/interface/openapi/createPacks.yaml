        example:
          packs:
            - id: "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e11"
              stockUnit:
                id: "019a8a0f-7b2d-7c40-8e15-3a9d4f6b2c70"
                identifier: PRC-261114-3f2a91c4-01
                tracking: LOT
              outputLineNo: 1
              packNo: 1
              weightKg: "15.000"
              weightSource: SCALE
              barcode: PRC-261114-3f2a91c4-01/015000
              status: IN_STOCK
              labelPrintedAt: null
            - id: "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e12"
              stockUnit:
                id: "019a8a0f-7b2d-7c40-8e15-3a9d4f6b2c70"
                identifier: PRC-261114-3f2a91c4-01
                tracking: LOT
              outputLineNo: 1
              packNo: 2
              weightKg: "15.000"
              weightSource: SCALE
              barcode: PRC-261114-3f2a91c4-01/015000
              status: IN_STOCK
              labelPrintedAt: null
            - id: "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e13"
              stockUnit:
                id: "019a8a0f-7b2d-7c40-8e15-3a9d4f6b2c70"
