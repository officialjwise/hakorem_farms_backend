operationId: startProcessingOrder
tags:
  - prc
summary: "Start processing: consume the inputs"
description: "Starts a PLANNED order once every input is checked again, as `createProcessingOrder` checks it: an input sold, moved or put under a hold since it was planned is refused, a hold with 422 `STOCK_UNIT_ON_HOLD`. Moves no stock: the inputs are consumed when the order completes, so an order in progress can still be cancelled with no stock effect. Publishes `prc.ProcessingOrderStarted`.\n\nPermission: `prc.order.process`, scoped to the order's branch and processing location."
x-permission: prc.order.process
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - PROCESSING_ORDER_INVALID
  - STOCK_UNIT_ON_HOLD
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
