operationId: recordProcessingOutputs
tags:
  - prc
summary: "Record the weighed outputs"
description: "Replaces an IN_PROGRESS order's weighed outputs, each with its kind (`MEAT`, `OFFAL`, `BY_PRODUCT`, `WASTE`), weight and weight source. A saleable output is a product kept in lots and weighed in kilograms (`OUTPUT_NOT_A_LOT`, `OUTPUT_NOT_BY_WEIGHT`); waste names no pack count or expiry (`NOT_FOR_WASTE`). The outputs together weigh no more than the inputs (`OUTPUT_WEIGHT_ABOVE_INPUT`). Reference prices, allocation and lots are made when the order completes; until then they are zero and null. Send the `version` you read.\n\nPermission: `prc.order.process`, scoped to the order's branch and processing location."
x-permission: prc.order.process
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - VERSION_CONFLICT
  - PROCESSING_ORDER_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ProcessingOutputsReplace"
      example:
        version: 3
        outputs:
          - productId: "019a7a8e-48d3-77a2-9cda-82f8634afbd6"
            outputKind: MEAT
            weightKg: "14.200"
            weightSource: SCALE
            packCount: 1
          - productId: "019a7a8f-215c-7cda-8212-d67cb7214f5a"
            outputKind: OFFAL
            weightKg: "3.100"
            weightSource: SCALE
          - productId: "019a7a8f-215c-7cda-8212-d67cb7214f5a"
            outputKind: WASTE
            weightKg: "8.950"
            weightSource: SCALE
