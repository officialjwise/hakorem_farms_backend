operationId: updateProcessingOrder
tags:
  - prc
summary: "Change a planned processing order"
description: "Changes a PLANNED order: its output location, or its inputs, replaced whole and checked again as `createProcessingOrder` checks them. Send the `version` you read; a stale version is refused with 409. Any other status is refused with `INVALID_STATE_TRANSITION`; a completed order is frozen by the database.\n\nPermission: `prc.order.create`, scoped to the order's branch and processing location."
x-permission: prc.order.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - VERSION_CONFLICT
  - PROCESSING_ORDER_INVALID
  - STOCK_UNIT_ON_HOLD
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ProcessingOrderUpdate"
      example:
        version: 2
        inputs:
          - stockUnitId: "019a7a8f-5f3a-70a1-a5d9-12ebaa838bc9"
            weightKg: "26.400"
            weightSource: SCALE
          - stockUnitId: "019a7a8f-bc07-7e4c-9384-ed921796666f"
            weightKg: "24.900"
            weightSource: SCALE
