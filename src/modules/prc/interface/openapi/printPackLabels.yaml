operationId: printPackLabels
tags:
  - prc
summary: "Print pack labels: the data each label carries, with its lot and weight barcode"
description: "Answers what each label prints, for the client to draw (A-151): product, batch, production and expiry dates, storage class, the weight in kilograms and a CODE_128 barcode whose payload is the lot and the weight in grams (`PRC-261114-3f2a91c4-01/015000`). The first print time is recorded once; a reprint gives the same payload and is marked `reprint`. Only packs IN_STOCK or PICKED print.\n\nRefusals (422 PROCESSING_ORDER_INVALID): ORDER_NOT_COMPLETED, NO_PACKS, TOO_MANY_PACKS, PACK_NOT_IN_ORDER, PACK_NOT_IN_STOCK.\n\nPermission: `prc.order.process`, scoped to the order's branch and processing location."
x-permission: prc.order.process
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - PROCESSING_ORDER_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/LabelPrintRequest"
      example:
        packIds:
          - "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e12"
          - "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e13"
        format: PDF_LABEL_50x30
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PackLabelSheet"
        example:
          format: PDF_LABEL_50x30
          labels:
            - pack:
                id: "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e12"
                packNo: 2
              stockUnit:
                id: "019a8a0f-7b2d-7c40-8e15-3a9d4f6b2c70"
                identifier: PRC-261114-3f2a91c4-01
                tracking: LOT
              product:
                id: "019a7a8d-2f61-7b0e-9c4d-6e1a3b5c7d90"
                sku: MEAT-GOAT-15KG
                name: "Goat meat, 15 kg pack"
              lotNo: PRC-261114-3f2a91c4-01
              weightKg: "15.000"
              weightSource: SCALE
              producedOn: "2026-11-14"
              expiresOn: "2026-11-21"
              storageTempClass: CHILLED
              line: "PRC-261114-3f2a91c4-01 · 15.000 kg"
              barcode:
                symbology: CODE_128
                payload: PRC-261114-3f2a91c4-01/015000
                text: PRC-261114-3f2a91c4-01/015000
              labelPrintedAt: "2026-11-14T13:05:00Z"
              reprint: true
            - pack:
                id: "019a8a10-1c4e-7a21-9b3e-4d2f6a8c0e13"
                packNo: 3
              stockUnit:
                id: "019a8a0f-7b2d-7c40-8e15-3a9d4f6b2c70"
                identifier: PRC-261114-3f2a91c4-01
                tracking: LOT
              product:
                id: "019a7a8d-2f61-7b0e-9c4d-6e1a3b5c7d90"
                sku: MEAT-GOAT-15KG
                name: "Goat meat, 15 kg pack"
              lotNo: PRC-261114-3f2a91c4-01
              weightKg: "14.600"
              weightSource: SCALE
              producedOn: "2026-11-14"
              expiresOn: "2026-11-21"
              storageTempClass: CHILLED
              line: "PRC-261114-3f2a91c4-01 · 14.600 kg"
              barcode:
                symbology: CODE_128
                payload: PRC-261114-3f2a91c4-01/014600
                text: PRC-261114-3f2a91c4-01/014600
              labelPrintedAt: "2026-11-14T13:20:00Z"
              reprint: false
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
