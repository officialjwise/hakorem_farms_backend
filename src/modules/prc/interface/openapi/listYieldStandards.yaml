operationId: listYieldStandards
tags:
  - prc
summary: "List expected yields"
description: "Yield standards: the expected weight of an output product as a percentage of an input product's live weight, and the tolerance outside which a completed order is flagged.\n\nPermission: `prc.yield_standard.read`."
x-permission: prc.yield_standard.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
