operationId: getDailyExceptionReport
tags:
  - rpt
summary: "The daily exception report"
description: "FR-RPT-007, FR-RPT-008, ADR-0026, ADR-0103 (2.48.0). Every abuse case in the threat model is either blocked or appears here with enough detail to act on (B13 proves each one): for one Africa/Accra day and one branch, or every branch the caller reads in full, every exception item urgent first, each with its kind, the abuse cases it helps detect, the person it names, its amount and its subject document; the counts by kind; the detection rates (a cashier's voids over their completed counter sales; a shift's over or short over its expected cash; a driver's hand-in variance over what they were expected to hand in; the other tables count and total, with no rate); and who approved whom, with how often. Items come from the outbox as each event is delivered, and from the sweep of the records that raise items without an event (the audit trail's refusals and exports, the audit verification, the stock exception queue, the reconciliation breaks, order splitting), every quarter hour. An item about the investor books is shown only to a caller who also holds `cap.capital.read` at its branch. Another branch, real or made up, 403.\n\nPermission: `rpt.exceptions.read`."
x-permission: rpt.exceptions.read
parameters:
  - name: date
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
