operationId: getOwnerDashboard
tags:
  - rpt
summary: "The owner dashboard"
description: "The owner's first screen in one request (FR-RPT-001, NFR-023). It composes the dashboard tiles: stock value at cost, animals on hand by species, the low stock count and purchases on `date` and the day before, and the purchases of the week (or, with `period=MONTH`, the 30 days) ending `date`, the cash position (the balances of ledger accounts 1000 to 1130, as `getCashPositionTile` answers it, since 1.37.0), and receivables (the balance of 1200 and the part past its due date, as `getReceivablesTile` answers them, since 1.39.0), read from the published views of inventory, master data and the ledger (ADR-0011, ADR-0023) and scoped to the branch asked for or to every branch where the caller holds `rpt.dashboard.owner` for the whole branch. A figure whose source module is not built yet (sales, top movers and the sales series until B9a, alerts and the exception count until B12) is null and listed in `pendingFigures` with its reason and phase; it is never answered with a zero. Stock figures are as of `asOf`; `date` (today unless asked, never later) dates the sales figures and ends the purchases period. A `date` after today is 422 `REPORT_PERIOD_INVALID`.\n\nPermission: `rpt.dashboard.owner`."
x-permission: rpt.dashboard.owner
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - REPORT_PERIOD_INVALID
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: date
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: period
    in: query
    required: false
    description: "How far back the purchases and sales series reach, ending on `date`: `WEEK` (7 days, the default) or `MONTH` (30 days)."
    schema:
      type: string
      enum:
        - WEEK
        - MONTH
