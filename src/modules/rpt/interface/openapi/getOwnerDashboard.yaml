operationId: getOwnerDashboard
tags:
  - rpt
summary: "The owner dashboard"
description: "The owner's first screen in one request (FR-RPT-001, NFR-023). It composes the dashboard tiles: stock value at cost, animals on hand by species, the low stock count and the purchases of the 7 days ending `date`, read from the published views of inventory and master data (ADR-0011, ADR-0023) and scoped to the branch asked for or to every branch where the caller holds `rpt.dashboard.owner` for the whole branch. A figure whose source module is not built yet (sales, top movers and the sales series until B9a, cash and receivables until B8, alerts and the exception count until B12) is null and listed in `pendingFigures` with its reason and phase; it is never answered with a zero. Stock figures are as of `asOf`; `date` (today unless asked, never later) dates the sales figures and ends the purchases period. A `date` after today is 422 `REPORT_PERIOD_INVALID`.\n\nPermission: `rpt.dashboard.owner`."
x-permission: rpt.dashboard.owner
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - REPORT_PERIOD_INVALID
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: date
    in: query
    required: false
    schema:
      type: string
      format: date
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/OwnerDashboard"
        example:
