operationId: getReceivablesTile
tags:
  - rpt
summary: "Outstanding receivables"
description: "The balance of ledger account 1200 (debits less credits, from the ledger's published `fin.pub_receivable_balance`) and the part of it past its due date (the outstanding amount of issued invoices, receipts and debit notes due before today, from billing's `bil.pub_document`), over the branches covered, as at `asOf` (A-200). A credit balance answers 0; overdue never exceeds outstanding. Answered by the API since 1.39.0 (B08 continued 2).\n\nPermission: `rpt.tile.read`."
x-permission: rpt.tile.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    description: "One branch; without it, every branch where the caller holds `rpt.tile.read` for the whole branch."
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ReceivablesTile"
        example:
          branchIds:
            - "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          outstandingPesewas: 2063400
          overduePesewas: 545900
          currency: GHS
          asOf: "2026-11-15T09:30:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
