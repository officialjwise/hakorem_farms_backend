operationId: reviewException
tags:
  - rpt
summary: "Mark an exception item reviewed with a note"
description: "CR-059, ADR-0103 (2.48.0). Marks an item the caller may read reviewed, with a note of 1 to 500 characters, and answers the item with its `review`. Once: a second review is 409 `ALREADY_REVIEWED` and the first stands. Never by the person the item names: 422 `REVIEWER_IS_ACTOR` (the database holds it too). An item the caller cannot read (another branch's, or an investor item without `cap.capital.read`) answers 404 as one that does not exist. Audited. The same key answers the first review.\n\nPermission: `rpt.exceptions.review`."
x-permission: rpt.exceptions.review
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ExceptionReviewCreate"
      example:
        note: "Checked the void slip with Adwoa: a wrong goat was rung up."
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ExceptionItem"
        example:
          id: "019a7b12-3c4f-75ec-9b24-679b7a4ee079"
          exceptionDate: "2026-11-13"
          branchId: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          kind: SALE_VOID
          severity: REVIEW
