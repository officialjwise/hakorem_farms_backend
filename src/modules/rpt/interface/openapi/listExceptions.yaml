operationId: listExceptions
tags:
  - rpt
summary: "List exception items"
description: "FR-RPT-007, CR-059, ADR-0103 (2.48.0). The exception items of the branches the caller reads in full, newest first: one day (`date`), or a range of at most 92 days (`from`, `to`; the 30 days to today when neither is given), by kind, severity, the person named, branch and whether anyone has reviewed it (`reviewed`). An item about the investor books (capital, distributions, an investor's payout details, loans and grants) is listed only for a caller who also holds `cap.capital.read` at its branch. 422 `REPORT_PERIOD_INVALID` for a start after the end or a range over 92 days; another branch, real or made up, 403.\n\nPermission: `rpt.exceptions.read`."
x-permission: rpt.exceptions.read
parameters:
  - name: date
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: kind
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/ExceptionKind"
  - name: severity
    in: query
    required: false
    schema:
      type: string
      enum:
        - INFO
        - REVIEW
        - URGENT
  - name: actorId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: reviewed
    in: query
    required: false
    description: "true: only items someone has marked reviewed; false: only those nobody has (CR-059 point 3)."
    schema:
      type: string
      enum:
        - "true"
        - "false"
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
