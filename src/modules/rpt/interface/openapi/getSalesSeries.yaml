operationId: getSalesSeries
tags:
  - rpt
summary: "Sales per day"
description: "Completed orders' gross totals and their count per business day in Africa/Accra, every day of the period listed; a day with none is 0. Sales are completed orders' gross totals (each order's billing document), by the business date in Africa/Accra the order completed on, from ORD's published `ord.pub_completed_sale` (ADR-0011, ADR-0023). A VOIDED, cancelled or open order is not a sale; a completed return does not change the figure (its credit note is the ledger's, A-234). A period that ends after today, starts after it ends or covers more than 92 days is 422 `REPORT_PERIOD_INVALID`. Answered by the API since 1.52.0 (B09a continued 2g).\n\nPermission: `rpt.tile.read`."
x-permission: rpt.tile.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - REPORT_PERIOD_INVALID
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    description: "One branch; without it, every branch where the caller holds `rpt.tile.read` for the whole branch."
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    description: "First business date (Africa/Accra), included. Without `from` and `to`, the 30 days ending today."
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    description: "Last business date, included; not after today. A period covers at most 92 days."
    schema:
      type: string
      format: date
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/SalesSeriesTile"
        example:
          branchIds:
            - "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          sales:
            from: "2026-11-09"
            to: "2026-11-15"
            points:
              - date: "2026-11-09"
                salesPesewas: 2410500
                orderCount: 31
              - date: "2026-11-10"
                salesPesewas: 1987000
                orderCount: 27
              - date: "2026-11-11"
                salesPesewas: 2205400
                orderCount: 29
              - date: "2026-11-12"
                salesPesewas: 2840500
                orderCount: 35
              - date: "2026-11-13"
                salesPesewas: 1622300
                orderCount: 28
              - date: "2026-11-14"
                salesPesewas: 3102000
                orderCount: 38
              - date: "2026-11-15"
                salesPesewas: 845000
                orderCount: 11
            totalPesewas: 15012700
            orderCount: 199
          currency: GHS
          asOf: "2026-11-15T09:30:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
