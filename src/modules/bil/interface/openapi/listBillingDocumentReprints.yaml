operationId: listBillingDocumentReprints
tags:
  - bil
summary: "List reprints and sends of a document"
description: "Every reprint of a document, by copy number, with who made it and when (FR-BIL-009).\n\nPermission: `bil.document.read` at the document's branch."
x-permission: bil.document.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - NOT_FOUND
parameters:
  - name: id
    in: path
    required: true
    schema:
