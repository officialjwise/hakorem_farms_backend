operationId: issueDebitNote
tags:
  - bil
summary: "Issue a debit note against an issued invoice"
description: "Adds a charge to an issued invoice or receipt (FR-BIL-007): each line's `amountPesewas` is in the original's terms (net if it was tax-exclusive, gross if inclusive) and is taxed by today's tax scheme in its `taxCategoryId`. Issued at once, numbered `DBN-<YEAR>-<BRANCH>-<SEQUENCE>` in the same transaction, and posted as `bil.DebitNoteIssued` (Dr 1200 gross against the customer, Cr 4030 each charge, Cr 2100 each levy). It is due on the original's due date, or today if that has passed. The reason is a `BILLING_ADJUSTMENT` code (`UNDERCHARGED`, `CHARGE_OMITTED`). Refusals are 422 `BILLING_DOCUMENT_INVALID` (`ORIGINAL_NOT_CORRECTABLE`, `REASON_NOT_ALLOWED`, `NOTE_REQUIRED`, `NO_LINES`, `AMOUNT_NOT_POSITIVE`) and `REFERENCE_NOT_FOUND` for an unknown tax category.\n\nPermission: `bil.debit_note.create` at the original's branch."
x-permission: bil.debit_note.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - BILLING_DOCUMENT_INVALID
  - REFERENCE_NOT_FOUND
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/DebitNoteCreate"
      example:
        reasonCode: UNDERCHARGED
        note: "Second delivery attempt fee agreed by phone"
        lines:
          - description: "Second delivery attempt"
            amountPesewas: 3000
            taxCategoryId: "019a7a8b-059e-7ca4-a1dd-d31e8d9f4bfc"
