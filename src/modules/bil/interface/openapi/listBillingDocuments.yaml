operationId: listBillingDocuments
tags:
  - bil
summary: "List invoices, receipts, proformas and notes"
description: "Invoices, receipts, proformas, credit notes and debit notes of every branch where the caller holds `bil.document.read` for the whole branch, newest first (B08 continued 2). `documentNo` finds a document by its official number or by the provisional reference an offline device printed (FR-BIL-011). A credit note waiting for approval is listed as a `DRAFT` with no number. `settlement` is billing's summary: `allocatedPesewas` stays 0 until payments are built (B9a).\n\nPermission: `bil.document.read`."
x-permission: bil.document.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: kind
    in: query
    required: false
    schema:
      type: string
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: orderId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: documentNo
    in: query
    required: false
    schema:
      type: string
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: paymentStatus
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
