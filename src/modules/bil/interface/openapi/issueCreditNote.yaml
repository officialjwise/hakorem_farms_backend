operationId: issueCreditNote
tags:
  - bil
summary: "Issue a credit note against an issued invoice or receipt"
description: "Raises a credit note against an issued invoice or receipt (FR-BIL-007). Each line names a line of the original once, with a `quantity` (credited at the line's price less the same share of its discount) or an `amountPesewas` (in the original's terms: net if it was tax-exclusive, gross if inclusive); the levies are recomputed by the original's tax scheme version. A credit never exceeds what a line, or the original, has left uncredited (422 `CREDIT_NOTE_EXCEEDS_ORIGINAL`, also held by the database). The reason is a `REFUND` or `RETURN` code. A credit note raised on its own needs approval of kind `CREDIT_NOTE`, whatever its amount: the response is `202` with an `ApprovalPending` body, nothing is numbered or posted, and a holder of `bil.credit_note.approve` other than its maker approves it with step-up; the approval numbers it (`CRN-<YEAR>-<BRANCH>-<SEQUENCE>`), issues it and posts `bil.CreditNoteIssued` (Dr 4200 net, Dr 2100 each levy, Cr 1200 gross). A credit beyond what the original has outstanding, on a paid invoice or receipt, is issued too: the original's `settlement.refundablePesewas` shows what it then owes back to the customer, and `requestRefund` with `creditNoteId` pays it back (1.45.0, ADR-0066). Credit notes raised by a return are issued by the return (B9a). Other refusals are 422 `BILLING_DOCUMENT_INVALID` (`ORIGINAL_NOT_CORRECTABLE`, `REASON_NOT_ALLOWED`, `NOTE_REQUIRED`, `NO_LINES`, `LINE_NOT_ON_ORIGINAL`, `LINE_REPEATED`, `QUANTITY_OR_AMOUNT`, `QUANTITY_EXCEEDS_LINE`, `AMOUNT_EXCEEDS_LINE`, `LINE_ALREADY_CREDITED`). Raised by the Owner, the Accountant and the Manager (the owner, 2026-11-16; 1.43.0); a Cashier may not (counter refunds are till returns, B9b). Approved by the Owner or a Manager, never the person who raised it (422 `MAKER_CANNOT_CHECK`), so a Manager's own credit note is approved by another Manager or the Owner.\n\nPermission: `bil.credit_note.create` at the original's branch.\n\nMay require approval of kind `CREDIT_NOTE`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves."
x-permission: bil.credit_note.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - BILLING_DOCUMENT_INVALID
  - CREDIT_NOTE_EXCEEDS_ORIGINAL
  - REFERENCE_NOT_FOUND
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - RATE_LIMITED
