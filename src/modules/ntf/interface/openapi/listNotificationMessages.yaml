operationId: listNotificationMessages
tags:
  - ntf
summary: "The message log: what was sent to whom and when"
description: "The message log, newest first: what was sent to whom and when, each message on its own channel with its status (`QUEUED`, `SENT`, `DELIVERED`, `FAILED`, `SUPPRESSED`) and every attempt, so a failed message shows as failed (FR-NTF-007, the owner 2026-11-23). The number is masked (`+23324*****56`); only messages of the branches the caller's grants reach are listed. `suppressedReason` is `NO_ADDRESS` (the record has no number), `RATE_LIMITED` (the recipient's hourly limit, abuse case 58), `OPTED_OUT` (a reminder or marketing message to a number that replied STOP) or `PREFERENCE_OFF` (a channel the recipient turned off for it). A reminder or marketing message due in quiet hours is `DEFERRED_QUIET_HOURS` with `sendAfter`, the end of the quiet hours in Africa/Accra (B11 continued 11). A message to staff in the console is on `IN_APP`, its recipient `STAFF`.\n\nPermission: `ntf.message.read`."
x-permission: ntf.message.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
