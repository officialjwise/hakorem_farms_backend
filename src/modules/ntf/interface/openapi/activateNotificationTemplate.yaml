operationId: activateNotificationTemplate
tags:
  - ntf
summary: "Make a template version active"
description: "Makes a DRAFT version the one in use and retires the version it replaces, in one step; messages already rendered keep the version they used. Never by the person who drafted it (422 `TEMPLATE_NOT_ACTIVATABLE` `OWN_DRAFT`; the database holds the same rule), and only a draft (`NOT_DRAFT`). Audited with the text activated (FR-NTF-001, abuse case 57).\n\nPermission: `ntf.template.manage`."
x-permission: ntf.template.manage
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - TEMPLATE_NOT_ACTIVATABLE
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/NotificationTemplate"
        example:
          id: "019a7b15-03c8-795c-8e94-9e9769351775"
          code: RECEIPT
          channel: SMS
          locale: en-GH
          category: TRANSACTIONAL
          subject: null
          body: "HaKorem Farms: receipt {{documentNo}}, GHS {{total}}. Thank you! View: {{link}}"
          providerTemplateRef: null
          versionNo: 2
          status: ACTIVE
          version: 1
          createdAt: "2026-11-01T09:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
