operationId: listNotificationTemplates
tags:
  - ntf
summary: "List message templates"
description: "Every version of every message template, by code and channel, the newest version first, so a reminder level picks a template instead of typing its code (the owner, 2026-11-23). Farm-wide master data. Filters: `code`, `channel`, `status`.\n\nPermission: `ntf.template.read`."
x-permission: ntf.template.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: code
    in: query
    required: false
    schema:
      type: string
  - name: channel
    in: query
    required: false
    schema:
      type: string
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/NotificationTemplatePage"
        examples:
