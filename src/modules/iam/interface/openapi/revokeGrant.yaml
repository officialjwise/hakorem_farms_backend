operationId: revokeGrant
tags:
  - iam
summary: "Revoke a role grant"
description: "Nobody revokes their own grant (403 `FORBIDDEN`; the database refuses it too), nor a grant of a role holding a permission they lack at that scope (403). The last Owner grant in force stays (422 `GRANT_INVALID`, `LAST_OWNER`). The revocation takes effect on the next request, is audited as `PERMISSION_CHANGE` and is published as `iam.RoleRevoked` (1.10.0).\n\nPermission: `iam.grant.manage`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - TOTP_ENROLMENT_REQUIRED
  - STEP_UP_REQUIRED
  - NOT_FOUND
  - GRANT_INVALID
  - RATE_LIMITED
x-permission: iam.grant.manage
x-requires-step-up: true
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Counted twice in error at the morning check"
responses:
