operationId: listPermissions
tags:
  - iam
summary: "List permission codes"
description: "Permission: `iam.role.read`."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - TOTP_ENROLMENT_REQUIRED
  - RATE_LIMITED
x-permission: iam.role.read
parameters:
  - name: module
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PermissionPage"
        examples:
          default:
            value:
              data:
                - code: pos.sale.create
                  module: pos
                  description: "Make a counter sale"
                  requiresStepUp: false
                - code: ord.void.approve
                  module: ord
                  description: "Approve the void of a sale someone else made and someone else asked to void"
                  requiresStepUp: true
                - code: cap.distribution.approve
                  module: cap
                  description: "Approve an investor distribution run"
                  requiresStepUp: true
                - code: rpt.report.export.bulk
                  module: rpt
                  description: "Export a report of more than 1,000 rows"
                  requiresStepUp: true
                - code: inv.adjustment.approve
                  module: inv
                  description: "Approve a stock adjustment above the threshold"
                  requiresStepUp: false
                - code: iam.role.manage
                  module: iam
                  description: "Create and change roles"
                  requiresStepUp: true
              page:
                nextCursor: eyJpZCI6IjAxOWE3YyJ9
                limit: 25
                hasMore: true
          empty:
            summary: "Nothing matches: no rows and no next page"
            value:
              data: []
              page:
                nextCursor: null
                limit: 25
                hasMore: false
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
