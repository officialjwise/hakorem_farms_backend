operationId: createRole
tags:
  - iam
summary: "Create a role"
description: "Only the Owner holds this (1.11.0). A new role is never a system role. Nobody adds a permission they do not hold themselves (403 `FORBIDDEN`). An unknown permission code (`UNKNOWN_PERMISSION`) or one limit kind twice (`DUPLICATE_LIMIT_KIND`) is 422 `ROLE_INVALID`; a live role with the same code is 422 `DUPLICATE_VALUE`. Audited as `PERMISSION_CHANGE` and published as `iam.RoleChanged`.\n\nPermission: `iam.role.manage`.\\n\\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - TOTP_ENROLMENT_REQUIRED
  - STEP_UP_REQUIRED
  - DUPLICATE_VALUE
  - ROLE_INVALID
  - RATE_LIMITED
x-permission: iam.role.manage
x-requires-step-up: true
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/RoleCreate"
      example:
        code: SHOP_SUPERVISOR
        name: "Shop supervisor"
        requiresTotp: false
        permissions:
          - ord.void.approve
          - pos.shift.close.approve
        limits:
          - limitKind: PRICE_OVERRIDE_PER_LINE
            amountPesewas: 15000
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Role"
        example:
          id: "019a7a94-7270-7ff3-852b-0805a18d80e3"
          code: CASHIER
          name: Cashier
          isSystem: true
          requiresTotp: false
          permissions:
            - pos.sale.create
            - pos.shift.open
            - pos.shift.close
            - pay.payment.create
          limits:
            - limitKind: PRICE_OVERRIDE_PER_LINE
              amountPesewas: 5000
            - limitKind: PRICE_OVERRIDE_PER_SHIFT
              amountPesewas: 20000
          userCount: 2
          version: 2
          createdAt: "2026-11-01T08:00:00Z"
          updatedAt: "2026-11-10T15:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
