operationId: logout
tags:
  - auth
summary: "End the current session"
x-error-codes:
  - UNAUTHENTICATED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - VALIDATION_FAILED
  - RATE_LIMITED
parameters:
  - name: realm
    in: query
    required: false
    description: "Which session to use when the browser holds sessions in more than one realm. Leave it out when there is only one."
    schema:
      $ref: "#/components/schemas/Realm"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - customerSession: []
  - investorSession: []
responses:
  "204":
    description: "Done. No content."
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
