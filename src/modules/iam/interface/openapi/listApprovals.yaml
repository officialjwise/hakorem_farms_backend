operationId: listApprovals
tags:
  - iam
summary: "List approval requests (the approval inbox)"
description: "Newest first. Lists the requests at the branches where a branch-wide grant gives you `iam.approval.read` (1.11.0). `decidableByMe=true` keeps the pending, unlapsed requests of others whose policy permission you hold at their branch; `requestedByMe=true` keeps your own. A pending request past `expiresAt` shows as `EXPIRED`. `subject.number` is null until the document registry carries numbers (B8), and `evidenceFileId` until the file store exists.\n\nPermission: `iam.approval.read`."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - TOTP_ENROLMENT_REQUIRED
  - RATE_LIMITED
x-permission: iam.approval.read
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - CANCELLED
        - EXPIRED
  - name: kind
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/ApprovalKind"
  - name: decidableByMe
    in: query
    required: false
    schema:
      type: boolean
  - name: requestedByMe
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
