operationId: createUser
tags:
  - iam
summary: "Create a staff or investor account"
description: "Creates a staff account with a temporary password, shown once in this response and in a retry with the same key, never again (it is kept sealed with the user's key, not in the clear). The account must change it at first sign-in. Email and phone are each unique among live staff accounts (422 `DUPLICATE_VALUE`); one of them is required (422 `USER_INVALID`, `NO_IDENTIFIER`). Investor accounts arrive with capital (B12): until then `realm: INVESTOR` is refused (422 `USER_INVALID`, `INVESTOR_ACCOUNTS_NOT_AVAILABLE`). Each grant follows `createGrant`'s rules, and the caller needs this permission at each grant's branch (1.10.0).\n\nPermission: `iam.user.create`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - TOTP_ENROLMENT_REQUIRED
  - STEP_UP_REQUIRED
  - DUPLICATE_VALUE
  - REFERENCE_NOT_FOUND
  - GRANT_INVALID
  - USER_INVALID
  - RATE_LIMITED
x-permission: iam.user.create
x-requires-step-up: true
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
