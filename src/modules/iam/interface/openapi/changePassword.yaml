operationId: changePassword
tags:
  - auth
summary: "Change my password"
description: "With a session, send the X-CSRF-Token. During login, after PASSWORD_CHANGE_REQUIRED, send no cookie and put the `challengeToken` in the body instead; then log in again with the new password. Other sessions of the account are revoked. The new password is at least 12 characters and is checked against a breached-password list."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - INVALID_CREDENTIALS
  - CHALLENGE_EXPIRED
  - PASSWORD_BREACHED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - RATE_LIMITED
  - SERVICE_UNAVAILABLE
parameters:
  - $ref: "#/components/parameters/CsrfTokenOptional"
security:
  - staffSession: []
  - customerSession: []
  - investorSession: []
  - {}
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PasswordChangeRequest"
      example:
        currentPassword: Temp-8841-Farm
        newPassword: "Mango-Season-2026!"
responses:
  "204":
    description: "Done. No content."
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
