operationId: createGrant
tags:
  - iam
summary: "Grant a role at a branch or location"
description: "Nobody grants themselves a role (403 `FORBIDDEN`; the database refuses it too), and nobody grants a role holding a permission they do not hold at that branch and location (403 `FORBIDDEN`). The location must be in the branch (`LOCATION_NOT_IN_BRANCH`), the window must end after it starts (`NOT_AFTER_VALID_FROM`), and the Customer and Investor roles are for their own realms (`ROLE_NOT_FOR_REALM`), each 422 `GRANT_INVALID`. The same live grant twice is 422 `DUPLICATE_VALUE`. Every grant is audited as `PERMISSION_CHANGE` and published as `iam.RoleGranted` (1.10.0).\n\nPermission: `iam.grant.manage`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - TOTP_ENROLMENT_REQUIRED
  - STEP_UP_REQUIRED
  - DUPLICATE_VALUE
  - REFERENCE_NOT_FOUND
  - GRANT_INVALID
  - RATE_LIMITED
x-permission: iam.grant.manage
x-requires-step-up: true
parameters:
