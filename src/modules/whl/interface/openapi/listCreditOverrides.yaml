operationId: listCreditOverrides
tags:
  - whl
summary: "List approved credit overrides"
description: "The approved credit overrides at the branches where the caller reads accounts, newest first (FR-WHL-007, abuse case 14): who asked and why, the figures it was asked on, and who approved it. `from` and `to` bound when it was approved.\n\nPermission: `whl.account.read`."
x-permission: whl.account.read
parameters:
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
