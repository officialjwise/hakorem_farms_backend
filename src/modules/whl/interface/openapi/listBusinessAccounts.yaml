operationId: listBusinessAccounts
tags:
  - whl
summary: "List business accounts with credit exposure"
description: "The business accounts at the branches where the caller reads accounts, by customer, each with its figures as at now. `overLimit` keeps those whose exposure is above their limit (true) or not (false).\n\nPermission: `whl.account.read`."
x-permission: whl.account.read
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: accountManagerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: overLimit
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
