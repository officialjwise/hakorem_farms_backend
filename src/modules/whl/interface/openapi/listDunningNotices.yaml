operationId: listDunningNotices
tags:
  - whl
summary: "List reminders sent"
description: "The reminders queued to customers at the branches the reader holds `whl.dunning.read` for as a whole, newest first (FR-WHL-011): each level reaches an invoice or debit note at most once, with what was outstanding then, its days past due and the channels and template the level names. A reminder is queued to NTF through the outbox (`whl.DunningNoticeDue`); NTF sends it by the first channel the customer has not opted out of (B11). `from` keeps the reminders queued at or after that instant.\n\nPermission: `whl.dunning.read`."
x-permission: whl.dunning.read
parameters:
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
