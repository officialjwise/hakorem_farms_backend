operationId: updateBusinessAccount
tags:
  - whl
summary: "Change credit terms"
description: "Changes the terms at once: payment terms, the account manager, the overdue hold threshold, and closing or reopening. Every change to the credit limit, up or down, waits for an Owner or Manager who did not ask (CR-048): 202 with an approval of kind `CREDIT_LIMIT_CHANGE`, the other changes taking effect now; the database refuses a limit set without that approval. An account on hold is released through `releaseBusinessAccount`, never by an edit. Refusals: 409 `VERSION_CONFLICT`; 422 `ACCOUNT_INVALID` (`ACCOUNT_ON_HOLD`, `ACCOUNT_CLOSED`, `MANAGER_UNKNOWN`, `APPROVAL_PENDING`).\n\nPermission: `whl.account.manage`.\n\nMay require approval of kind `CREDIT_LIMIT_CHANGE`. When it does, the response is `202` with an `ApprovalPending` body and nothing of the limit takes effect until a different user approves."
x-permission: whl.account.manage
parameters:
  - name: customerId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/BusinessAccountUpdate"
      example:
        version: 5
        creditLimitPesewas: 2500000
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/BusinessAccount"
        example:
          customer:
            id: "019a7a87-848b-7de0-9318-e6d5c4925fb3"
            publicId: cus_TWMB751S2DFXTAM8
            name: "Royal Palm Hotel Ltd"
          branch:
            id: "019a7a80-1c2d-7e3f-8a4b-5c6d7e8f9a01"
            code: DDW
            name: Dodowa
          creditLimitPesewas: 2000000
          paymentTermsDays: 30
          accountManager:
            id: "019a7a86-e9e0-7c6e-81a7-cfc0641d489e"
            displayName: "Kojo Antwi"
          overdueHoldDays: 30
          status: ACTIVE
          holdReason: null
          heldAt: null
          exposurePesewas: 1164400
          availableCreditPesewas: 835600
          overduePesewas: 222500
          oldestOverdueDays: 34
          priceList:
            id: "019a7aa2-d389-78af-bde8-93cf32d40cad"
            code: CUST-ROYALPALM
            name: "Royal Palm Hotel contract prices"
          pendingCreditLimitPesewas: null
          pendingRelease: false
          currency: GHS
          version: 5
  "202":
    description: "Accepted for approval. Nothing has taken effect yet."
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ApprovalPending"
        example:
          status: PENDING_APPROVAL
          approvalRequestId: "019a7b10-4c5d-7e6f-8a7b-8c9d0e1f2a3b"
          kind: CREDIT_LIMIT_CHANGE
          subject:
            id: "019a7b10-2b3c-7d4e-8f50-61728394a5b6"
            docType: ACCOUNT_CHANGE
            number: null
          summary: "Change Royal Palm Hotel Ltd's credit limit from GH₵20,000.00 to GH₵25,000.00. Reason: Contract renewed for 2027"
          requestedAt: "2026-11-13T10:12:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
