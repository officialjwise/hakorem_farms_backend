operationId: listStandingOrderRuns
tags:
  - whl
summary: "List the runs of a standing order"
description: "One standing order's runs, newest date first: each run date once, with the order it made or the reason none was (`StandingOrderRun`).\n\nPermission: `whl.standing_order.read`."
x-permission: whl.standing_order.read
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
