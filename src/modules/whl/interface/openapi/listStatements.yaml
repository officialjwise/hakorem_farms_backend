operationId: listStatements
tags:
  - whl
summary: "List customer statements"
description: "The customer statements of the branches the caller reads them at, newest first, filtered by customer and by the period's last day. Each row carries the statement's figures with `lines` empty: read a statement's lines with `getStatement`, so a page stays light on a slow connection.\n\nPermission: `whl.statement.read`."
x-permission: whl.statement.read
parameters:
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: periodEnd
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
