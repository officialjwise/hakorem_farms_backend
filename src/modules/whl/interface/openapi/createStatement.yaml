operationId: createStatement
tags:
  - whl
summary: "Produce a customer statement"
description: "The statement of a customer's account at one branch for a period (FR-WHL-009, ADR-0085): the customer's trade receivables (ledger account 1200 against the customer) read from the ledger, so it ties to the books to the pesewa, whatever posted to the account: invoices and receipts, debit and credit notes, payments (a till's included), refunds, reversed payments and journals such as an opening balance. Each line is named by its source document's number, or by its journal's number when the source has none (a payment). Opening plus invoices and debit notes plus other charges, less credit notes, payments and other credits, equals closing, exactly. A balance in the customer's favour is shown as `openingCreditPesewas` or `closingCreditPesewas` beside a balance of zero, and each line's `balanceSide` is `C`.\n\n`branchId` names the branch; without it the caller must produce statements at exactly one branch (422 `STATEMENT_INVALID`, `BRANCH_REQUIRED`). The period ends today at the latest and spans at most 366 days (`PERIOD_REVERSED`, `PERIOD_NOT_ENDED`, `PERIOD_TOO_LONG`); an unknown customer is `CUSTOMER_UNKNOWN`.\n\nWith `issue: true` the statement is numbered from its branch's STATEMENT series (`STM-2026-DDW-000031`), then rendered and archived after commit: `documentId` is null until it is archived. One issued statement exists per customer, branch and period: asking again answers the first as it stands, so the same period gives the same document. With `issue: false` it is a stored draft with no number and no rendering.\n\nPermission: `whl.statement.create`."
x-permission: whl.statement.create
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/StatementCreate"
      example:
        customerId: "019a7a87-848b-7de0-9318-e6d5c4925fb3"
        branchId: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
        periodStart: "2026-10-01"
        periodEnd: "2026-10-31"
        issue: true
