operationId: getStatement
tags:
  - whl
summary: "Get a customer statement"
description: "A statement with every line, the brought-forward line first, as it was produced. `documentId` names its archived rendering once DOC has archived it.\n\nPermission: `whl.statement.read`."
x-permission: whl.statement.read
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
