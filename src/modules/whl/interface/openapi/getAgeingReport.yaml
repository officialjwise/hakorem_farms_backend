operationId: getAgeingReport
tags:
  - whl
summary: "Receivables ageing by 30, 60 and 90 days"
description: "Receivables ageing as at a date (FR-WHL-010, SA-21, ADR-0089): every invoice, receipt and debit note issued to a customer by `asOf` (today in Africa/Accra when left out; a later date ages what is on the books now), less its credit notes issued and the payments applied to it by then, goes whole into the band of its days past due, counted from its due date, or its issue date when it has none: Current (not yet past due), 1 to 30, 31 to 60, 61 to 90 and over 90. Each row is a customer with an open item or a receivables balance at the branches the reader holds `whl.ageing.read` for as a whole, by name; `ledgerPesewas` and `ledgerCreditPesewas` are its trade receivables (1200) as at the same date, and what 1200 holds that no open item explains is shown as not aged, never put into a bucket, so `totalPesewas` plus `notAgedPesewas` less `notAgedCreditPesewas` is the 1200 balance exactly. `totals` covers every customer the filter matches, not only the page. `accountManagerId` keeps the customers whose business account names that manager. `creditLimitPesewas` is null for a customer with no business account.\n\nPermission: `whl.ageing.read`."
x-permission: whl.ageing.read
parameters:
  - name: asOf
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: accountManagerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
