operationId: disposeFixedAsset
tags:
  - fin
summary: "Dispose of a fixed asset"
description: "Records the sale or scrapping of an asset and posts it through the ledger in the same transaction (FR-FIN-014, ADR-0059, `fin.FixedAssetDisposed`): Dr 1590 its accumulated depreciation, Dr the proceeds account, Cr its cost account (1510 to 1540) at cost, and the exact gain (Cr) or loss (Dr) to 4920, the proceeds less the net book value. Proceeds go to the named `bankAccountId` (an active bank account or wallet, against its own party) or, with none, into the safe (1010) as cash. Posted on `disposedOn` or not at all (422 `PERIOD_NOT_OPEN`). Run the depreciation of the months before the disposal first: a month not charged falls into the gain or loss. Refusals are 422 `FIXED_ASSET_INVALID` (`FUTURE_DATE`, `BEFORE_ACQUISITION`, `BEFORE_LAST_DEPRECIATION`, `ASSET_DISPOSED`, `DEPRECIATION_RUN_PENDING`, `BANK_ACCOUNT_NOT_AVAILABLE`) and `REFERENCE_NOT_FOUND` for an unknown bank account.\n\nPermission: `fin.fixed_asset.manage` at the asset's branch."
x-permission: fin.fixed_asset.manage
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - FIXED_ASSET_INVALID
  - REFERENCE_NOT_FOUND
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/FixedAssetDisposal"
      example:
        disposedOn: "2026-11-13"
        proceedsPesewas: 150000
        bankAccountId: "019a7a92-6491-77d8-bd10-86568cccff34"
        note: "Old scale sold to a neighbour"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/FixedAsset"
        example:
          id: "019a7add-8d43-7e84-93bd-f12038da69fe"
          assetNo: FA-0004
          name: "Platform scale, 300 kg"
          category: EQUIPMENT
          branch:
            id: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
            code: DDW
            name: "HaKorem Farms, Dodowa"
          acquiredOn: "2026-01-20"
          costPesewas: 420000
          residualPesewas: 0
          usefulLifeMonths: 36
          method: STRAIGHT_LINE
          accumulatedPesewas: 116670
          netBookValuePesewas: 303330
          status: DISPOSED
          disposedOn: "2026-11-13"
          currency: GHS
          version: 12
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
