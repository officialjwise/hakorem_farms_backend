operationId: createDepreciationRun
tags:
  - fin
summary: "Calculate depreciation for a period"
description: "Calculates the depreciation of one accounting period that has ended (the maker, FR-FIN-015, A-199). Each asset in service is charged every month up to the period that no posted run has charged, its months within its useful life: what is left to depreciate is spread with `allocate` over the months of the life not yet charged, the leftover pesewas in the earliest of them, so the schedule sums exactly to cost less residual (1,200,000 over 120 months is 10,000 a month; 1,000,001 over three months is 333,334, 333,334 and 333,333). Posts nothing. One run per period, ever, held by the database: a second is 422 `DEPRECIATION_RUN_EXISTS`. Other refusals: 422 `DEPRECIATION_RUN_INVALID` (`PERIOD_NOT_ENDED`, `NOTHING_TO_DEPRECIATE`), `PERIOD_NOT_OPEN` for a locked or closed period, `REFERENCE_NOT_FOUND` for an unknown period.\n\nPermission: `fin.fixed_asset.manage`."
x-permission: fin.fixed_asset.manage
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - REFERENCE_NOT_FOUND
  - DEPRECIATION_RUN_EXISTS
  - DEPRECIATION_RUN_INVALID
  - PERIOD_NOT_OPEN
  - RATE_LIMITED
parameters:
