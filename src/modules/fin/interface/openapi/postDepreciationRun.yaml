operationId: postDepreciationRun
tags:
  - fin
summary: "Post a depreciation run to the ledger"
description: "Posts a draft run (the checker, FR-FIN-015, ADR-0017): only someone other than the person who calculated it (403 `FORBIDDEN` for its maker; the database holds it too). Each line is recomputed from the asset as it stands and must be what was calculated, else 422 `DEPRECIATION_RUN_INVALID` `RUN_STALE` (an asset was changed or charged by another run since; the next period's run catches its months up). The ledger posts `fin.DepreciationRun` once per branch with assets on the run, Dr 6500 and Cr 1590 per asset with the asset as cost object, dated the period's last day and never moved: a locked or closed period is 422 `PERIOD_NOT_OPEN`. A posted run is 422 `INVALID_STATE_TRANSITION`.\n\nPermission: `fin.fixed_asset.manage`."
x-permission: fin.fixed_asset.manage
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - DEPRECIATION_RUN_INVALID
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
