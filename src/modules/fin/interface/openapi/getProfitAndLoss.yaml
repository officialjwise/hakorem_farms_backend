operationId: getProfitAndLoss
tags:
  - fin
summary: "Profit and loss for any date range"
description: "Income (net credits; a contra account such as 4210 price variance is a negative row), cost of sales and operating expenses (net debits), with gross and net profit, from `from` to `to` inclusive. Year close entries are left out, so a closed year still shows the profit it made. Rows are accounts with a figure; `checks` says whether net profit equals every income, cost and expense account's net credit summed directly, and whether the range's debits equal its credits. Each figure is an exact sum of journal lines in integer pesewas; a LOCKED or CLOSED period lying wholly inside the range, or wholly before it, is read from its period balances, computed by the database when it locked or closed (ADR-0058). `branchId` narrows every figure to one branch (each entry's lines carry its branch); without it, every branch. `from` after `to` is 400.\n\nPermission: `fin.report.read`."
x-permission: fin.report.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
security:
