operationId: submitManualJournal
tags:
  - fin
summary: "Submit a manual journal for approval"
description: "FR-FIN-008. Only the person who drafted it submits it (403 otherwise), and only a balanced DRAFT (422 `JOURNAL_UNBALANCED`; the database refuses an unbalanced journal in any case). Always answers 202 of kind `MANUAL_JOURNAL`: nothing posts until a different holder of `fin.journal.approve` approves it with step-up; the maker approving their own is 422 `MAKER_CANNOT_CHECK`. On approval the ledger posts exactly one balanced entry of kind MANUAL or OPENING, line for line as entered, on the journal's own date: a date whose period is not open is 422 `PERIOD_NOT_OPEN`, here or at approval, and is never moved to another day (A-190). A rejected journal is final.\n\nPermission: `fin.journal.create`.\n\nMay require approval of kind `MANUAL_JOURNAL`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves."
x-permission: fin.journal.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - JOURNAL_UNBALANCED
  - MANUAL_JOURNAL_INVALID
  - OPENING_ALREADY_POSTED
  - PERIOD_NOT_OPEN
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ManualJournal"
        example:
          id: "019a7ad4-9c2d-72c4-b7fc-35170bb0adf4"
          status: PENDING_APPROVAL
          kind: MANUAL
          postingDate: "2026-11-12"
          description: "November wages, farm hands"
          debitTotalPesewas: 960000
          creditTotalPesewas: 960000
          balanced: true
          currency: GHS
          approvalRequestId: "019a7ad4-bb1c-7ca7-81e0-d34e85614c2c"
          journalEntryId: null
          lines:
            - id: "019a7ad4-da0b-768b-9bc3-7185ff12ea63"
              lineNo: 1
              account:
                id: "019a7ad4-f8fa-706e-a5a7-0fbd78c3889b"
                code: "6000"
                name: Wages
              side: D
              amountPesewas: 960000
              subledger: null
              memo: null
            - id: "019a7ad5-17e9-7a52-bf8a-adf4f27426d2"
              lineNo: 2
              account:
                id: "019a7ad5-36d8-7435-896d-4c2c6c25c50a"
                code: "1010"
                name: "Cash, safe"
              side: C
              amountPesewas: 960000
              subledger: null
              memo: null
          branchId: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          version: 2
          createdAt: "2026-11-10T09:00:00Z"
          createdBy:
            id: "019a7a86-6e24-74e1-8a19-56e27d59cfc0"
            displayName: "Efua Asante"
  "202":
    description: "Accepted for approval. Nothing has taken effect yet."
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ApprovalPending"
        example:
          status: PENDING_APPROVAL
          approvalRequestId: "019a7ad8-5b1e-754f-aa88-5dcec81fd6ac"
          kind: MANUAL_JOURNAL
          subject:
            id: "019a7ad8-7a0d-7f33-b46b-fc0641d074e4"
            docType: STOCK_ADJUSTMENT
            number: null
          summary: "Awaiting approval by a different user with the approving permission"
          requestedAt: "2026-11-13T10:12:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
