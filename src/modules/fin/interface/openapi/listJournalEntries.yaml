operationId: listJournalEntries
tags:
  - fin
summary: "Search posted journals"
description: "Posted journal entries, newest first (posting date, then entry), each with its lines (FR-FIN-004). Journals are never edited: a correction is a REVERSAL entry. `accountId` keeps entries with a line on that account; `kind` is AUTO, MANUAL, OPENING, CLOSING or REVERSAL. A line's `subledger.id` is the party's ledger id, the one a manual journal line names as `subledgerPartyId`.\n\nPermission: `fin.journal.read`."
x-permission: fin.journal.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - INVALID_CURSOR
  - RATE_LIMITED
parameters:
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: accountId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: sourceDocumentId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: postingGroupId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: eventCode
    in: query
    required: false
    schema:
      type: string
  - name: kind
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
