operationId: createManualJournal
tags:
  - fin
summary: "Draft a manual journal"
description: "FR-FIN-008. Drafts a journal at the head office: nothing posts. Kind MANUAL, or OPENING for the opening balance journal on day one (A-005), which must have a line on 3900 opening balance equity; only one opening balance journal is ever pending or posted (422 `OPENING_ALREADY_POSTED`). Every line names a postable, active account and a positive amount, and a `subledgerPartyId` exactly when the account is a control account, of its kind (FR-FIN-004). The date is today or earlier. Refusals are 422 `MANUAL_JOURNAL_INVALID` with `details[].code` (`TOO_FEW_LINES`, `TOO_MANY_LINES`, `FUTURE_DATE`, `UNKNOWN_ACCOUNT`, `ACCOUNT_NOT_POSTABLE`, `SUBLEDGER_REQUIRED`, `SUBLEDGER_NOT_ALLOWED`, `SUBLEDGER_KIND_DIFFERS`, `UNKNOWN_SUBLEDGER`, `AMOUNT_NOT_POSITIVE`, `OPENING_WITHOUT_3900`). A draft may be unbalanced; `balanced` says so (A-190).\n\nPermission: `fin.journal.create`."
x-permission: fin.journal.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - MANUAL_JOURNAL_INVALID
  - OPENING_ALREADY_POSTED
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
