operationId: listFixedAssets
tags:
  - fin
summary: "List the fixed asset register"
description: "The fixed asset register in asset number order (FR-FIN-014, ADR-0059): cost, residual, useful life, the depreciation charged so far and the net book value (cost less accumulated depreciation), each exact in pesewas. An asset is never removed; one disposed of stays with `status` `DISPOSED` and its `disposedOn`. `category` and `status` filter the list.\n\nPermission: `fin.fixed_asset.read`."
x-permission: fin.fixed_asset.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: category
    in: query
    required: false
    schema:
      type: string
      enum:
        - VEHICLE
        - COLD_ROOM
        - HOUSING
        - EQUIPMENT
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - IN_USE
        - FULLY_DEPRECIATED
        - DISPOSED
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
