operationId: listBankAccounts
tags:
  - fin
summary: "List the business's bank accounts and wallets"
description: "The farm's own bank accounts and mobile money wallets, active and inactive, ordered by name (ADR-0057). Each number is shown only as `accountNoLast4`: the full number is stored encrypted and never leaves the ledger module in any response. Each account posts to its `glAccount` (1100 for a bank, 1110 for a wallet) against its own subledger party (A-194).\n\nPermission: `fin.bank_account.read`."
x-permission: fin.bank_account.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
