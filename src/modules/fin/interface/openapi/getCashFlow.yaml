operationId: getCashFlow
tags:
  - fin
summary: "Cash flow statement for any date range"
description: "The cash flow by the direct method over the cash and bank accounts 1000 to 1130 (FR-FIN-013): `OPENING_CASH` per account, then each account on the other side of the cash lines from `from` to `to` inclusive in its cash flow category (`OPERATING` when it has none), its credits less debits on those entries as an inflow or an outflow (`isNegative`), the `NET_CHANGE` and `CLOSING_CASH` per account. A move between two cash accounts is no flow. `checks` says whether opening cash plus the net change equals closing cash. Each figure is an exact sum of journal lines in integer pesewas; a LOCKED or CLOSED period lying wholly inside the range, or wholly before it, is read from its period balances, computed by the database when it locked or closed (ADR-0058). `branchId` narrows every figure to one branch (each entry's lines carry its branch); without it, every branch. `from` after `to` is 400.\n\nPermission: `fin.report.read`."
x-permission: fin.report.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
