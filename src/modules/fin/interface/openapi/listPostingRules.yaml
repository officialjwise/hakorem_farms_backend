operationId: listPostingRules
tags:
  - fin
summary: "List posting rules"
description: "Posting rules, with their validity `[validFrom, validTo)`; `at` keeps the rules in force on that date. `approvalRequestId` is null only for a rule seeded by migration (A-182). A rule whose `determinantType` is `ENTERED` posts each amount to the account a person entered (a manual journal, A-190).\n\nPermission: `fin.posting_rule.read`."
x-permission: fin.posting_rule.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - INVALID_CURSOR
  - RATE_LIMITED
parameters:
  - name: eventCode
    in: query
    required: false
    schema:
      type: string
  - name: at
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
