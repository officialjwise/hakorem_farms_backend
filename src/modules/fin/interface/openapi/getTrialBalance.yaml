operationId: getTrialBalance
tags:
  - fin
summary: "Trial balance for any date range"
description: "Every account's opening balance (lines before `from`), its debits and credits from `from` to `to` inclusive, and its closing balance, in account code order; accounts with no figure are left out unless `includeZero=true`. `totalDebitPesewas` and `totalCreditPesewas` are the debits and credits of the range over the whole filter (never sum the page), and `balanced` is true when they are equal, the closing balances net to zero and every debit less every credit to `to` is exactly zero. Year close entries are included, so after a year close the income and expense accounts close at nil. Each figure is an exact sum of journal lines in integer pesewas; a LOCKED or CLOSED period lying wholly inside the range, or wholly before it, is read from its period balances, computed by the database when it locked or closed (ADR-0058). `branchId` narrows every figure to one branch (each entry's lines carry its branch); without it, every branch. `from` after `to` is 400.\n\nPermission: `fin.report.read`."
x-permission: fin.report.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - INVALID_CURSOR
  - RATE_LIMITED
parameters:
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: includeZero
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
