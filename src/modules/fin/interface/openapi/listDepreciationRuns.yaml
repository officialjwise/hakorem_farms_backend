operationId: listDepreciationRuns
tags:
  - fin
summary: "List depreciation runs"
description: "Depreciation runs, newest first (FR-FIN-015, ADR-0059): one per accounting period, each with its exact lines per asset and its total. A `DRAFT` run has been calculated and waits for a different person to post it; a `POSTED` run names `journalEntryId`, the first of its entries (one per branch with assets on the run; `listJournalEntries` with `sourceDocumentId` set to the run's id lists them all).\n\nPermission: `fin.fixed_asset.read`."
x-permission: fin.fixed_asset.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
