operationId: getJournalEntry
tags:
  - fin
summary: "Get a journal entry"
description: "One posted journal entry with its lines; `totalPesewas` is the sum of its debits, which equals its credits (FR-FIN-003).\n\nPermission: `fin.journal.read`."
x-permission: fin.journal.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
