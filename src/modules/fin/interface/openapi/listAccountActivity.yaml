operationId: listAccountActivity
tags:
  - fin
summary: "Account activity with running balance"
description: "The account's lines from `from` to `to` inclusive, oldest first, each with the running balance; `openingBalancePesewas` is the balance before `from` and `closingBalancePesewas` the balance at `to`, both over the whole filter (never sum the page). A balance is never negative: its side says debit or credit, and a nil balance takes the account's normal side. `subledgerPartyId` and `branchId` narrow every figure. `from` after `to` is 400.\n\nPermission: `fin.journal.read`."
x-permission: fin.journal.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - NOT_FOUND
  - INVALID_CURSOR
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: subledgerPartyId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
