operationId: updateManualJournal
tags:
  - fin
summary: "Change a draft manual journal"
description: "Changes a DRAFT at the `version` read (409 `VERSION_CONFLICT` otherwise); `lines`, when sent, replace them all. Only the person who drafted it may change it (403), and any other status is 422 `INVALID_STATE_TRANSITION`. The same checks as `createManualJournal` apply (A-190).\n\nPermission: `fin.journal.create`."
x-permission: fin.journal.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - MANUAL_JOURNAL_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ManualJournalUpdate"
      example:
        version: 2
        postingDate: "2026-11-12"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ManualJournal"
        example:
          id: "019a7ad4-9c2d-72c4-b7fc-35170bb0adf4"
          status: PENDING_APPROVAL
          kind: MANUAL
          postingDate: "2026-11-12"
