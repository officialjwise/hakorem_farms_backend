operationId: updateAccount
tags:
  - fin
summary: "Rename or close an account"
description: "FR-FIN-002. Changes the name or the status at the `version` read (409 `VERSION_CONFLICT` otherwise). An account is closed only at a nil balance and once no posting rule or determination in force names it: 422 `ACCOUNT_INVALID` with `BALANCE_NOT_ZERO` or `IN_USE_BY_RULE` (A-188). A closed account takes no new lines. Code, type, side and subledger never change here; the database keeps them on an account with lines.\n\nPermission: `fin.account.manage`."
x-permission: fin.account.manage
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - VERSION_CONFLICT
  - ACCOUNT_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/AccountUpdate"
      example:
        version: 1
        name: "Generator fuel and servicing"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Account"
        example:
          id: "019a7ad0-04b3-7b00-9038-b8dafb6a31b8"
          code: "1000"
          name: "Cash on hand, tills"
          type: ASSET
          normalSide: D
          parentId: null
          isPostable: true
          subledgerKind: REGISTER
          cashFlowCategory: OPERATING
          status: ACTIVE
          version: 1
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
