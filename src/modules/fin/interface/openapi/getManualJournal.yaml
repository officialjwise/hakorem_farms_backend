operationId: getManualJournal
tags:
  - fin
summary: "Get a manual journal"
description: "A manual journal with its current lines, totals and, once posted, its journal entry.\n\nPermission: `fin.journal.read`."
x-permission: fin.journal.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
