operationId: listAccounts
tags:
  - fin
summary: "List the chart of accounts"
description: "The chart in code order (FR-FIN-001): type, normal side, postable flag, subledger kind and cash flow category of each account.\n\nPermission: `fin.account.read`."
x-permission: fin.account.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
