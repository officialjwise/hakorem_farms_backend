operationId: getBalanceSheet
tags:
  - fin
summary: "Balance sheet at a date"
description: "Every asset (a debit balance; accumulated depreciation is a negative row), liability and equity account (credit balances) at the end of `asOf`, with the earnings not yet closed to retained earnings as one equity row with no account (every income, cost and expense balance to date). `LIABILITIES_AND_EQUITY` is their sum; `checks` says whether assets equal it, as they do exactly whenever the ledger balances. Each figure is an exact sum of journal lines in integer pesewas; a LOCKED or CLOSED period lying wholly inside the range, or wholly before it, is read from its period balances, computed by the database when it locked or closed (ADR-0058). `branchId` narrows every figure to one branch (each entry's lines carry its branch); without it, every branch.\n\nPermission: `fin.report.read`."
x-permission: fin.report.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - RATE_LIMITED
parameters:
  - name: asOf
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
