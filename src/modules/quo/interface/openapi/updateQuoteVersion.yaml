operationId: updateQuoteVersion
tags:
  - quo
summary: "Edit a draft quote version"
description: "Edits a `DRAFT` version at its `version` (else 409 `VERSION_CONFLICT`): validity, terms, delivery estimate and fee, and its lines, priced as `createQuote` prices them. Any other version is 422 `INVALID_STATE_TRANSITION`: an issued version never changes, a change is a new version.\n\nPermission: `quo.quote.create`."
x-permission: quo.quote.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - VERSION_CONFLICT
  - INVALID_STATE_TRANSITION
  - QUOTE_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/QuoteVersionUpdate"
      example:
        version: 1
        lines:
          - productId: "019a7a8d-137d-74bf-b9f8-54cda260cdab"
            description: "Goats, 22 to 28 kg, West African Dwarf, for funeral"
            weightBandId: "019a7a8c-59e3-796a-9ea3-9f80c83a185e"
            quantity: "18.000"
            priceBasis: PER_HEAD
            unitPricePesewas: 95000
responses:
