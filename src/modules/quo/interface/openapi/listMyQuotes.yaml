operationId: listMyQuotes
tags:
  - quo
summary: "List my quotes"
description: "A signed-in customer's own quotes (FR-QUO-013), at every branch, newest first, in the buyer's shape: every quote issued to the customer the session belongs to, showing the accepted version, else the live one, else the last issued. Never a draft, a withdrawn quote, a cost, a floor or a margin. `status` is `ISSUED`, `ACCEPTED` (also once converted to an order), `DECLINED` or `EXPIRED` (past its validity). Nobody else's quote is listed, and no operation opens a quote by its id or number in the customer realm. A staff session is 403; no session 401.\n\nNo permission: the customer's own account."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - customerSession: []
