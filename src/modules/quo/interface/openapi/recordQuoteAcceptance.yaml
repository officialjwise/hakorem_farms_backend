operationId: recordQuoteAcceptance
tags:
  - quo
summary: "Record an acceptance given in person or by phone"
description: "An acceptance given in person or by phone (FR-QUO-010), with the buyer's name and a note of the evidence, identical in effect to a link acceptance. Without a `note` it is 422 `QUOTE_INVALID` `NOTE_REQUIRED`. Refused as a link would be: 409 `QUOTE_ALREADY_DECIDED`, 422 `QUOTE_LINK_CLOSED` (`EXPIRED`, `REPLACED`, `WITHDRAWN`).\n\nPermission: `quo.quote.issue`."
x-permission: quo.quote.issue
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - QUOTE_ALREADY_DECIDED
  - QUOTE_LINK_CLOSED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/QuoteAcceptanceRecord"
      example:
        method: PHONE_CONFIRMED
        acceptedName: "Emmanuel Tetteh"
        note: "Confirmed by phone at 10:40; asked for delivery on the 11th"
responses:
