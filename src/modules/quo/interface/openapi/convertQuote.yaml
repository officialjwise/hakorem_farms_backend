operationId: convertQuote
tags:
  - quo
summary: "Convert an accepted quote into an order"
description: "Converts an accepted quote into exactly one order (FR-QUO-011): channel `QUOTE`, `PLACED`, the quote as its `source`, each line priced `QUOTE` at the quoted price with `quoteLineId` naming its quote line, nothing re-priced (A-310). A line of animals that names none takes `stockUnitIds`, one order line per head (`ANIMALS_REQUIRED`, `ANIMALS_NOT_ON_QUOTE`); a line with no product cannot be ordered (`LINE_WITHOUT_PRODUCT`). The quote's hold on stock passes to the order, and its confirmation counts it as promised. Converting again is 409 `QUOTE_ALREADY_CONVERTED`; a quote not accepted is 422 `INVALID_STATE_TRANSITION`. Delivery is B11's: `DELIVERY`, an address or a slot are refused (`NOT_FOR_COLLECTION`, ORD's `FULFILMENT_NOT_AVAILABLE`). The order's proforma, and later its invoice, carry the order lines and so the quote lines.\n\nPermission: `quo.quote.convert`."
x-permission: quo.quote.convert
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - QUOTE_ALREADY_CONVERTED
  - QUOTE_INVALID
  - ORDER_INVALID
x-owner-module: ord
