operationId: revokeQuoteLink
tags:
  - quo
summary: "Revoke one acceptance link of a quote version"
description: "Revokes one acceptance link of an issued quote version, with the reason (the owner, 2026-11-18): from then on that link opens nothing, 404 `NOT_FOUND` as a link that never existed, while the version's other links keep working. Use it when a link reached the wrong person. A link is revoked once (422 `INVALID_STATE_TRANSITION` with `REVOKED`); revoking never reopens anything. A link the caller cannot reach at its branch, real or not, is 404. Answers the version with its `links`, never a token. Audited.\n\nPermission: `quo.quote.issue`."
x-permission: quo.quote.issue
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Sent to the wrong WhatsApp number"
