operationId: reviseQuote
tags:
  - quo
summary: "Start a new version of a quote"
description: "Starts a new `DRAFT` version of an issued quote (FR-QUO-006), copied from the live version or `copyFromVersionId` and priced again, with its change note. The live version stays live until the new one is issued. Only an `ISSUED` quote (else 422 `INVALID_STATE_TRANSITION`), and not while a draft or a version waiting for approval exists (`QUOTE_INVALID` `VERSION_OPEN`).\n\nPermission: `quo.quote.create`."
x-permission: quo.quote.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - QUOTE_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/QuoteVersionCreate"
      example:
        changeNote: "Reduced to eighteen goats and added delivery"
        copyFromVersionId: "019a7b01-519b-7d87-92bf-e144ed825a22"
responses:
