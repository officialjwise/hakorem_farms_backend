operationId: issueQuoteVersion
tags:
  - quo
summary: "Issue a quote version and send the acceptance link"
description: "Issues a draft (FR-QUO-004, FR-QUO-005, FR-QUO-007, FR-QUO-012), priced and judged again as things are now. Below the margin floor, **a margin over the selling price since 2.29.0 (the owner, 2026-11-23; LOUD: until then the same setting was read over cost, so a version at 10 percent markup, 264,000 over a cost of 240,000, now waits)** (seed 10 percent, compared exactly on the product lines' net without the delivery fee: (net less cost) x 10,000 against the floor x net; 266,668 over a cost of 240,000 clears it, 266,664 is below it though both show 10.00), with any line below the engine's floor, or with a cost unknown, it waits: 202 `ApprovalPending` of kind `QUOTE_BELOW_MARGIN`, decided by a holder of `quo.quote_margin.approve` with step-up who is neither the version's author (`QUOTE_AUTHOR_CANNOT_APPROVE`) nor the person who asked (`MAKER_CANNOT_CHECK`); **approving only approves (the owner, 2026-11-19; 2.19.0, LOUD: until then approval issued the version)**: the version becomes `APPROVED`, holds no stock, sends nothing and has no link; calling this again, by anyone but its approver (`APPROVER_CANNOT_ISSUE`), issues it as below at the figures approved and answers its link once. The database refuses an issued version below the floor without that approval, and an approver who issues it. Otherwise every product line is reserved for the validity in the base unit, a named animal itself, lots oldest first (an unnamed animal is chosen at conversion), as much as is on hand and never more. **Stock not on hand is no longer refused (the owner, 2026-11-18; 2.23.0, LOUD: until then it was 422 `QUOTE_INVALID` `STOCK_SHORT`)**: the version is issued `subjectToStock`, each line showing what was there (`availableQuantity`) and what it holds (`heldQuantity`); `STOCK_SHORT` now answers only a balance that changed under a concurrent issue. The version is rendered and archived once as its own revision of the quote's document (`documentId`, FR-QUO-007). The live version, if any, is superseded and its hold released, and `quo.QuoteIssued` is queued once for the link to be sent (B11). The answer carries `acceptanceLinkToken`, made now; asking again for an issued version answers a fresh token and sends nothing again. Other refusals: `NO_LINES`, `LINE_NOT_PRICED`, `VALIDITY_PASSED`, `APPROVER_CANNOT_ISSUE`.\n\nPermission: `quo.quote.issue`."
x-permission: quo.quote.issue
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - QUOTE_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
