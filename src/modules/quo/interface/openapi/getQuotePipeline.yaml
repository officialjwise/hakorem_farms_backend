operationId: getQuotePipeline
tags:
  - quo
summary: "Quote pipeline: issued, accepted, declined, expired and win rate"
description: "The quote pipeline of the caller's branches (FR-QUO-013): the quotes created from the start of `from` to the end of `to` (Accra dates, both included) that were ever issued, one row per salesperson or per product line, ordered by its label. `issued` counts them all; `accepted` those accepted, converted ones included; `declined`, `expired` and `converted` those standing so; the rest are still open. `winRatePercent` is accepted over accepted plus declined plus expired, half-up to two places, `0.00` with nothing closed. `issuedValuePesewas` is the gross of each quote's accepted version, else its last issued one; `wonValuePesewas` of those accepted. A draft and a version waiting for approval are not in it. A quote withdrawn after issue (`cancelQuote`, with its reason) is its own outcome (2.43.0, the owner, 2026-11-23, A-329 (b)): counted in `withdrawn` with the gross of its last issued version in `withdrawnValuePesewas`, and in neither `issued` nor the win rate. The rows reconcile to `listQuotes` over the same instants, status by status (the SRS's 4 accepted, 3 declined and 3 expired give 40.00). A product line is the product's ledger group; a quote of free text only is `No product line`, its `group.id` null as every product line's. `to` before `from` is 400 `VALIDATION_FAILED` `PERIOD_ENDS_BEFORE_IT_STARTS`.\n\nPermission: `quo.report.read` (Sales, the Manager and the Owner, A-329)."
x-permission: quo.report.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: groupBy
    in: query
    required: true
    schema:
      type: string
      enum:
        - SALESPERSON
        - PRODUCT_LINE
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
