operationId: listQuoteVersions
tags:
  - quo
summary: "List every version of a quote"
description: "Every version of a quote, newest first, each with its author (`createdBy`), time and totals (FR-QUO-006). An issued version never changes; the database refuses it.\n\nPermission: `quo.quote.read`."
x-permission: quo.quote.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - NOT_FOUND
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
