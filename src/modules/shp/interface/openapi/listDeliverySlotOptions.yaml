operationId: listDeliverySlotOptions
tags:
  - shp
summary: "List delivery slots for a zone"
description: "Anonymous (FR-SHP-009): a zone's delivery slots that have not started, from `from` (default today), in the order they start. `remaining` is capacity less bookings; capacity is not enforced until B11 (SA-13)."
x-error-codes:
  - VALIDATION_FAILED
  - RATE_LIMITED
parameters:
  - name: zoneId
    in: query
    required: true
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/SlotOptionPage"
        examples:
          default:
            value:
              data:
                - id: "019a7afd-16ee-736d-a8a6-3faf4a4fb88d"
                  date: "2026-11-14"
                  startsAt: "10:00"
                  endsAt: "12:00"
                  available: true
                  remaining: 4
                - id: "019a7a94-b04e-73ba-a8f2-447494efbd52"
                  date: "2026-11-14"
                  startsAt: "14:00"
                  endsAt: "16:00"
                  available: false
                  remaining: 0
                - id: "019a7afd-35dd-7d51-b289-dde6c40056c4"
                  date: "2026-11-15"
                  startsAt: "10:00"
                  endsAt: "12:00"
                  available: true
                  remaining: 6
                - id: "019a7af2-74c6-7d3c-a275-dc9d7577557b"
                  date: "2026-11-15"
                  startsAt: "14:00"
                  endsAt: "16:00"
                  available: true
                  remaining: 6
                - id: "019a7afd-54cc-7734-8c6d-7c1e3db1f4fc"
                  date: "2026-11-16"
                  startsAt: "10:00"
                  endsAt: "12:00"
                  available: true
                  remaining: 8
                - id: "019a7afd-73bb-7118-9650-1a55b7629333"
                  date: "2026-11-16"
                  startsAt: "14:00"
                  endsAt: "16:00"
                  available: true
                  remaining: 8
              page:
                nextCursor: null
                limit: 25
                hasMore: false
          empty:
            summary: "Nothing matches: no rows and no next page"
            value:
              data: []
              page:
                nextCursor: null
                limit: 25
                hasMore: false
  "400":
    $ref: "#/components/responses/BadRequest"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
