operationId: listCatalogue
tags:
  - shp
summary: "Browse and search the public catalogue"
description: "Anonymous and cacheable (FR-SHP-001). One request renders a listing page: no per-item calls. Active products listed online or on request, by category, with search over name and description, filters and cursor pagination. Prices come from the pricing engine on the ONLINE channel: a banded live animal shows the range of its band list prices and `REQUEST_TO_BUY`. No cost, floor, ceiling or stock quantity is ever in the response; availability is a level. `sort` is applied before paging, through the shared sort (CR-019): `RELEVANCE` (the default, the shop's category order then name), `PRICE_ASC` and `PRICE_DESC` (unpriced items last either way) and `NAME`; ties are broken by the product id, so a cursor never skips or repeats an item. Any other value is 400 `VALIDATION_FAILED` with detail `SORT_NOT_ALLOWED`. The listing is refreshed every minute (A-178); a cart and a checkout price live."
x-error-codes:
  - VALIDATION_FAILED
  - RATE_LIMITED
parameters:
  - name: q
    in: query
    required: false
    schema:
      type: string
  - name: category
    in: query
    required: false
    schema:
      type: string
  - name: productLine
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/ProductLine"
  - name: availability
    in: query
    required: false
    schema:
      type: string
      enum:
        - IN_STOCK
        - LOW_STOCK
        - OUT_OF_STOCK
        - ON_REQUEST
  - name: sort
    in: query
    required: false
    schema:
      type: string
      enum:
        - RELEVANCE
        - PRICE_ASC
        - PRICE_DESC
        - NAME
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security: []
