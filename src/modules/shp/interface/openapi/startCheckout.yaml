operationId: startCheckout
tags:
  - shp
summary: "Start checkout: price, reserve stock and show the totals"
description: "Re-resolves every price and reserves every line at serializable isolation, or reserves none (FR-SHP-005): a line the stock that may be promised cannot cover is 422 `STOCK_UNAVAILABLE`, naming it, and nothing is held. The checkout holds stock for 15 minutes (a setting, A-045); after that the reservations expire, the checkout ends `EXPIRED` and the cart is active again (FR-SHP-006). Delivery is priced from the zone of `address` (a guest gives the address; `deliveryAddressId` needs an account, B09a): an address in no zone is 422 `DELIVERY_UNAVAILABLE`, collection only. A chosen `deliverySlotId` is stored through its foreign key; it must be of the address's zone and not started (422 `SLOT_UNAVAILABLE`); capacity is B11's. Cash on delivery needs delivery. `priceChanged` is true when a price moved since it was added. Rate limited as checkout: 30 per address per 10 minutes, refused while the limiter is down."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - CART_NOT_ACTIVE
  - CART_EMPTY
  - REQUEST_TO_BUY_ONLY
  - PRODUCT_UNAVAILABLE
  - STOCK_UNAVAILABLE
  - DELIVERY_UNAVAILABLE
  - SLOT_UNAVAILABLE
  - CHECKOUT_INVALID
  - COUPON_UNAVAILABLE
  - RATE_LIMITED
  - SERVICE_UNAVAILABLE
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
security:
  - {}
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/CheckoutStart"
      example:
        contactName: "Ama Serwaa Ofori"
        contactPhone: "+233244512876"
        fulfilmentMode: DELIVERY
        deliveryAddressId: "019a7a95-88d7-78f2-9e2a-97f8e8c610d6"
        deliverySlotId: "019a7afd-16ee-736d-a8a6-3faf4a4fb88d"
        paymentTerms: PREPAID
        differencePreference: REFUND
