operationId: placeOrder
tags:
  - shp
summary: "Place the order and start payment"
description: "Creates the order (channel ONLINE, PLACED, from this checkout) and starts payment for the estimated total, in one transaction with the checkout moving to AWAITING_PAYMENT. Mobile money: a charge is written PENDING and sent to the provider after the transaction commits; the order is confirmed only when that payment clears for it through the provider's own answer (webhook lookup or sweep), and the checkout then completes and the cart converts. If the checkout's hold lapses first, or the charge fails, the order is cancelled (PAYMENT_NOT_RECEIVED) and money that still arrives is held unmatched for a person to refund. Card (since 2.30.0, B09c, A-287; LOUD): the payment is written PENDING with the order the same way, and once the transaction has committed Paystack's hosted page is opened (channels card only, the order's estimate in GHS, the server's return address) and answered as `payment.redirectUrl`, always on `https://checkout.paystack.com/`; send the browser there. No card number, expiry or security code is ever sent to this API: a request naming one is 400. The order is confirmed when the payment clears for it, exactly as for mobile money; a declined card may be retried on the same page while the order waits. A page that cannot be opened answers 503 PAYMENT_PROVIDER_UNAVAILABLE with the order placed and its payment PENDING: replay with the same Idempotency-Key to open it (never a second page). Cash on delivery: the order is confirmed at once. As built in 1.51.0 (A-232): a guest checkout only (the guest cookie proves the checkout; a customer session adds nothing yet); the rule code CARD_NOT_AVAILABLE is deprecated and no longer answered since 2.30.0 (A-232 (b) superseded); no coupon or promotion (PROMOTION_NOT_AVAILABLE); the method must match the checkout's terms (PAYMENT_METHOD_MISMATCH); mobile money needs payerPhone and network (PAYER_PHONE_REQUIRED, INVALID_PHONE, NETWORK_REQUIRED); a price the engine no longer gives is 422 ORDER_INVALID PRICE_CHANGED; a checkout that is not open or whose hold lapsed is 409 CHECKOUT_NOT_OPEN; 503 while the provider cannot take a charge, with nothing placed. A replay with the same Idempotency-Key answers the same order and sends no second charge; its `trackingToken` is a fresh one (a token is stored only as its hash, never in the stored answer), and the first stays valid (ADR-0074)."
x-owner-module: ord
