operationId: updateCheckout
tags:
  - shp
summary: "Change the address, slot or payment terms of a checkout"
description: "Changes the address, slot, payment terms or difference preference of a started checkout, and re-prices the delivery (FR-SHP-008); the lines and their reservations do not change. An ended or lapsed checkout is 409 `CHECKOUT_NOT_OPEN`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - ORIGIN_NOT_ALLOWED
  - NOT_FOUND
  - CHECKOUT_NOT_OPEN
  - DELIVERY_UNAVAILABLE
  - SLOT_UNAVAILABLE
  - CHECKOUT_INVALID
  - RATE_LIMITED
  - SERVICE_UNAVAILABLE
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
security:
  - {}
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/CheckoutUpdate"
      example:
        deliverySlotId: "019a7afd-35dd-7d51-b289-dde6c40056c4"
