operationId: createOverheadAllocation
tags:
  - cst
summary: "Spread a period's labour or overhead over the animals"
description: "FR-CST-002, ADR-0018, ADR-0102 (2.47.0). Spreads a period's labour or overhead over the livestock of a pen (`scopeLocationId`) or a whole branch (`branchId`) through `allocate`: by head-days (each day's whole head on hand there at the end of the day, Africa/Accra) or equally (`EQUAL`, one each). 30,001 over head-days of 10, 10 and 5 is 12,001, 12,000 and 6,000, the leftover pesewa on the first tag. The lines sum exactly to `totalPesewas` (the database checks it at commit). A growing animal's share is CAPITALISED; a breeding or laying animal's, or one no longer on hand, is EXPENSED and stays in the period's cost. The run is a DRAFT: nothing posts until a different person posts it. 422 `ALLOCATION_INVALID`: `BRANCH_REQUIRED`, `PERIOD_INVALID` (the end before the start, or after today), `SCOPE_NOT_A_PEN`, `BASIS_NOT_SUPPORTED` (`WEIGHT_GAIN`, BL-128), `NO_ANIMALS_IN_SCOPE`.\n\nPermission: `cst.allocation.manage`."
x-permission: cst.allocation.manage
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
