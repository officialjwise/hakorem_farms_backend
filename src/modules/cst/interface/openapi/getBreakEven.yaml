operationId: getBreakEven
tags:
  - cst
summary: "Break-even and contribution margin by product line"
description: "FR-CST-005, FR-CST-006, ADR-0102 (2.47.0). Written for the owner, not the accountant. For each product line over the range: revenue and variable cost (cost of sales) as `listMargins` answers them, contribution and its share of the whole, the units sold, the average net price and variable cost per unit (each half-up once), contribution per unit, and break-even: the line's share of the period's operating expenses (assigned by revenue through `allocate`) over contribution per unit, rounded up to a whole unit, and those units at the average price. Fixed costs 600,000 at 85,000 a head with 71,400 variable break even at 45 heads (44.12 rounded up) and 3,825,000. With contribution per unit of nothing or less there is no break-even: the figures are null and the explanation says so. 422 `REPORT_PERIOD_INVALID`.\n\nPermission: `cst.margin.read`."
x-permission: cst.margin.read
parameters:
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
