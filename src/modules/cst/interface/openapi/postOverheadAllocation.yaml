operationId: postOverheadAllocation
tags:
  - cst
summary: "Post an allocation as value-only stock movements"
description: "FR-CST-002, ADR-0017, ADR-0018, ADR-0102 (2.47.0). Posts a DRAFT run created by someone else: each capitalised share above nothing becomes a value-only `OVERHEAD_CAPITALISE` movement onto its animal, which the ledger posts in the same transaction (Dr inventory by the product's GL group, Cr 5220 Labour and overhead absorbed into stock); an expensed share posts nothing. The lines sum exactly to the total. One posted run per branch, cost element, scope and period. 422 `MAKER_CANNOT_CHECK` (the person who created it); 422 `ALLOCATION_INVALID`: `ALREADY_POSTED`, `PERIOD_ALREADY_POSTED`, `UNIT_NOT_ON_HAND` (an animal with a capitalised share has left since: make the run again).\n\nPermission: `cst.allocation.post`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-permission: cst.allocation.post
x-requires-step-up: true
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
