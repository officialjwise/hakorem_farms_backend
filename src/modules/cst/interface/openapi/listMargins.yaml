operationId: listMargins
tags:
  - cst
summary: "Margin by product, line, channel, customer, salesperson or branch"
description: "FR-CST-003, FR-CST-004, ADR-0102 (2.47.0). Margin by product, product line, channel, customer, salesperson or branch for a range of Africa/Accra business dates: revenue is each billed product line's net, which excludes levies (a credit note's line takes it back), and cost is the cost of sales of the sale issues and returns those sales moved, by the order line they were of. Margin is over the selling price (the owner, 2026-11-23): gross margin over revenue, 13,600 over 85,000 is 16.00. Price variances (4210) are shown, never hidden. `totals` cover the whole filter, never a page; the groups always add up to them. `qty` and `weightKg` are the net billed, by product only. Without `branchId`, every branch the caller reads in full. 422 `REPORT_PERIOD_INVALID`: `FROM_AFTER_TO`, `AFTER_TODAY`.\n\nPermission: `cst.margin.read`."
x-permission: cst.margin.read
parameters:
  - name: groupBy
    in: query
    required: true
    schema:
      type: string
      enum:
        - PRODUCT
        - PRODUCT_LINE
        - CHANNEL
        - CUSTOMER
        - SALESPERSON
        - BRANCH
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
