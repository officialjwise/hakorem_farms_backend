operationId: submitMortalityRecord
tags:
  - liv
summary: "Submit a mortality for write-off"
description: "Values the record again from the cost pool and writes the stock off. At or above the value threshold (50,000 pesewas on the seeded farm) a photograph is required first (422 `MORTALITY_PHOTO_REQUIRED`) and a second approver after: this is the control for abuse case 2. Only the person who reported the record submits it, so the approver is never the reporter.\n\n**Who confirms (1.31.0, B06r):** a reporter who holds `liv.mortality.post` (the Owner, the Manager, the Storekeeper) writes off below the threshold at once, and a photograph attached must then be `CLEAN` (422 `EVIDENCE_NOT_SCANNED`). One who does not (the Farm hand) never writes stock off alone: below the threshold the answer is 202 `ApprovalPending` of kind `MORTALITY_CONFIRMATION`, confirmed with `approveRequest` by a different holder of `liv.mortality.confirm` (the Owner, the Manager), with no step-up; at or above it `MORTALITY_WRITE_OFF`, as for every reporter.\n\n**Death photographs (1.31.0, B06r):** the photograph is an `EVIDENCE` file and may still be `PENDING` its malware scan when the record is reported and submitted, so nobody waits at the pen; a file the scanner has already rejected is refused (`PHOTO_NOT_USABLE`). The record is approved only once the photograph is `CLEAN` (422 `EVIDENCE_NOT_SCANNED` until then); if the scan rejects it, the waiting record goes back to its maker as `RETURNED` with its `returnedReason`, and its approval request is withdrawn. The client should open the camera directly for death evidence, never the gallery (the owner's rule, 2026-11-15): a deterrent only, since the server cannot tell a camera photograph from a gallery one. A photograph whose exact bytes (SHA-256) are already on another death or cull record is published for the daily exception report (`liv.MortalityPhotoReused`, abuse case 2); a re-saved, resized or cropped copy has other bytes and is not matched.\n\nPermission: `liv.mortality.report`.\n\nMay require approval of kind `MORTALITY_WRITE_OFF`, decided with `approveRequest` by a different user holding `liv.mortality.approve`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves: the animal stays on hand. The answer carries the value written off, so the caller also needs `liv.mortality.read` at the same scope (`x-answer-permission`, ADR-0052); the Farm hand, who holds the write but not the read, uses `submitCareMortalityRecord`."
x-permission: liv.mortality.report
x-answer-permission: liv.mortality.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - LIVESTOCK_RECORD_INVALID
  - MORTALITY_PHOTO_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
