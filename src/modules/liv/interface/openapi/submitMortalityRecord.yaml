            identifier: BRL-2610-01
            tracking: LOT
          animal: null
          head: 3
          reasonCode: DISEASE_SUSPECTED
          foundAt: "2026-11-12T06:00:00Z"
          location:
            id: "019a7a84-0378-7f1b-8454-fa8cfb85736a"
            code: HSE-B1
            name: "Broiler house 1"
            kind: PEN
          reportedBy:
            id: "019a7a87-08cf-7652-9b8a-6df7ddcee6d5"
            displayName: "Abena Quaye"
