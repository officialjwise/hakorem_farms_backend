operationId: updateCareAnimal
tags:
  - liv
summary: "Edit an animal, answered without cost"
description: "The Farm hand's cost-free door to `updateAnimal` (ADR-0052): the same rules, checks and effects, answered in a shape that carries no cost and no price. Unlike `updateAnimal` it needs no read permission, because its answer shows nothing the write's own permission does not.\n\nBreed, sex, purpose and grade may change; species, acquisition, source and cost are not fields. The sex of a dam with a breeding record is fixed (SEX_FIXED_AS_DAM), and the tag, which is the stock unit's identifier, is accepted only unchanged (TAG_NOT_EDITABLE). Purpose decides whether later feed and veterinary cost is capitalised or expensed.\n\nPermission: `liv.animal.update`, scoped as `updateAnimal` is."
x-permission: liv.animal.update
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - VERSION_CONFLICT
  - LIVESTOCK_RECORD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/AnimalUpdate"
      example:
        version: 4
        purpose: BREEDING
