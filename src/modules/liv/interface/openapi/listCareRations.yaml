operationId: listCareRations
tags:
  - liv
summary: "List feed rations (the care door)"
description: "The Farm hand's cost-free read of the rations (ADR-0052): the same rules, filters and scope as `listRations`, answered in a shape that carries no cost and no price.\n\nPermission: `liv.feed.read`.\n\nPermission: `liv.care.read`, scoped as `listRations` is."
x-permission: liv.care.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: speciesId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
