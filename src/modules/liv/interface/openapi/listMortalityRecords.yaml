    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
