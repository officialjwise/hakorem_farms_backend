operationId: listGrowth
tags:
  - liv
summary: "Growth, feed conversion and mortality by pen or batch"
description: "A pen's figures are over the animals and flocks that stood in it for the whole window; a batch's over its flock. Average daily gain is the weighed head's total gain over their days between first and last weighing in the window; feed conversion is the feed issued in the window over the kilograms gained, to three places; mortality is the deaths in the window over the head at its start. A loss of weight shows no gain, daily gain or conversion.\n\nPermission: `liv.report.read`."
x-permission: liv.report.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - LIVESTOCK_RECORD_INVALID
  - RATE_LIMITED
parameters:
  - name: groupBy
    in: query
    required: true
    schema:
      type: string
      enum:
        - PEN
        - BATCH
  - name: from
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: true
    schema:
      type: string
      format: date
  - name: speciesId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
