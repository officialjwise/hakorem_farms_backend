operationId: listCareAnimals
tags:
  - liv
summary: "List animals without cost"
description: "The Farm hand's cost-free read of the animal register (ADR-0052): the same rules, filters and scope as `listAnimals`, answered in a shape that carries no cost and no price.\n\nPermission: `liv.animal.read`.\n\nPermission: `liv.care.read`, scoped as `listAnimals` is."
x-permission: liv.care.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: q
    in: query
    required: false
    schema:
      type: string
  - name: speciesId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: locationId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - ALIVE
        - SOLD
        - SLAUGHTERED
        - DEAD
        - CULLED
  - name: sellable
    in: query
    required: false
    schema:
      type: boolean
  - name: purpose
    in: query
    required: false
    schema:
      type: string
      enum:
        - GROWING
        - BREEDING
  - name: weightBandId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
