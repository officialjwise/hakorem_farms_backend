operationId: reportMortality
tags:
  - liv
summary: "Report a death or cull"
description: "Permission: `liv.mortality.report`.\n\nAccepted from an offline queue: the client supplies the record id (UUIDv7), and a resubmission with the same id returns the first result. The answer carries the value written off, so the caller also needs `liv.mortality.read` at the same scope (`x-answer-permission`, ADR-0052); the Farm hand, who holds the write but not the read, uses `reportCareMortality`."
x-permission: liv.mortality.report
x-answer-permission: liv.mortality.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - LIVESTOCK_RECORD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/MortalityRecordCreate"
      example:
        id: "019a7ac1-84ab-7860-9d98-8ed9f07207b7"
        kind: DEATH
        stockUnitId: "019a7a8f-bc07-7e4c-9384-ed921796666f"
        reasonCode: DISEASE_SUSPECTED
