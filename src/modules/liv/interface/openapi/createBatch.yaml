operationId: createBatch
tags:
  - liv
summary: "Start a batch"
description: "Hatches a flock on the farm: registers its lot and brings its head into the pen by a BIRTH movement at nil cost. The species must have exactly one lot-tracked product. A flock bought from a supplier opens its batch when its goods receipt is posted.\n\nPermission: `liv.batch.create`. The answer carries the batch's accumulated cost, so the caller also needs `liv.batch.read` at the same scope (`x-answer-permission`, ADR-0052); the Farm hand, who holds the write but not the read, uses `createCareBatch`."
x-permission: liv.batch.create
x-answer-permission: liv.batch.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - LIVESTOCK_RECORD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/BatchCreate"
      example:
        batchNo: BRL-2611-01
        speciesId: "019a7a8b-fd16-7bc0-a0f8-c4da5b273db8"
        startedOn: "2026-11-12"
        initialHead: 500
        purpose: GROWING
        locationId: "019a7a84-0378-7f1b-8454-fa8cfb85736a"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Batch"
        example:
          id: "019a7abe-6065-7746-bc7e-7d379478f615"
          batchNo: BRL-2611-01
          species:
            id: "019a7a8b-fd16-7bc0-a0f8-c4da5b273db8"
            code: BROILER
            name: "Broiler chicken"
          stockUnit:
            id: "019a7abe-6a11-7b22-8c33-d44e55f66a77"
            identifier: BRL-2611-01
            tracking: LOT
          startedOn: "2026-11-12"
          initialHead: 500
          currentHead: 500
          purpose: GROWING
          status: ACTIVE
          location:
            id: "019a7a84-0378-7f1b-8454-fa8cfb85736a"
            code: HSE-B1
            name: "Broiler house 1"
            kind: PEN
          mortalityPercent: "0.00"
          accumulatedCostPesewas: 0
          currency: GHS
          version: 1
