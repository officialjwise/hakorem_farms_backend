operationId: createBreedingRecord
tags:
  - liv
summary: "Record a mating"
description: "Permission: `liv.breeding.record`."
x-permission: liv.breeding.record
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - LIVESTOCK_RECORD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/BreedingRecordCreate"
      example:
        damId: "019a7a8f-a122-7d10-9a6e-4c2f0b1d0122"
        sireId: "019a7abf-19ff-729b-97d3-32846e9eab62"
        matedOn: "2026-11-10"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/BreedingRecord"
        example:
          id: "019a7ac1-1a2b-7c3d-8e4f-50617283a4b5"
          dam:
            id: "019a7a8f-a122-7d10-9a6e-4c2f0b1d0122"
            tagNo: G-0122
          sire:
            id: "019a7abf-19ff-729b-97d3-32846e9eab62"
            tagNo: G-0101
          matedOn: "2026-11-10"
          expectedBirthOn: "2027-04-08"
          actualBirthOn: null
          litterSize: null
          liveBirths: null
          status: MATED
          notes: null
          offspring: []
          version: 1
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
