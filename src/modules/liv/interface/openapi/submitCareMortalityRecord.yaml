            docType: MORTALITY_RECORD
            number: null
          summary: "Death of G-0171 (DISEASE_SUSPECTED), valued 58900 pesewas"
          requestedAt: "2026-11-13T07:40:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
