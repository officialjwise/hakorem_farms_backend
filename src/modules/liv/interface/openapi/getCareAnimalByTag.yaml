operationId: getCareAnimalByTag
tags:
  - liv
summary: "Find a live animal by its exact tag, without cost"
description: "The Farm hand's lookup at the pen (CR-021, 1.31.0; ADR-0052): the live animal carrying exactly this tag, answered in the cost-free `CareAnimal` shape, so a goat, sheep or pig can be weighed, treated or reported dead by its ear tag. The match is exact, character for character: another case, a prefix or a longer tag is not the same tag. Only an animal still `ALIVE` is found, since one live animal holds a tag at a time; an unknown tag, or one whose animal has died, been sold or slaughtered, is 404 `NOT_FOUND`. A tag containing `/` is sent percent-encoded (`%2F`).\n\nPermission: `liv.care.read`, scoped as `getCareAnimal` is."
x-permission: liv.care.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: tagNo
    in: path
    required: true
    description: "The ear tag exactly as it is registered, for example `G-0142`."
    schema:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9/_-]{0,39}$"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
