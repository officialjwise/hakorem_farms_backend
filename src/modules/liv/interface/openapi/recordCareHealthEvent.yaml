operationId: recordCareHealthEvent
tags:
  - liv
summary: "Record a health event, answered without cost"
description: "The Farm hand's cost-free door to `recordHealthEvent` (ADR-0052): the same rules, checks and effects, answered in a shape that carries no cost and no price. Unlike `recordHealthEvent` it needs no read permission, because its answer shows nothing the write's own permission does not.\n\nA product with withdrawal days places a WITHDRAWAL hold on every animal treated, in the same transaction, which blocks sale and slaughter until it ends. Medication used is issued from stock and its cost capitalised onto the animals.\n\nPermission: `liv.health.record`, scoped as `recordHealthEvent` is."
x-permission: liv.health.record
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - LIVESTOCK_RECORD_INVALID
  - REFERENCE_NOT_FOUND
  - INSUFFICIENT_STOCK
  - STOCK_HOLD_INVALID
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
