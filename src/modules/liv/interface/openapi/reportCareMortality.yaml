operationId: reportCareMortality
tags:
  - liv
summary: "Report a death or cull, answered without cost"
description: "The Farm hand's cost-free door to `reportMortality` (ADR-0052): the same rules, checks and effects, answered in a shape that carries no cost and no price. Unlike `reportMortality` it needs no read permission, because its answer shows nothing the write's own permission does not.\n\n**Death photographs (1.31.0, B06r):** the photograph is an `EVIDENCE` file and may still be `PENDING` its malware scan when the record is reported and submitted, so nobody waits at the pen; a file the scanner has already rejected is refused (`PHOTO_NOT_USABLE`). The record is approved only once the photograph is `CLEAN` (422 `EVIDENCE_NOT_SCANNED` until then); if the scan rejects it, the waiting record goes back to its maker as `RETURNED` with its `returnedReason`, and its approval request is withdrawn. The client should open the camera directly for death evidence, never the gallery (the owner's rule, 2026-11-15): a deterrent only, since the server cannot tell a camera photograph from a gallery one. A photograph whose exact bytes (SHA-256) are already on another death or cull record is published for the daily exception report (`liv.MortalityPhotoReused`, abuse case 2); a re-saved, resized or cropped copy has other bytes and is not matched.\n\nPermission: `liv.mortality.report`.\n\nAccepted from an offline queue: the client supplies the record id (UUIDv7), and a resubmission with the same id returns the first result.\n\nPermission: `liv.mortality.report`, scoped as `reportMortality` is.\n\n**Who takes and opens the photograph (CR-022, 1.40.0):** the Farm hand holds `platform.file.upload.evidence`, which uploads an `EVIDENCE` file and nothing else; the Owner and the Manager hold `platform.file.upload`. The Owner and the Manager, who hold `liv.mortality.approve` and so decide `MORTALITY_WRITE_OFF`, also hold `platform.file.read.any`: they open the reporter's photograph through `getFile` and, once it is `CLEAN`, `createFileSignedUrl`."
