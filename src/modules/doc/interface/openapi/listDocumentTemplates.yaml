operationId: listDocumentTemplates
tags:
  - doc
summary: "List document templates"
description: "Every document template, one per document type and output (`PDF_A4`, `THERMAL_80MM`, `THERMAL_58MM`), with its active version (FR-DOC-004). The built-in version 1 of each billing document's template is seeded active.\n\nPermission: `doc.template.read`."
x-permission: doc.template.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
