operationId: listArchivedDocuments
tags:
  - doc
summary: "List archived documents"
description: "Archived renderings of issued documents at every branch where the caller holds `doc.document.read` for the whole branch, newest first (FR-DOC-001, FR-DOC-002, B08 continued 2b). A document is rendered after the transaction that issued it commits, through the outbox (FR-DOC-003), and archived once with the SHA-256 of its stored bytes; the archive refuses change by trigger. Filter by `businessDocumentId`, `docType`, `documentNo` and `from`/`to` on when it was archived.\n\nPermission: `doc.document.read`."
x-permission: doc.document.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: businessDocumentId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: docType
    in: query
    required: false
    schema:
      type: string
  - name: documentNo
    in: query
    required: false
    schema:
      type: string
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
