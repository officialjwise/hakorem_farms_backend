operationId: getTemplateVersion
tags:
  - doc
summary: "Get a template version with its source"
description: "One template version with its source.\n\nPermission: `doc.template.read`."
x-permission: doc.template.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
  - NOT_FOUND
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
responses:
