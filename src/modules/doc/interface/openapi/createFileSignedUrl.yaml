operationId: createFileSignedUrl
tags:
  - platform
summary: "Issue a signed URL for a private file"
description: "The link expires after five minutes. Every issue is recorded in the file access log with the user, the file and the time. Only a `CLEAN` file is linked: any other answers 422 `FILE_NOT_CLEAN`. A file someone else uploaded needs `platform.file.read.any` as well.\n\nPermission: `platform.file.read`."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - FILE_NOT_CLEAN
  - RATE_LIMITED
x-permission: platform.file.read
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - customerSession: []
  - investorSession: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/SignedUrl"
        example:
          url: "https://files.hakoremfarms.com/private/019a7a95-e5a4-769c-8bd5-729f55d9eb7d?X-Amz-Expires=300&X-Amz-Signature=3f9a"
          expiresAt: "2026-11-13T10:05:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
