operationId: recordPayment
tags:
  - pay
summary: "Record a cheque, bank transfer or store credit payment"
description: "A payment received by hand (FR-PAY-001, B09a continued 1b, 1.43.0). A **cheque** is recorded `PENDING` in cheques awaiting clearance: it posts Dr 1130 at once (`pay.PaymentCleared`, marked `awaitingClearance`), its allocations apply at once, and it needs `bankAccountId` (the bank account it is paid into) and `externalReference` (the cheque number); `clearCheque` clears it and `reversePayment` bounces it. A **bank transfer** is recorded `PENDING` with nothing posted and nothing allocated until a bank statement line matches it (B09a continued 1c); it needs `bankAccountId`. **Store credit** clears at once off the customer's balance (Dr 2210), never beyond it (422 `STORE_CREDIT_INSUFFICIENT`, held by the database), and needs `customerId`. Mobile money and card are refused with 422 `PAYMENT_METHOD_REQUIRES_VERIFICATION`: only a verified provider callback or lookup clears them (abuse case 4). Cash is refused (`TENDER_NOT_AVAILABLE`): a sale takes it into the till of an open shift (B9b), a driver on delivery (B11). An amount not allocated is held as the customer's deposit (2200). Other refusals are 422 `PAYMENT_INVALID` (`METHOD_UNKNOWN`, `METHOD_DISABLED`, `AMOUNT_NOT_POSITIVE`, `ALLOCATION_NOT_POSITIVE`, `ALLOCATIONS_EXCEED_AMOUNT`, `ALLOCATION_WHILE_PENDING`, `CUSTOMER_UNKNOWN`, `CUSTOMER_REQUIRED`, `SHIFT_NOT_AVAILABLE`, `RECEIVED_IN_FUTURE`, `BANK_ACCOUNT_REQUIRED`, `BANK_ACCOUNT_NOT_USABLE`, `BANK_ACCOUNT_NOT_FOR_METHOD`, `CHEQUE_NUMBER_REQUIRED`, `ORDER_UNKNOWN`, `ID_IN_USE`, `BRANCH_REQUIRED`, and the allocation rules of `allocatePayment`). The payment belongs to the branch of the documents it settles, or to the caller's one branch.\n\nPermission: `pay.payment.create`.\n\nThe client supplies the record id (UUIDv7). A resubmission with the same `Idempotency-Key` and body returns the first result; the same id under another key is refused (`ID_IN_USE`)."
x-permission: pay.payment.create
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
