operationId: listReconciliationBreaks
tags:
  - pay
summary: "List reconciliation breaks (the exception queue)"
description: "The exception queue, newest first (FR-PAY-017, B09a continued 1c, 1.44.0), at the branches the reader holds `pay.reconciliation.read` for; a break no branch is known for (a provider reference never ours) is held by the head office and shows its `branchId`. Every kind on the published view `pay.pub_reconciliation_break` the daily exception report reads (`RECONCILIATION_BREAK`). `WEBHOOK_UNKNOWN_ORDER` is never raised: such money is `UNMATCHED_PAYMENT`.\n\nPermission: `pay.reconciliation.read`."
x-permission: pay.reconciliation.read
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - OPEN
        - RESOLVED
  - name: kind
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
