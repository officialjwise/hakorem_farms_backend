operationId: initiateMobileMoneyCharge
tags:
  - pay
summary: "Ask a customer to approve a mobile money payment on their phone"
description: "Creates a PENDING payment with our reference first, then sends the charge through the provider port outside any transaction, with a timeout, a bounded retry with jitter and a circuit breaker: a retry reuses the reference, so the customer is never charged twice, and the same key answers the same payment without a second charge. It clears only on the provider's own answer (the signed webhook's lookup, `checkPaymentStatus` or the provider sweep), as a customer deposit (2200) to be allocated to the order's document. With the provider down the answer is 503 `PAYMENT_PROVIDER_UNAVAILABLE` and cash still works. Without `orderId`, the payment is taken at the caller's one branch; `shiftId` is refused until point of sale (B9b, `SHIFT_NOT_AVAILABLE`). The phone is used for the charge request only and stored masked (B09a continued, 1.42.0).\n\nPermission: `pay.payment.initiate`."
x-permission: pay.payment.initiate
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/MobileMoneyCharge"
      example:
        id: "019a7ae6-5f6a-7062-a59a-0ef1ec5387cf"
        amountPesewas: 50000
        payerPhone: "+233244512876"
        network: MTN
        orderId: "019a7aac-216c-721a-8753-2a7ecd11a35c"
        shiftId: "019a7a93-f6b4-7865-8d9d-8f27bac90805"
responses:
