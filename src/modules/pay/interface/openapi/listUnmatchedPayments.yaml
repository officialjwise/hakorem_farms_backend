operationId: listUnmatchedPayments
tags:
  - pay
summary: "List unverified and unidentified payments"
description: "The unmatched payment queue, detection for abuse case 4: provider payments still pending verification, and payments held with an open `UNMATCHED_PAYMENT` or `PROVIDER_AMOUNT_DIFFERS` break (money that arrived after its order stopped waiting, or for another amount than asked). Newest first (B09a continued, 1.42.0).\n\nPermission: `pay.payment.read`."
x-permission: pay.payment.read
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
