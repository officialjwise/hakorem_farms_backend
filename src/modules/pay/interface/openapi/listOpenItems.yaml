operationId: listOpenItems
tags:
  - pay
summary: "List unpaid and part-paid invoices"
description: "Issued invoices, receipts and debit notes with something outstanding at the branches the reader holds the permission for, newest first (FR-PAY-009, B09a continued 1b, 1.43.0). The amounts are what is outstanding now, from the billing document's settlement; `asOf` (a business date, default today in Africa/Accra) sets the day `daysOverdue` and `overdueOnly` count from. `totalOutstandingPesewas` covers everything the filter matches, not only the page.\n\nPermission: `pay.receivable.read`."
x-permission: pay.receivable.read
parameters:
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: overdueOnly
    in: query
    required: false
    schema:
      type: boolean
  - name: asOf
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
