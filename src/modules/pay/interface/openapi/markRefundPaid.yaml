operationId: markRefundPaid
tags:
  - pay
summary: "Record a cash refund handed over"
description: "An approved refund paid by hand (a cash or bank transfer original, a cheque paid back through a bank payout from the bank account it was paid into (1.45.0), or a provider refund that failed three times), recorded with the payout's `externalReference`, which is required (422 `REFUND_INVALID`, `REFERENCE_REQUIRED`), and a `paidAt` no later than now. Never by the refund's maker (403 `MAKER_CANNOT_CHECK`; the database refuses it too). Posts the refund once (Cr the original's tender; Cr 1100 against the cheque's bank account for a bank payout; Dr 2200 out of deposit, or Dr 1200 for a refund against a credit note) and closes its `REFUND_FAILED` break (B09a continued, 1.42.0).\n\nPermission: `pay.refund.pay`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-permission: pay.refund.pay
x-requires-step-up: true
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/RefundMarkPaid"
      example:
        paidAt: "2026-11-13T10:00:00Z"
responses:
