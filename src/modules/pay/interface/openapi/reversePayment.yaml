operationId: reversePayment
tags:
  - pay
summary: "Reverse a payment, or bounce a cheque"
description: "For a cheque the bank returned unpaid (reason `CHEQUE_DISHONOURED`, cheques only) or a payment recorded in error (`RECORDED_IN_ERROR`), and from 2.22.0 an unverified offline mobile money tender the provider never paid (`MOBILE_MONEY_NOT_RECEIVED`, A-282 (d): it becomes `FAILED` and its receipt is mirrored out of 1115 Mobile money awaiting verification back to the receivable, never touching 1110; a tender already verified is `NOT_REVERSIBLE`); all need a `note` (FR-PAY-011, FR-PAY-014, B09a continued 1b, 1.43.0). Always 202: nothing changes until a different person holding `pay.reversal.approve` approves with a fresh step-up (`PAYMENT_REVERSAL`, threshold 0, so a single Owner cannot reverse alone). Approved, every allocation of the payment is reopened, the original becomes `REVERSED` (a bounced cheque still awaiting clearance `FAILED`), a reversing payment is written `REVERSED` with `reversesPaymentId` naming the original, and the exact mirror of each entry the payment posted is posted (`pay.PaymentReversed`: its receipt, and a cleared cheque's clearing); store credit redeemed is given back. Refused with 422 `PAYMENT_REVERSAL_INVALID` (`NOT_REVERSIBLE` for a payment that posted nothing, is already reversed or is a reversing payment; `PAYMENT_HAS_REFUNDS`; `REASON_UNKNOWN`; `REASON_NOT_FOR_METHOD`; `NOTE_REQUIRED`; `REVERSAL_PENDING`). Every request is published as `pay.PaymentReversalRequested` carrying abuse case 32 for the daily exception report. **From 2.9.0 (BL-077)** a payment whose sale has a void waiting for approval (`voidOrder`) is refused with 422 `PAYMENT_REVERSAL_INVALID` and the detail `VOID_PENDING`: the void reverses the payment itself.\n\nPermission: `pay.payment.reverse`.\n\nRequires approval of kind `PAYMENT_REVERSAL`: the response is `202` with an `ApprovalPending` body whose subject is the payment, and nothing takes effect until a different user approves."
x-permission: pay.payment.reverse
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonCodeRequest"
      example:
        reasonCode: CHEQUE_DISHONOURED
        note: "Returned by Fidelity Bank: insufficient funds"
