operationId: clearCheque
tags:
  - pay
summary: "Record that a cheque has cleared"
description: "A cheque awaiting clearance cleared on the bank's confirmation (FR-PAY-011, B09a continued 1b, 1.43.0): it becomes `CLEARED` and posts Dr 1100 against the bank account it was paid into, Cr 1130 (`pay.ChequeCleared`), dated `clearedOn`, a business date from the day it was received to today. Refused with 422 `PAYMENT_REVERSAL_INVALID` (`NOT_A_CHEQUE`, `CHEQUE_NOT_PENDING`, `CLEARED_ON_OUT_OF_RANGE`, `REVERSAL_PENDING`), and `PERIOD_NOT_OPEN` when `clearedOn` is in a period that is not open. A bounced cheque is reversed with `reversePayment`.\n\nPermission: `pay.payment.clear_cheque`."
x-permission: pay.payment.clear_cheque
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ChequeClearance"
      example:
        clearedOn: "2026-11-20"
