operationId: requestRefund
tags:
  - pay
summary: "Request a refund against an original payment"
description: "Without `creditNoteId`, draws only on the payment's unallocated, unrefunded money (422 `REFUND_EXCEEDS_PAYMENT`; the database holds it too): money settling a document is first taken off with `unallocatePayment`. With `creditNoteId` (1.45.0, ADR-0066), draws on an issued credit note of the payment's customer and branch instead: never more than the credit note's amount less the refunds already asked for against it and not rejected, nor more than its document owes back (422 `REFUND_EXCEEDS_CREDIT_NOTE`; the database holds it under the credit note's lock, so two refunds of the last amount at once leave exactly one), and never more than this payment paid on the credited document (422 `REFUND_EXCEEDS_PAYMENT`); a credit note that is not issued, or is another customer's or branch's, is `REFUND_INVALID` (`CREDIT_NOTE_NOT_AVAILABLE`). Every refund a person asks for waits for a different user holding `pay.refund.approve`, with a fresh step-up (`REFUND`, threshold 0, the owner's rule of 2026-11-16), so today the answer is always `202`; a refund against a credit note is never approved by the credit note's maker either (403 `MAKER_CANNOT_CHECK`; the database refuses it too). Approved, a mobile money or card refund goes back through the provider; a refund to `STORE_CREDIT` (or of a store credit tender to its original method) is paid at once by the approver into the customer's store credit (Cr 2210; 1.43.0), refused for a payment with no customer or a customer with no phone; a cheque to its original method is a bank payout from the bank account it was paid into (1.45.0), and it and any other wait for `markRefundPaid`. Paid, a refund posts Dr 2200 (out of deposit), or Dr 1200 against the customer when it draws on a credit note, and Cr the tender. A reason that requires a note needs `note` (B09a continued, 1.42.0).\n\nPermission: `pay.refund.create` at the payment's branch.\n\nMay require approval of kind `REFUND`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves."
x-permission: pay.refund.create
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/RefundCreate"
      example:
        originalPaymentId: "019a7ae7-1904-7bb6-80ef-c43ec6793d1c"
        amountPesewas: 11600
        destination: ORIGINAL_METHOD
        reasonCode: DAMAGED_IN_DELIVERY
        creditNoteId: "019a7ae0-73ab-7bd8-9110-c653a1723f31"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Refund"
        example:
          id: "019a7ae8-ab27-7c43-917c-cd0ff47645ed"
          refundNo: RFD-2026-DDW-000041
          status: PENDING_APPROVAL
          originalPayment:
            id: "019a7ae7-1904-7bb6-80ef-c43ec6793d1c"
            paymentNo: PAY-2026-DDW-021791
            method:
              id: "019a7a92-c15e-7582-aabb-60fcf9dfd9da"
              code: MOMO
              name: "Mobile money"
              kind: MOBILE_MONEY
          amountPesewas: 11600
          currency: GHS
          destination: ORIGINAL_METHOD
          reasonCode: DAMAGED_IN_DELIVERY
          creditNote:
            id: "019a7ae0-73ab-7bd8-9110-c653a1723f31"
            docType: CREDIT_NOTE
            number: CRN-2026-DDW-000086
          isAutomatic: false
          approvalRequestId: "019a7ae8-ca16-7627-ab5f-6b476e27e425"
          providerReference: null
          paidAt: null
          failureReason: null
          branchId: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          createdAt: "2026-11-12T15:01:00Z"
          createdBy:
            id: "019a7a86-caf1-728b-b7c3-3188ea6caa66"
            displayName: "Nana Yeboah"
  "202":
    description: "Accepted for approval. Nothing has taken effect yet."
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ApprovalPending"
        example:
          status: PENDING_APPROVAL
          approvalRequestId: "019a7ae9-e07d-7f26-b45e-fb3ab5607418"
          kind: REFUND
          subject:
            id: "019a7ae9-ff6c-790a-8e42-99722f111250"
            docType: REFUND
            number: null
          summary: "Awaiting approval by a different user with the approving permission"
          requestedAt: "2026-11-13T10:12:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
