operationId: matchBankStatement
tags:
  - pay
summary: "Match statement lines to the ledger automatically"
description: "Matches every line still unmatched, automatically, by reference and amount only (FR-PAY-011, FR-PAY-016, B09a continued 1c, 1.44.0): never on amount alone, and never on a tie. Money in whose reference or narration carries the reference of exactly one bank transfer still `PENDING` into this account, at exactly its amount, clears that transfer (`pay.PaymentCleared`: Dr 1100 against the bank account, Cr 2200 against the customer, dated the value date); one carrying a settlement's reference at exactly its net links to its `pay.ProviderSettled` entry. Anything else (no candidate, the right reference at another amount, two candidates, money going out) raises a `BANK_LINE_UNMATCHED` break, once while open. The statement becomes `RECONCILED` when every line is matched, else `HAS_BREAKS`. Run again, it matches only what is new.\n\nPermission: `pay.reconciliation.manage`."
x-permission: pay.reconciliation.manage
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/BankStatement"
        example:
          id: "019a7aed-23b2-7a24-af5c-ab148b0b23f2"
          bankAccount:
            id: "019a7a92-6491-77d8-bd10-86568cccff34"
            name: "GCB current account"
            kind: BANK
            last4: "4821"
          periodStart: "2026-11-01"
          periodEnd: "2026-11-12"
          openingPesewas: 4120400
          closingPesewas: 6250300
          status: HAS_BREAKS
          lineCount: 38
          unmatchedCount: 2
          currency: GHS
          lines:
            - id: "019a7aed-42a1-7407-b93f-494c04bcc229"
              valueDate: "2026-11-12"
              direction: IN
              amountPesewas: 300000
              narration: "ROYAL PALM HOTEL LTD INV1198"
              bankReference: GCB-TRF-20261112-0119
              matchedJournalEntryId: "019a7aed-6190-7deb-8323-e7837e6d6061"
              matchStatus: MATCHED
            - id: "019a7aed-807f-77ce-9d06-85baf81efe98"
              valueDate: "2026-11-12"
              direction: OUT
              amountPesewas: 2500
              narration: "SMS ALERT CHARGES"
              bankReference: null
              matchedJournalEntryId: null
              matchStatus: UNMATCHED
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
