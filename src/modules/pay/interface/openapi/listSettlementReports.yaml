operationId: listSettlementReports
tags:
  - pay
summary: "List provider settlement reports"
description: "Provider settlement reports, newest settlement first, at the branches the reader holds `pay.reconciliation.read` for (the head office holds them; FR-PAY-016, B09a continued 1c, 1.44.0). `status` filters `IMPORTED`, `POSTED` or `HAS_BREAKS` (`MATCHED` is never set); `from` and `to` bound `settledOn`. Each report carries its lines.\n\nPermission: `pay.reconciliation.read`."
x-permission: pay.reconciliation.read
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
