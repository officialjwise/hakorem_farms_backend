operationId: receivePaymentWebhook
tags:
  - pay
summary: "Receive a payment provider webhook"
description: "Every request is logged in the rejection log (`pay.webhook_event`), with only the provider's fields this system reads. Checked in this order (security architecture section 8, the owner's order of 2026-11-16): the signature over the raw body, in constant time, before the body is parsed (a bad one gets 401 with no detail, and nothing the body says is kept, since 2.30.0); the event's own time inside the window (`pay.webhook_window_seconds`, 300: Paystack signs no separate timestamp); the event processed once by its provider reference (`<event>:<reference>`, a unique key: a second delivery is acknowledged with no effect); the reference one this system created; and only then the amount and status confirmed by a server-to-server lookup. The webhook's own amount is never trusted. Every signed event, accepted or not, is answered 200 `{ received: true }`; a payment whose lookup cannot be made now is cleared later by the provider sweep (B09a continued, 1.42.0). Since 2.30.0 (B09c): a card payment's `charge.success` is handled as any other (its card details, which Paystack's body carries, are never kept); a card paid after its payment had failed raises an URGENT `PROVIDER_PAID_AFTER_FAILURE` break, nothing posted; and `charge.dispute.create` (a chargeback), after the same checks, is looked up by its dispute id and, for a payment of ours with the same reference and amount, raises an URGENT `PROVIDER_DISPUTE_OPENED` break, nothing posted (abuse case 45); a dispute whose lookup differs is `REJECTED_AMOUNT`."
parameters:
  - name: provider
    in: path
    required: true
    schema:
      type: string
      enum:
        - PAYSTACK
  - name: X-Paystack-Signature
    in: header
    required: true
    schema:
      type: string
    description: "HMAC-SHA512 of the raw body with the provider secret."
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: true
        description: "The provider payload, verified before use."
      example:
        event: charge.success
        data:
          reference: T7731049912
          amount: 50000
          currency: GHS
          channel: mobile_money
          status: success
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/WebhookAck"
        example:
          received: true
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "404":
    $ref: "#/components/responses/NotFound"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
