operationId: allocatePayment
tags:
  - pay
summary: "Allocate a payment or deposit to invoices"
description: "A cleared payment's unallocated money applied to issued invoices, receipts or debit notes of the same customer at its branch. Allocations cannot exceed the payment's unallocated amount or any document's outstanding amount (422 `ALLOCATION_EXCEEDS_AVAILABLE`, held by the database on both sides); each posts Dr 2200 Cr 1200 (`pay.DepositAllocated`). Other refusals are `PAYMENT_INVALID` (`PAYMENT_NOT_CLEARED`, `DOCUMENT_UNKNOWN`, `DOCUMENT_NOT_PAYABLE`, `BRANCH_DIFFERS`, `CUSTOMER_DIFFERS`, `DUPLICATE_DOCUMENT`) (B09a continued, 1.42.0).\n\nPermission: `pay.payment.allocate`."
x-permission: pay.payment.allocate
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/AllocationRequest"
      example:
        allocations:
          - billingDocumentId: "019a7adf-f7ef-744a-9982-4d75baaec653"
            amountPesewas: 150000
responses:
  "200":
    description: OK
    headers:
