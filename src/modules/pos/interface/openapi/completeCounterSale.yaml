operationId: completeCounterSale
tags:
  - pos
summary: "Complete a counter sale"
description: "Prices are re-resolved on the server. In one serializable transaction, on the caller's own OPEN shift locked for the sale, it issues the stock from the till's location (a goat by tag, eggs by crate, beef by weight), issues the receipt with its gap-free number, records and allocates the tenders into the till and posts the ledger (ORD's one sale path, channel POS), or nothing at all (2.6.0, B09b continued, FR-POS-001 to FR-POS-006, A-274). The device is enrolled on the shift's till and not revoked (`X-Device-Credential`: 401 `DEVICE_CREDENTIAL_INVALID`, 403 `DEVICE_REVOKED`, 403 for another till's device). Each tender's `amountPesewas` is what it applies; the tenders sum to the total exactly. Change comes from cash only: `tenderedPesewas` on a cash tender, at least its amount, and `changeDuePesewas` is the sum of what each cash tender handed over beyond what it applies. A mobile money or card tender is refused with 422 `PAYMENT_METHOD_REQUIRES_VERIFICATION`; a tender naming `paymentId` (a payment the provider cleared) is refused with `PROVIDER_PAYMENT_NOT_AVAILABLE` until it is built (A-274), and `unverifiedMobileMoney` with `OFFLINE_TENDER_ONLY`: take the sale in cash. A price below list within the band and the cashier's per-line limit needs a reason; beyond the per-line limit, or beyond what the shift has left of the per-shift limit (`PRICE_OVERRIDE_PER_SHIFT`, less the price already given below list on the shift), the sale is refused with 422 `PRICE_OVERRIDE_NEEDS_APPROVAL` (`BEYOND_ROLE_LIMIT`, `BEYOND_SHIFT_LIMIT`, `OUTSIDE_BAND`) until a different user approves. The sale is recorded at the server's time; a till time more than 300 seconds away never refuses it and reaches the daily exception report's source (`pos.TillClockOutOfTolerance`). Refusals: 403 for another cashier's shift; 422 `SHIFT_NOT_OPEN`; 422 `COUNTER_SALE_INVALID` with `ID_NOT_UUID_V7`, `ID_DIFFERS_FROM_KEY` (the `Idempotency-Key` is the sale's id), `METHOD_UNKNOWN`, `CHANGE_ONLY_FROM_CASH`, `TENDERED_BELOW_AMOUNT`, `PROVIDER_PAYMENT_NOT_AVAILABLE`, `OFFLINE_TENDER_ONLY`; `SALE_INVALID`, `QUOTE_REQUIRED` and `PAYMENT_INVALID` as the sale path answers them. `escPosBase64` is null until the receipt prints (B09b continued 4). The example's mobile money tender shows the shape the provider path will take.\n\nPermission: `pos.sale.create`. Ownership: the cashier's own open shift.\n\nAccepted from an offline queue: the client supplies the record id (UUIDv7), and a resubmission with the same id returns the first result."
x-permission: pos.sale.create
x-owner-module: ord
