operationId: listRegisterDevices
tags:
  - pos
summary: "List devices enrolled on a register"
description: "Every device enrolled on the till, revoked ones included, newest first (2.6.0, B09b continued). The credential and its hash are never shown. `Register.deviceCount` counts the ones not revoked.\n\nPermission: `pos.device.read`."
x-permission: pos.device.read
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
