operationId: updateRegister
tags:
  - pos
summary: "Change a register"
description: "Renames a till, moves it to another location of its branch or retires it, at the version read (409 on a mismatch). A till with a shift that is not CLOSED is neither moved nor retired (422 `REGISTER_INVALID` with `SHIFT_OPEN`); a retired till opens no shift.\n\nPermission: `pos.register.manage`."
x-permission: pos.register.manage
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/RegisterUpdate"
      example:
        version: 2
        status: RETIRED
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Register"
        example:
          id: "019a7a94-15a3-7248-9781-2d5f347aa63d"
          branch:
            id: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
            code: DDW
            name: "HaKorem Farms, Dodowa"
          location:
            id: "019a7a84-7f34-76a9-8be1-736ae249ec48"
            code: SHOP
            name: "Shop floor"
            kind: SHOP_FLOOR
          code: T1
          name: "Shop till 1"
          status: ACTIVE
          openShift:
            id: "019a7a93-f6b4-7865-8d9d-8f27bac90805"
            cashier:
              id: "019a7a86-ac02-78a8-ade0-935170bb0c2f"
              displayName: "Adwoa Darko"
            openedAt: "2026-11-13T06:55:00Z"
          deviceCount: 1
          version: 2
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
