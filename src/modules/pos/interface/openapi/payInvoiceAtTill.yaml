operationId: payInvoiceAtTill
tags:
  - pos
summary: "Take a customer's cash for an invoice at the till"
description: "A customer pays an issued invoice in cash at the till (2.26.0, the owner on A-212 (a): cash enters only through a till shift; ADR-0077, A-285 (g)). Taken by the cashier onto their **own open shift** from an enrolled device of that till (`X-Device-Credential`), recorded as a cleared cash payment into the till, allocated to the invoice (Dr 1000 the till, Cr 1200 the customer), and **counted at the shift's close** as any cash the shift took: it raises the shift's expected cash by exactly the amount. **A guest's receipt of a sales order is paid the same way** (2.36.0, B11 continued 7, LOUD: a collection guest pays what is left at the till; A-338 (a), A-366 (d)): only an `ISSUED` `RECEIPT` that bills an order and has something outstanding; any other receipt, and every other kind, is still `NOT_AN_INVOICE`. Part payment is allowed; never beyond what is outstanding; what was handed over beyond the amount is change. Cash only: mobile money and card for an invoice go through the provider. **Cash outside an open shift is refused:** a closing, closed or force-closed shift answers 422 `SHIFT_NOT_OPEN` with nothing recorded, another cashier's shift 403, and PAY's `recordPayment` still refuses cash (`TENDER_NOT_AVAILABLE`) with or without a shift. Refusals: 422 `TILL_INVOICE_PAYMENT_INVALID` with `AMOUNT_NOT_POSITIVE`, `NOT_AN_INVOICE`, `INVOICE_NOT_ISSUED`, `INVOICE_OTHER_BRANCH`, `INVOICE_SETTLED`, `AMOUNT_EXCEEDS_OUTSTANDING` or `TENDERED_BELOW_AMOUNT`; 404 for a shift or document the caller cannot see; 401 `DEVICE_CREDENTIAL_INVALID`, 403 `DEVICE_REVOKED`. Audited.\n\nPermission: `pos.sale.create`."
x-permission: pos.sale.create
x-error-codes:
  - TILL_INVOICE_PAYMENT_INVALID
  - SHIFT_NOT_OPEN
  - DEVICE_CREDENTIAL_INVALID
  - DEVICE_REVOKED
parameters:
  - name: id
    in: path
    required: true
    description: "The cashier's own open shift."
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
    deviceCredential: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/TillInvoicePaymentCreate"
      example:
        billingDocumentId: "019a7b52-6c10-7e3a-9d41-2f8b0c6a1e55"
        amountPesewas: 20001
        tenderedPesewas: 50000
responses:
  "201":
    description: Created
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/TillInvoicePayment"
        example:
          paymentId: "019a7c2f-0a91-7b44-8e2d-6f3a1c9b0d12"
          shiftId: "019a7c0a-5e12-7f80-a1b3-4c2d9e8f7a61"
          billingDocument:
            id: "019a7b52-6c10-7e3a-9d41-2f8b0c6a1e55"
            documentNo: "INV-2026-DDW-000014"
          amountPesewas: 20001
          tenderedPesewas: 50000
          changeDuePesewas: 29999
          outstandingPesewas: 22559
          currency: GHS
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
