operationId: approveShiftClose
tags:
  - pos
summary: "Sign off a shift close and post over or short"
description: "A supervisor who is not the cashier (422 `SHIFT_CLOSE_SAME_PERSON`, held again by the database) signs off a CLOSING shift (422 `SHIFT_INVALID` with `SHIFT_NOT_CLOSING` otherwise), with a reason. Expected cash is the float plus the shift's cash payments less their refunds, plus pay-ins, less drops and pay-outs; each declared method's expected figure and variance is frozen. ◆ `pos.ShiftClosed` posts the count: Cr 1000 the expected cash against the register, Dr 1010 what was counted, Dr 6900 when short, Cr 6900 when over, so the till's account returns to zero. The Z report is stored. The event names the cashier, the supervisor and the over or short for the daily exception report (abuse case 17). The audit chain is anchored by the worker's daily anchor; an anchor at each sign-off follows in B09b continued.\n\nPermission: `pos.shift.close.approve`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-permission: pos.shift.close.approve
x-requires-step-up: true
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Counted with Nana; short GHS 120.00 noted"
responses:
