operationId: createRegister
tags:
  - pos
summary: "Create a register"
description: "A till selling from a live, physical location of its branch (422 `REGISTER_INVALID` with `LOCATION_NOT_IN_BRANCH` or `LOCATION_NOT_SELLABLE`), with a code of one to four capitals or digits unique among the branch's tills (`REGISTER_CODE_TAKEN`). `deviceCount` counts the till's devices not revoked (2.6.0); a new till has none.\n\nPermission: `pos.register.manage`."
x-permission: pos.register.manage
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/RegisterCreate"
      example:
        branchId: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
        locationId: "019a7a84-7f34-76a9-8be1-736ae249ec48"
        code: T3
        name: "Shop till 3"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Register"
        example:
          id: "019a7a94-15a3-7248-9781-2d5f347aa63d"
          branch:
            id: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
            code: DDW
            name: "HaKorem Farms, Dodowa"
          location:
            id: "019a7a84-7f34-76a9-8be1-736ae249ec48"
            code: SHOP
            name: "Shop floor"
            kind: SHOP_FLOOR
          code: T1
          name: "Shop till 1"
          status: ACTIVE
          openShift:
            id: "019a7a93-f6b4-7865-8d9d-8f27bac90805"
            cashier:
              id: "019a7a86-ac02-78a8-ade0-935170bb0c2f"
              displayName: "Adwoa Darko"
            openedAt: "2026-11-13T06:55:00Z"
          deviceCount: 0
          version: 2
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
