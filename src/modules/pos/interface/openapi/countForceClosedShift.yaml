operationId: countForceClosedShift
tags:
  - pos
summary: "Count the drawer of a force-closed shift and post its over or short"
description: "A supervisor who is neither the shift's cashier nor the manager who force-closed it (422 `SHIFT_CLOSE_SAME_PERSON` with `COUNTER_IS_CASHIER` or `COUNTER_IS_FORCE_CLOSER`, held again by the database) counts the drawer of a force-closed shift once (422 `SHIFT_INVALID` with `SHIFT_NOT_FORCE_CLOSED` or `SHIFT_ALREADY_COUNTED`), with a reason (FR-POS-020). The over or short is the cash counted less the cash the shift was closed at. ◆ `pos.ShiftClosed`, marked `forceClosed`, posts it as a sign-off does: Cr 1000 the cash it was closed at against the register, Dr 1010 what was counted, Dr 6900 when short, Cr 6900 when over, so the till's account returns to zero; the event names the cashier, the manager who force-closed it, the counter and the over or short for the daily exception report (abuse case 17). The Z report is stored and the worker anchors the audit chain once the count is sealed into it.\n\nPermission: `pos.shift.close.approve`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-permission: pos.shift.close.approve
x-requires-step-up: true
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ForceClosedShiftCount"
      example:
        declaredCashPesewas: 124500
        reason: "Counted the drawer with Kwabena the next morning"
