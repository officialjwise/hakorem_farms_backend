operationId: handInDriverCash
tags:
  - pos
summary: "Count a driver's cash on delivery into the till"
description: "A driver hands in the cash collected on delivery at a till shift (2.31.0, B11 continued 2; CR-057; the owner, 2026-11-23: handed in once at a till shift, never typed in as loose cash; ADR-0077, ADR-0092). Taken by the cashier onto their **own open shift** from an enrolled device of that till (`X-Device-Credential`), judged by the same shift check as `payInvoiceAtTill`. **Every collection the driver still holds at the shift's branch is handed in, exactly once**: what was expected is their sum; `declaredPesewas` is what the cashier counted, which goes into the till as a cleared cash payment naming the driver (`tillPaymentId`, method `COD`; it settles no document, the collections already did) and is **counted at the shift's close** as any cash the shift took. A count short of what was expected is **short** on the driver variance report (`varianceDirection` `SHORT`), never loose cash; over is `OVER`. Posts Dr 1000 the till for what was counted, Cr 1020 the driver for what was expected, the difference to 6900. The cashier is never the driver. Answers the `DriverCashReconciliation`, `POSTED`. **Refusals:** a closing, closed or force-closed shift 422 `SHIFT_NOT_OPEN` with nothing recorded, another cashier's shift 403; 422 `DRIVER_CASH_INVALID` with `NOTHING_HELD` (the driver holds no cash at the branch, or it was already handed in) or `RECEIVER_IS_DRIVER`; 404 for a shift the caller cannot see; 401 `DEVICE_CREDENTIAL_INVALID`, 403 `DEVICE_REVOKED`. The same key answers the first hand-in. Audited.\n\nPermission: `pos.sale.create`."
x-permission: pos.sale.create
x-error-codes:
  - DRIVER_CASH_INVALID
  - SHIFT_NOT_OPEN
  - DEVICE_CREDENTIAL_INVALID
  - DEVICE_REVOKED
parameters:
  - name: id
    in: path
    required: true
    description: "The cashier's own open shift."
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
    deviceCredential: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/DriverCashHandInCreate"
      example:
        driverId: "019a7a87-46ad-7a19-bf51-aa66d1302344"
        declaredPesewas: 144000
        note: "Driver says the chop bar paid GHS 140.00"
