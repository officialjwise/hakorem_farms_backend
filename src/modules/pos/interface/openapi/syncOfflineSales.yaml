operationId: syncOfflineSales
tags:
  - pos
summary: "Sync sales and cash movements queued while offline"
description: "The sales a till queued while it had no network (2.13.0, 2.15.0, FR-POS-011 to FR-POS-014, ADR-0027, OFFLINE_SYNC 6 to 9, B09b continued 2b), applied exactly once each by its client UUIDv7, in ascending `deviceCounter` whatever order they arrive in, each in its own transaction, so a failure never loses the rest of the batch and re-sending a whole batch is always safe. The batch takes no `Idempotency-Key`: a sale already applied answers `DUPLICATE` with its first result and consumes no number. **Who:** the shift's cashier holding `pos.sale.create` at the till's branch and location, or a holder of `pos.shift.force_close` at the branch recovering the till (with a fresh step-up), from an enrolled device of the shift's till that is not revoked (`X-Device-Credential`: 401 `DEVICE_CREDENTIAL_INVALID`, 403 `DEVICE_REVOKED`, 403 for another till's device or a `deviceId` other than the credential's). A shift that names nothing is 404. More than 500 sales is 400 `SYNC_BATCH_TOO_LARGE` and applies nothing. Each sale is attributed to the shift's cashier, never to the session that synced it. **Refused only for integrity** (`REJECTED_INTEGRITY`, nothing recorded, `orderId`, `orderNo`, `receiptNo` and `grossPesewas` null, one exception `SYNC_REJECTED`): an id that is not a UUIDv7; content that does not match `payloadHash` (SHA-256 over the sale less its hash in RFC 8785 canonical JSON, OFFLINE_SYNC 4.4); an id applied before with other content; a device counter of the shift that belongs to another applied sale; a sale the catalogue cannot read (an unknown product or payment method, a unit with no conversion, a line the till's own rules forbid). **Everything else is recorded** (`APPLIED`, or `APPLIED_WITH_EXCEPTION` with each exception named), never refused: the order (`isOffline`, placed and completed at `occurredAt`), its receipt with the official number allocated here, issued at `occurredAt` and dated that day, or the first open date when its period has since locked, marked `syncedFromOffline` with the `provisionalRef` the till printed, and its cash. Each line's stock moves as `SALE_ISSUE_OFFLINE`: countable and lot stock may go below zero (`NEGATIVE_STOCK`); an animal sold elsewhere (`SERIAL_CONFLICT`), under a hold or past its expiry (`HOLD_CONFLICT`) or reserved (`RESERVATION_CONFLICT`) is recorded with no movement and a stock exception in its place. Each line is re-priced in its own unit (`uom`, absent the first unit the product is sold by, CR-038) as of `occurredAt`; the price the till charged always posts, and the server's price is worked out only to compare (2.17.0, the owner on 2026-11-18): every difference is raised to the daily exception report's source as `PRICE_OVERRIDE` and no approval is asked for after the fact (A-278 (h) as amended), for review within the cashier's own override limit (the source only, not told to the till) and URGENT beyond it or out of the band (told to the till); a price beyond the limit stands on the rules only with `overrideApproval`, a supervisor's PIN on the till verified at sync and a variance within that supervisor's own line limit, and anything else is outside the rules; a line no list prices now is `NOT_PRICED_AT_SYNC`; a unit the product is not sold by is `UNIT_NOT_SOLD`. Only cash is taken, and only onto its own shift while it is open, with one exception (2.15.0, B09b continued 2c): while `pos.offline.allow_unverified_mobile_money` is on for the branch, a mobile money tender carrying `unverifiedMobileMoney` is recorded as an `UNVERIFIED` payment, PENDING, on its own open shift, allocated to the receipt and held in the farm's mobile money wallet, with an `UNVERIFIED_PAYMENT` reconciliation break (REVIEW; URGENT when the pack did not offer the method or the approver the till names is no supervisor at the branch) that becomes urgent after `pay.unverified_window_days` unmatched; the sale's result names no exception for it, the break is the record. Any other tender (`UNMATCHED_PAYMENT`, URGENT), or cash for a shift that is closing, closed or force-closed (`OFFLINE_CASH_NOT_TAKEN`, ADR-0077), is not recorded and the receipt stays outstanding. A sale on a closed shift is `OFFLINE_LATE_POSTING`; a sale whose period has locked is flagged on the report but not to the till. A till clock more than `sync.clock_tolerance_seconds` (300) ahead of the server or before the shift opened is `TILL_CLOCK_OUT_OF_TOLERANCE`; a sale older than `sync.max_sale_age_hours` (8) is `OFFLINE_SALE_TOO_OLD`; a cashier whose grant was revoked while offline is `AUTHORISATION_FAILURE`; tenders that do not sum to the receipt are `TENDERS_DIFFER`; a printed reference other than the shift and counter make is `PROVISIONAL_REF_MISMATCH`. Every exception reaches the daily exception report's source. `grossPesewas` is the total the server recorded, for the till to compare with its own (CR-031). `counterGaps` lists every device counter of the shift missing below the highest received, on every sync until it arrives; each newly missing value is raised once (`DEVICE_COUNTER_GAP`). `cashMovementResults` (2.15.0, B09b continued 2c): one answer per movement in the batch, applied after its sales in the till's order, each in its own transaction and decided once by its client id. `APPLIED`: recorded on the batch's own shift at the till's `occurredAt` though hours old (a till time more than the tolerance ahead of the server is recorded at the server's time, one before the shift opened at the shift's opening, each flagged), attributed to the shift's cashier, by the rules `recordCashMovement` holds; a drop with no `witnessId` is recorded unwitnessed and marked, since the till cannot know who was signed in (a witness's PIN is B09b continued 3's). `DUPLICATE`: applied before, by a sync or online, with the same content. `REJECTED` with its reason, recorded nowhere and raised for the daily exception report: `SHIFT_NOT_OPEN` (the shift is closing, closed or force-closed: never onto another shift, ADR-0077), `ID_REUSED_WITH_OTHER_CONTENT`, `ID_NOT_UUID_V7`, or the rule of `recordCashMovement` it breaks (`TILL_OVERDRAWN`, `REASON_REQUIRED`, `REASON_NOT_FOR_KIND`, `NOTE_REQUIRED`, `WITNESS_IS_MAKER`, `WITNESS_NOT_SUPERVISOR`, `WITNESS_ONLY_ON_DROP`, `AMOUNT_NOT_POSITIVE`); a movement refused once is answered with the same reason on every later sync and is never applied afterwards. See docs/OFFLINE_SYNC.md.\n\nPermission: `pos.sale.create`."
x-permission: pos.sale.create
parameters:
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
    deviceCredential: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/OfflineSyncBatch"
      example:
        deviceId: "019a7af9-390e-76fe-ac37-78c0142ff19d"
        shiftId: "019a7af1-da1b-7bcb-9103-c58815023e65"
        sales:
          - id: "019a7afc-7c43-71fc-9734-2899e9daa177"
            deviceCounter: 41
            provisionalRef: P-T2-311-0041
            occurredAt: "2026-11-13T09:40:12Z"
            lines:
              - productId: "019a7a8e-a5a0-754c-8a85-5d9ed05dd67c"
                quantity: "2.000"
                uom: CRATE
                agreedUnitPricePesewas: 6000
            tenders:
              - paymentMethodId: "019a7a92-a26f-7b9f-90d7-c2c5802e3ba3"
                amountPesewas: 12000
                tenderedPesewas: 15000
            payloadHash: "3b1f0c2a7e4d9b8f6a5c1e0d2f4b7a9c8e6d5f3a1b0c9e8d7f6a5b4c3d2e1f0a"
          - id: "019a7afd-1b20-7c4e-8a31-5f2d9e0c6b18"
            deviceCounter: 42
            provisionalRef: P-T2-311-0042
            occurredAt: "2026-11-13T09:52:40Z"
            lines:
              - productId: "019a7a8e-a5a0-754c-8a85-5d9ed05dd67c"
                quantity: "3.000"
                uom: EGG
                agreedUnitPricePesewas: 220
            tenders:
              - paymentMethodId: "019a7a92-a26f-7b9f-90d7-c2c5802e3ba3"
                amountPesewas: 660
                tenderedPesewas: 1000
            payloadHash: "9f1c2a7e4b0d83f65c2e1a9d7b3f0c4e8a6d2b1f5e9c7a3d0b4f8e2c6a1d5b9f"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/OfflineSyncResult"
        example:
          shiftId: "019a7af1-da1b-7bcb-9103-c58815023e65"
          results:
            - clientSaleId: "019a7afc-7c43-71fc-9734-2899e9daa177"
              deviceCounter: 41
              outcome: APPLIED_WITH_EXCEPTION
              orderId: "019a7afc-7c43-71fc-9734-2899e9daa177"
              orderNo: SO-2026-DDW-004207
              receiptNo: RCP-2026-DDW-T2-006101
              grossPesewas: 12000
              currency: GHS
              exceptions:
                - kind: NEGATIVE_STOCK
                  summary: "Line 1: stock at the till went below zero by 15.000 after this sale"
            - clientSaleId: "019a7afd-1b20-7c4e-8a31-5f2d9e0c6b18"
              deviceCounter: 42
              outcome: APPLIED
              orderId: "019a7afd-1b20-7c4e-8a31-5f2d9e0c6b18"
              orderNo: SO-2026-DDW-004208
              receiptNo: RCP-2026-DDW-T2-006102
              grossPesewas: 660
              currency: GHS
              exceptions: []
          cashMovementResults: []
          counterGaps: [40]
          serverTime: "2026-11-13T13:42:07Z"
