operationId: openShift
tags:
  - pos
summary: "Open a shift with an opening float"
description: "Opens a shift on an ACTIVE register for the signed-in cashier, with the opening float moved from the safe to the till (◆ `pos.ShiftOpened`: Dr 1000 against the register, Cr 1010; nothing posts for a float of 0). One shift that is not CLOSED per register and per cashier, enforced by the database: 422 `SHIFT_ALREADY_OPEN` with `REGISTER_HAS_OPEN_SHIFT` or `CASHIER_HAS_OPEN_SHIFT`. The id is the client's UUIDv7 and the `Idempotency-Key` carries the same value; a resubmission returns the first result. The shift is numbered `SHF-<year>-<branch>-<n>` and takes the register's next `shiftSeq`. Refusals: 422 `SHIFT_INVALID` with `ID_NOT_UUID_V7`, `REGISTER_RETIRED` or `OPENED_AT_OUT_OF_WINDOW`. **Online** (no `X-Device-Credential`): `openedAt` must be within `sync.clock_tolerance_seconds` (300) of the server's clock, and the shift opens at the server's time (ADR-0067). **From the till's queue** (2.14.0, OFFLINE_SYNC 10, B09b continued 2c): sent with the credential of an enrolled, unrevoked device of the register (401 `DEVICE_CREDENTIAL_INVALID`, 403 `DEVICE_REVOKED`, 403 for another till's device), a shift the till opened offline is applied once by its id and opens at the till's `openedAt` though hours old, its float posted then; a till time within the tolerance is an online open at the server's time; one more than the tolerance ahead of the server, or before the register's previous shift closed by more than it, opens at the server's time and is flagged `TILL_CLOCK_OUT_OF_TOLERANCE`, never refused; one older than `sync.max_sale_age_hours` is flagged `OFFLINE_SHIFT_TOO_OLD`. `shiftSeq`, optional, is the sequence the till printed in its references, taken from its last pack's `nextShiftSeq`: the server's sequence stands and a different one is flagged `SHIFT_SEQ_DIFFERS`. A second shift opened offline on a register that already has one is refused as any other (422 `SHIFT_ALREADY_OPEN` `REGISTER_HAS_OPEN_SHIFT`; OFFLINE_SYNC 10 wrote 409, the contract has said 422 since 2.5.0) and raised URGENT for the manager who closes one. Every finding reaches the daily exception report's source (`pos.OfflineShiftFlagged`).\n\nPermission: `pos.shift.open`, at the register's branch and location."
x-permission: pos.shift.open
