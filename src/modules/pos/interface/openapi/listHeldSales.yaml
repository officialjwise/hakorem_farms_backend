operationId: listHeldSales
tags:
  - pos
summary: "List held sales on a register"
description: "The sales still held on the till's open shift, newest first (FR-POS-007, 2.10.0): never one recalled, lapsed with its shift or past `expiresAt`. Each carries `heldTotalPesewas`; `pricing` is null here (recall one to see it re-priced). Read at the till's branch and location.\n\nPermission: `pos.sale.create`."
x-permission: pos.sale.create
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
