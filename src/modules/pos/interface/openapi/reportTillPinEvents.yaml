          $ref: "#/components/schemas/TillPinReportResult"
        example:
          eventResults:
            - id: "019a7b3e-1a00-7c01-8a11-0b2c3d4e5f60"
              outcome: APPLIED
              reason: null
            - id: "019a7b3e-2b00-7c02-8a12-1c2d3e4f5a61"
              outcome: APPLIED
              reason: null
          signOutResults:
            - id: "019a7b3e-2c00-7c03-8a13-2d3e4f5a6b72"
              outcome: APPLIED
              reason: null
