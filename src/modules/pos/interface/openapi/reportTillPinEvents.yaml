  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/TillPinReport"
      example:
        events:
          - id: "019a7b3e-1a00-7c01-8a11-0b2c3d4e5f60"
            principalId: "019a7a86-ac02-78a8-ade0-935170bb0c2f"
            pinVersion: 2
            outcome: FAILED
            purpose: UNLOCK
            occurredAt: "2026-11-13T09:40:12Z"
          - id: "019a7b3e-2b00-7c02-8a12-1c2d3e4f5a61"
            principalId: "019a7a86-4f35-7afd-b035-b8ab03a83188"
            pinVersion: 1
            outcome: SUCCEEDED
            purpose: SIGN_OUT
            occurredAt: "2026-11-13T09:46:30Z"
        signOuts:
          - id: "019a7b3e-2c00-7c03-8a13-2d3e4f5a6b72"
            cashierId: "019a7a86-ac02-78a8-ade0-935170bb0c2f"
            shiftId: "019a7a93-f6b4-7865-8d9d-8f27bac90805"
            supervisorId: "019a7a86-4f35-7afd-b035-b8ab03a83188"
            supervisorPinVersion: 1
            occurredAt: "2026-11-13T09:46:31Z"
