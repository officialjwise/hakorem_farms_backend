operationId: forceCloseShift
tags:
  - pos
summary: "Force-close a shift whose till was abandoned"
description: "A manager who is not the shift's cashier (422 `SHIFT_CLOSE_SAME_PERSON` with `FORCE_CLOSER_IS_CASHIER`, held again by the database) closes an OPEN shift (422 `SHIFT_NOT_OPEN` for a CLOSING or CLOSED one: a declared count is signed off instead) with a reason (FR-POS-020). The shift becomes CLOSED, `forceClosed`, at the cash its records say the drawer holds: the float plus its cash payments less their refunds, plus pay-ins, less drops and pay-outs. Nothing is declared and nothing posts, because nobody has counted the drawer; `expectedCashPesewas` stays null for every reader until it is counted (`countForceClosedShift`), as a blind close's does. From now on no cash moves into or out of the till through this shift on any path (ADR-0077). `pos.ShiftForceClosed` names the cashier, the manager, the reason and the cash it was closed at for the daily exception report (abuse case 17). Sales and cash movements still queued on a device sync later onto this shift, their cash recorded on it as late entries, each with its post-close adjustment of the over or short, never onto another shift (2.18.0, the owner on 2026-11-18, ADR-0077 Amendments).\n\nPermission: `pos.shift.force_close`.\n\nRequires step-up: a TOTP code entered within the last five minutes on this session."
x-permission: pos.shift.force_close
x-requires-step-up: true
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
