operationId: listTaxCategories
tags:
  - tax
summary: "List tax categories"
description: "Permission: `mdm.tax.read`."
x-permission: mdm.tax.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/TaxCategoryPage"
        examples:
          default:
            value:
              data:
                - id: "019a7a8a-6af3-7b33-906b-bc092d2a34e7"
                  code: LIVE_ANIMALS
                  name: "Live Animals"
                  productCount: 3
                  version: 1
                - id: "019a7a8a-89e2-7516-aa4f-5a40a6dbd31e"
                  code: RAW_PRODUCE
                  name: "Raw Produce"
                  productCount: 3
                  version: 1
                - id: "019a7a8a-a8d1-7efa-b432-f878208c7156"
                  code: EGGS
                  name: Eggs
                  productCount: 2
                  version: 1
                - id: "019a7a8a-c7c0-78dd-8e16-96af9a3d0f8d"
                  code: PROCESSED_MEAT
                  name: "Processed Meat"
                  productCount: 6
                  version: 1
                - id: "019a7a8a-e6af-72c1-97f9-34e713eeadc4"
                  code: FARM_INPUTS
                  name: "Farm Inputs"
                  productCount: 2
                  version: 1
                - id: "019a7a8b-059e-7ca4-a1dd-d31e8d9f4bfc"
                  code: DELIVERY_SERVICE
                  name: "Delivery Service"
                  productCount: 1
                  version: 1
                - id: "019a7a8b-248d-7688-bbc0-71560750ea33"
                  code: OTHER_GOODS
                  name: "Other Goods"
                  productCount: 0
                  version: 1
              page:
                nextCursor: null
                limit: 25
                hasMore: false
          empty:
            summary: "Nothing matches: no rows and no next page"
            value:
              data: []
              page:
                nextCursor: null
                limit: 25
                hasMore: false
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
