operationId: archiveLocation
tags:
  - mdm
summary: "Archive a stock location"
description: "Soft delete with a reason. Refused with 422 `RECORD_IN_USE` (`HAS_LIVE_CHILDREN`) while live locations sit below it, and with `LOCATION_INVALID` (`VIRTUAL_LOCATION_FIXED`) for a virtual location. Refusing a location that holds stock arrives with inventory (B5).\n\nPermission: `mdm.location.archive`."
x-permission: mdm.location.archive
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - RECORD_IN_USE
  - LOCATION_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ArchiveRequest"
      example:
        version: 3
        reason: "No longer used"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Location"
        example:
          id: "019a7a83-68cd-7daa-b2e2-e3779b105c55"
          branch:
            id: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
            code: DDW
            name: "HaKorem Farms, Dodowa"
          parentId: null
          code: DDW-SITE
          name: "Dodowa farm"
          kind: SITE
          isVirtual: false
          isSellable: false
          allowsNegative: false
          tempClass: null
          tempMinC: null
          tempMaxC: null
          capacityHead: null
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
