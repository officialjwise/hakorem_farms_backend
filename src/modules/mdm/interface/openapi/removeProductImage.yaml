operationId: removeProductImage
tags:
  - mdm
summary: "Remove a photograph from a product"
description: "Takes the photograph out of the gallery: a soft delete with the actor and a reason, audited. The file and its public variants stay in the file store. Publishes `mdm.ProductChanged` with `images` changed.\n\nPermission: `mdm.product.update`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
x-permission: mdm.product.update
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: imageId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "204":
    description: "Done. No content."
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
