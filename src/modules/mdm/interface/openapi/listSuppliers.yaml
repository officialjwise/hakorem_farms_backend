operationId: listSuppliers
tags:
  - mdm
summary: "List suppliers"
description: "Live suppliers in creation order. `q` finds a supplier by its public ID (`sup_…`, typed any way, 2.0.0, ADR-0073), by phone, typed any way a customer's phone may be, or by part of its name. `hasProfile` is false until procurement holds the supplier's commercial terms (B7).\n\nPermission: `mdm.supplier.read`."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
x-permission: mdm.supplier.read
parameters:
  - name: q
    in: query
    required: false
    schema:
      type: string
  - name: categoryId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
