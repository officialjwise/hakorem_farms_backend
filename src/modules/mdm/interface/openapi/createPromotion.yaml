operationId: createPromotion
tags:
  - pricing
summary: "Create a promotion"
description: "The promotion is created as a `DRAFT`. A line promotion (`PERCENT_OFF` or `AMOUNT_OFF` on `LINE`) needs at least one target, each naming one product or one category; a category covers the categories below it. `FREE_DELIVERY` applies to the whole order. Refused with 422 `PROMOTION_INVALID` when a value does not fit the kind, the window ends before it starts, or a target is malformed.\n\nPermission: `mdm.promotion.create`."
x-permission: mdm.promotion.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - DUPLICATE_VALUE
  - REFERENCE_NOT_FOUND
  - PROMOTION_INVALID
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PromotionCreate"
      example:
        code: NEWYEAR-EGGS
        name: "New year egg offer"
        kind: PERCENT_OFF
        percentOff: "8.00"
        appliesTo: LINE
        channel: ONLINE
        validFrom: "2027-01-01T00:00:00Z"
        validTo: "2027-01-15T23:59:00Z"
        targets:
          - productId: "019a7a8d-ae28-7631-8b69-6be302d5e4c0"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Promotion"
        example:
          id: "019a7aa7-4c14-7690-8bc8-71d3c969eab1"
          code: XMAS-CHICKEN
          name: "Christmas chicken 5% off"
          kind: PERCENT_OFF
          percentOff: "5.00"
          amountOffPesewas: null
          bundlePricePesewas: null
          appliesTo: LINE
          channel: ONLINE
          minOrderPesewas: null
          stackGroup: PRICE
          isExclusive: false
          requiresCoupon: false
          maxRedemptions: null
          redemptions: 44
          validFrom: "2026-11-01T00:00:00Z"
          validTo: "2026-12-31T23:59:00Z"
          status: ACTIVE
          approvalRequestId: null
          targets:
            - product:
                id: "019a7a8d-ec06-79f8-af30-a851f637212f"
                sku: MEAT-0001
                name: "Full chicken, 15 kg pack"
              category: null
              bundleQty: null
          currency: GHS
          version: 1
          createdAt: "2026-11-01T09:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
