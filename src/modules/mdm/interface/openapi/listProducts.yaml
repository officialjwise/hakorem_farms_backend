operationId: listProducts
tags:
  - mdm
summary: "List products"
description: "Permission: `mdm.product.read`."
x-permission: mdm.product.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: q
    in: query
    required: false
    schema:
      type: string
  - name: categoryId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: stockPolicy
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/StockPolicy"
  - name: onlineMode
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/OnlineMode"
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - DISCONTINUED
  - name: barcode
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
