operationId: getBranch
tags:
  - mdm
summary: "Get a branch"
description: "Scoped to the caller's grants: a branch where the caller holds `mdm.branch.read` neither for the branch nor for one of its locations is 403.\n\nPermission: `mdm.branch.read`."
x-permission: mdm.branch.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Branch"
        example:
          id: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          code: DDW
          name: "HaKorem Farms, Dodowa"
          address: "Off Dodowa–Afienya Road, Dodowa"
          phone: "+233302900111"
          isTest: false
          status: ACTIVE
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
