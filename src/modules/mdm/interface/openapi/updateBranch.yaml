operationId: updateBranch
tags:
  - mdm
summary: "Update a branch"
description: "Send the `version` you read; a stale version is refused with 409. Scoped to the branch: a grant at another branch does not reach it. Closing (deactivating) a branch sets `status` to `CLOSED`; it is refused with 422 `BRANCH_INVALID` for the farm's own branch, the last open trading branch, a branch where stock stands and a branch an open document names, every reason listed in `details` (ADR-0051). Reopening sets `ACTIVE` again and is always allowed. A closed branch keeps its locations, stock history and grants.\n\nPermission: `mdm.branch.update`."
x-permission: mdm.branch.update
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - BRANCH_INVALID
  - VERSION_CONFLICT
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/BranchUpdate"
      example:
        version: 3
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Branch"
        example:
          id: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          code: DDW
          name: "HaKorem Farms, Dodowa"
          address: "Off Dodowa–Afienya Road, Dodowa"
          phone: "+233302900111"
          isTest: false
          status: ACTIVE
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    description: "Closing the branch is refused (`BRANCH_INVALID`), each reason named in `details[].code`: `FARM_BRANCH` (the farm's own branch, the first one, never closes), `LAST_ACTIVE_BRANCH` (no other open trading branch would be left; the smoke-test branch does not count), `HOLDS_STOCK` (stock stands at one of its locations, in transit included) and `OPEN_DOCUMENTS` (a draft goods receipt, a transfer not yet received, an adjustment, reversal or stock take not yet decided, or an open stock exception names it). Any other refusal uses the usual codes."
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Error"
        examples:
          farmBranch:
            summary: "Closing Dodowa, the farm's own branch, with goats in its pens"
            value:
              error:
                code: BRANCH_INVALID
                message: "This branch cannot be closed."
                correlationId: "019a7b20-1c4e-7a10-9f3e-2b6d8c1a0e11"
                details:
                  - field: /status
                    code: FARM_BRANCH
                    message: "The farm's own branch, the last open branch, and a branch with stock or open documents stay open."
                  - field: /status
                    code: HOLDS_STOCK
                    message: "The farm's own branch, the last open branch, and a branch with stock or open documents stay open."
          lastActiveBranch:
            summary: "Closing the only open trading branch"
            value:
              error:
                code: BRANCH_INVALID
                message: "This branch cannot be closed."
                correlationId: "019a7b20-1c4e-7a10-9f3e-2b6d8c1a0e12"
                details:
                  - field: /status
                    code: LAST_ACTIVE_BRANCH
                    message: "The farm's own branch, the last open branch, and a branch with stock or open documents stay open."
          holdsStock:
            summary: "Closing Kasoa while 12 crates of eggs stand on its shop floor"
            value:
              error:
                code: BRANCH_INVALID
                message: "This branch cannot be closed."
                correlationId: "019a7b20-1c4e-7a10-9f3e-2b6d8c1a0e13"
                details:
                  - field: /status
                    code: HOLDS_STOCK
                    message: "The farm's own branch, the last open branch, and a branch with stock or open documents stay open."
          openDocuments:
            summary: "Closing Kasoa while a goods receipt is still a draft"
            value:
              error:
                code: BRANCH_INVALID
                message: "This branch cannot be closed."
                correlationId: "019a7b20-1c4e-7a10-9f3e-2b6d8c1a0e14"
                details:
                  - field: /status
                    code: OPEN_DOCUMENTS
                    message: "The farm's own branch, the last open branch, and a branch with stock or open documents stay open."
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
