operationId: createCategory
tags:
  - mdm
summary: "Create a product category"
description: "Codes are unique among live categories, and names among a category's siblings (422 `DUPLICATE_VALUE`). `skuPrefix` (two to five capital letters, 2.0.0) starts the SKUs the server gives the category's products (`SEA-0001`, ADR-0072); without one it is the first three letters of `code`, or `CAT` when the code has fewer than two.\n\nPermission: `mdm.category.create`."
x-permission: mdm.category.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - DUPLICATE_VALUE
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/CategoryCreate"
      example:
        code: SEASONAL
        name: "Seasonal produce"
        productLine: PRODUCE
        glGroup: PRODUCE_EGGS
        taxCategoryId: "019a7a8a-89e2-7516-aa4f-5a40a6dbd31e"
        sortOrder: 90
        skuPrefix: SEA
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Category"
        example:
          id: "019a7a89-737b-7c17-9150-ca4d5fa2432b"
          parentId: null
          code: LIVE
          name: "Live animals"
          productLine: LIVE
          glGroup: LIVE_ANIMALS
          taxCategory:
            id: "019a7a8a-6af3-7b33-906b-bc092d2a34e7"
            code: LIVE_ANIMALS
            name: "Live Animals"
          sortOrder: 0
          isOnlineVisible: true
          skuPrefix: LIV
          productCount: 3
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
