operationId: archivePriceList
tags:
  - pricing
summary: "Archive a price list"
description: "Soft delete with a reason. The record stays in history and on documents that used it, so an earlier sale's price reference still reproduces its price. Refused while a version is pending approval or active now or later (422 `RECORD_IN_USE`, `HAS_LIVE_VERSION`) or a customer is assigned the list now or later (`ASSIGNED_TO_CUSTOMERS`).\n\nPermission: `mdm.price_list.archive`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - RECORD_IN_USE
  - RATE_LIMITED
x-permission: mdm.price_list.archive
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ArchiveRequest"
      example:
        version: 3
        reason: "The chop bar now buys at the wholesale tier price"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PriceList"
        example:
          id: "019a7ab1-2c40-7d1e-a6b3-5f0c8e2d4a11"
          code: CUST-ASANTEWAA
          name: "Asantewaa Chop Bar prices"
          kind: CUSTOMER
          channel: null
          customerTier: null
          branch: null
          taxInclusive: false
          currency: GHS
          activeVersion: null
          draftVersionId: null
          version: 4
          createdAt: "2026-11-14T10:05:00Z"
          updatedAt: "2026-11-15T09:40:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
