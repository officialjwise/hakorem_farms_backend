operationId: listCustomers
tags:
  - mdm
summary: "List customers"
description: "Live customers in creation order. `q` that reads as a phone number (`0244123456`, `+233244123456`) finds the customer with that number; any other `q` matches part of the name, ignoring case.\n\nPermission: `mdm.customer.read`."
x-permission: mdm.customer.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: q
    in: query
    required: false
    schema:
      type: string
  - name: kind
    in: query
    required: false
    schema:
      type: string
      enum:
        - INDIVIDUAL
        - BUSINESS
  - name: tierId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
        - ANONYMISED
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
