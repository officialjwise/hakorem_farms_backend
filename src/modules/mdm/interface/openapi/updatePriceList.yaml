operationId: updatePriceList
tags:
  - pricing
summary: "Update a price list"
description: "Send the `version` you read; a stale version is refused with 409. Scoped to the list's branch. `taxInclusive` cannot change once a version of the list has gone for approval, because its prices were read with that flag (422 `RECORD_IN_USE`, `PRICED_WITH_THIS_FLAG`); draft a new list instead.\n\nPermission: `mdm.price_list.update`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - RECORD_IN_USE
  - RATE_LIMITED
x-permission: mdm.price_list.update
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PriceListUpdate"
      example:
        version: 2
        name: "Base prices, all branches"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PriceList"
        example:
          id: "019a7a94-5381-760f-bb48-69ce27dce2ac"
          code: BASE
          name: "Base prices, all branches"
          kind: BASE
          channel: null
          customerTier: null
          branch: null
          taxInclusive: true
          currency: GHS
          activeVersion:
            id: "019a7aa4-46bd-7f59-b491-fe68e7207746"
            versionNo: 4
            validFrom: "2026-11-01T00:00:00Z"
            validTo: null
          draftVersionId: "019a7aa3-e9f0-71af-86e7-23c27a0d9ca0"
          version: 3
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-15T09:30:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
