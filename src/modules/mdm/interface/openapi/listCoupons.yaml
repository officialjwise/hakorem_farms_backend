operationId: listCoupons
tags:
  - pricing
summary: "List the coupons of a promotion"
description: "Permission: `mdm.promotion.read`."
x-permission: mdm.promotion.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
