operationId: createUomConversion
tags:
  - mdm
summary: "Make a unit conversion"
description: "Gives a countable product an alternative unit: one `fromUom` is `numerator / denominator` of the product's base unit, which becomes `toUom` (FR-MDM-003). The factor is kept in lowest terms (250/2000 is stored as 1/8) and must be exact to the three decimal places a quantity carries, so in lowest terms its denominator divides 1,000: a 50 kg bag is 50/1, a 500 g pack 1/2, and a third (1/3, or 3333333/10000000) is refused with 422 `UOM_CONVERSION_INVALID` (`INEXACT_FACTOR`); the database refuses it too. Also refused with `UOM_CONVERSION_INVALID`: a product that is not countable (`NOT_COUNTABLE`: catch-weight meat is charged by its weighed kilograms, so a pack-to-kilogram factor is never a conversion; a goat is counted by the head; a service holds no stock), the base unit itself (`BASE_UNIT`) and a weighed or measured unit (`NOT_COUNTED`). A unit that already has a live conversion for the product is 422 `DUPLICATE_VALUE`; a conversion never changes, so archive it first to give the unit a new factor.\n\nPermission: `mdm.uom_conversion.create`."
x-permission: mdm.uom_conversion.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - DUPLICATE_VALUE
  - UOM_CONVERSION_INVALID
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/UomConversionCreate"
      example:
        productId: "019a7a8d-f1c2-7a10-9e3b-5d2c4a6b8e01"
        fromUom: BAG
        numerator: 50
        denominator: 1
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/UomConversion"
        example:
          id: "019a7f10-2b40-7c11-9a20-3e5d7c1b0a01"
          product:
            id: "019a7a8d-f1c2-7a10-9e3b-5d2c4a6b8e01"
            sku: FEED-BRL-GROWER
            name: "Broiler grower pellets, per kg"
          fromUom: BAG
          toUom: KG
          numerator: 50
          denominator: 1
          factor: "50.000"
          version: 1
          createdAt: "2026-11-15T09:00:00Z"
          archivedAt: null
          archiveReason: null
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
