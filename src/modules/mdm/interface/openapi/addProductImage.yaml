operationId: addProductImage
tags:
  - mdm
summary: "Attach an uploaded photograph to a product"
description: "Upload with POST /files first, with purpose `PRODUCT_IMAGE`, and wait until `getFile` shows it `CLEAN`: the worker re-encodes a clean photograph into its public variants (320, 640 and 1280 pixels wide, WebP with a JPEG fallback, none above 200 KB at 640 pixels) before it marks it clean, so an attached photograph always has them. The original is never served publicly. A file that is not a product photograph is 422 `REFERENCE_NOT_FOUND`; one not yet `CLEAN` is 422 `FILE_NOT_CLEAN`; one already in the gallery is 422 `DUPLICATE_VALUE`. Attaching someone else's upload also needs `platform.file.read.any`. With no `sortOrder`, the photograph goes last. Publishes `mdm.ProductChanged` with `images` changed; the product's `version` does not move.\n\nPermission: `mdm.product.update`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - REFERENCE_NOT_FOUND
  - FILE_NOT_CLEAN
  - DUPLICATE_VALUE
  - RATE_LIMITED
x-permission: mdm.product.update
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
