operationId: previewPriceListVersion
tags:
  - pricing
summary: "Preview a price list version against the version in force"
description: "Compares a `DRAFT` or `PENDING_APPROVAL` version with the `ACTIVE` version of the same list in force when it would take effect (`comparedAt`: its `validFrom`, or now when that is already past, because activation never starts a version before its approval). Lines are paired by the identity the pricing engine resolves on: product, grade, weight band and quantity break (`minQty`), so a line is `ADDED`, `CHANGED` (the basis, a price or quote-only differs), `REMOVED` or `UNCHANGED`. With no version in force `comparedWith` is null and every line is `ADDED`.\n\nLines come in identity order (product, then grade, then band, a missing grade or band first, then quantity break), in cursor pages of at most 100. `counts` covers the whole comparison and is the same on every page. A cursor belongs to one comparison: once the version's entries change, or another version comes into force, it answers 400 `INVALID_CURSOR` and the screen starts again. Read only; nothing is written or audited.\n\nRefusals: 422 `INVALID_STATE_TRANSITION` for a version that is `ACTIVE`, `SUPERSEDED` or `REJECTED`, with the status in `details[].code`.\n\nPermission: `mdm.price_list.read`, at the version's branch (a list that applies everywhere registers its versions under the farm's first branch)."
x-permission: mdm.price_list.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
