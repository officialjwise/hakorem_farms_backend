operationId: updateSupplier
tags:
  - mdm
summary: "Update a supplier"
description: "Send the `version` you read; a stale version is refused with 409. The phone and category rules are those of `createSupplier`; `categoryIds`, when sent, replaces the whole list.\n\nPermission: `mdm.supplier.update`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - DUPLICATE_VALUE
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
x-permission: mdm.supplier.update
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/SupplierUpdate"
      example:
        version: 3
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Supplier"
        example:
          id: "019a7a88-b9e1-70c2-b5fb-1500857c8dde"
          supplierNo: S-0007
          name: "Ashanti Feeds Ltd"
          contactName: "Samuel Ofosu"
          phone: "+233322031447"
          email: "sales@ashanti.com.gh"
          address: "Kaase Industrial Area, Kumasi"
          tinMasked: "C00••••••20"
          status: ACTIVE
          categories:
            - id: "019a7a8a-0e26-7d89-a2c1-e162c0175a40"
              code: FEED
              name: "Feed and medication"
          hasProfile: true
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
