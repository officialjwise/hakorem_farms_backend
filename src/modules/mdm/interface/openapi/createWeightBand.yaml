operationId: createWeightBand
tags:
  - mdm
summary: "Create a weight band"
description: "A band is the half-open range `[minKg, maxKg)`, so 20.000 kg falls in exactly one of two bands that meet there. A band that meets another live band of the species is refused with 422 `WEIGHT_BAND_INVALID` (`OVERLAPS_BAND:<code>`); the database refuses it too.\n\nPermission: `mdm.weight_band.create`."
x-permission: mdm.weight_band.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - DUPLICATE_VALUE
  - WEIGHT_BAND_INVALID
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/WeightBandCreate"
      example:
        speciesId: "019a7a8b-a049-7e16-b34e-ea33ee146311"
        code: GOAT-XL
        minKg: "45.000"
        maxKg: "70.000"
responses:
  "201":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/WeightBand"
        example:
          id: "019a7a8c-3af4-7f87-84bf-01494e897a27"
          code: GOAT-S
          minKg: "10.000"
          maxKg: "18.000"
          speciesId: "019a7a8b-a049-7e16-b34e-ea33ee146311"
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
