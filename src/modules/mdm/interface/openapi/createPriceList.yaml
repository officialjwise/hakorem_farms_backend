operationId: createPriceList
tags:
  - pricing
summary: "Create a price list"
description: "Permission: `mdm.price_list.create`."
x-permission: mdm.price_list.create
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - DUPLICATE_VALUE
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PriceListCreate"
      example:
        code: CUST-ASANTEWAA
        name: "Asantewaa Chop Bar prices"
        kind: CUSTOMER
        taxInclusive: false
responses:
