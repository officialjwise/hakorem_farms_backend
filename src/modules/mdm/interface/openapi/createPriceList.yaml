    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/PriceList"
        example:
          id: "019a7ab1-2c40-7d1e-a6b3-5f0c8e2d4a11"
          code: CUST-ASANTEWAA
          name: "Asantewaa Chop Bar prices"
          kind: CUSTOMER
          channel: null
          customerTier: null
          branch: null
          taxInclusive: false
          currency: GHS
          activeVersion: null
          draftVersionId: null
          version: 1
          createdAt: "2026-11-14T10:05:00Z"
          updatedAt: "2026-11-14T10:05:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
