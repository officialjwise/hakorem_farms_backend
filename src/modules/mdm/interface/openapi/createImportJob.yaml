operationId: createImportJob
tags:
  - mdm
summary: "Upload a spreadsheet and validate it as a dry run"
description: "Upload the spreadsheet first with POST /files, purpose `IMPORT` (XLSX or CSV), and wait until `getFile` shows it `CLEAN`. The first sheet's first row names the columns; each further row is one record. This call runs the dry run and writes nothing but the job and its row errors: the job comes back `VALIDATED` with `rowsTotal`, `rowsValid`, `rowsToCreate` and `rowsToUpdate`, and each row error is listed by `listImportErrors`; a file that cannot be read as this entity's sheet (no header, an unknown or missing column, no rows, more than 5,000 rows) comes back `FAILED` with its errors on row 1. Columns are matched without regard to case; a blank cell on a row that changes a record changes nothing. `CUSTOMER`: `customerNo` (blank creates a customer, a number changes that customer), `kind`, `name`, `phone`, `email`, `tier`. `PRODUCT`: `sku` names the product (a new SKU creates one, ACTIVE and `HIDDEN` online unless `onlineMode` says otherwise), `name`, `category` (code), `stockPolicy`, `species` (code), `baseUom`, `saleUom`, `taxCategory` (code; blank takes the category's), `nominalPackKg`, `shelfLifeDays`, `barcode`, `description`, `onlineMode`; the policy, species and units of an existing product never change. `SUPPLIER`: `supplierNo` (blank registers a supplier), `name`, `contactName`, `phone`, `email`, `address`, `categories` (category codes separated by `;`, replacing the categories supplied); no tax number column. `LOCATION`: `branch` and `code` name the location (a new code creates one), `name`, `kind` (physical kinds only), `parent` (code of a live location of the branch, or of a row above), `isSellable`, `tempClass`, `tempMinC`, `tempMaxC`, `capacityHead`; kind and temperature class never change, and virtual locations are never imported. `PRICE_LIST_ENTRY`: `priceList` (code), `sku`, `grade`, `weightBand` (codes of the product's species), `minQty`, `basis`, `listPricePesewas`, `floorPricePesewas`, `ceilingPricePesewas` (integer pesewas: 85000 is GHS 850.00), `quoteOnly`; rows are written into the list's `DRAFT` version only (a row matching an entry on product, grade, band and minimum quantity replaces it, any other adds one, entries not named stay), a list with no draft or one waiting for approval is a row error, and the draft still needs maker-checker approval to go live. `OPENING_STOCK` (inventory's sheet): `branch` and `location` (codes of a physical stock location, not in transit or a site), `sku`, `qty`, `valuePesewas` (the line's cost, above zero), `batch` and `expiresOn` for a lot (the expiry when the product has a shelf life), `tag` and `sex` for an animal (one row per animal, `qty` 1), `weightKg` (recorded as `MANUAL`); a product that already has stock history at the branch, a batch or tag already in use, or a repeated row is a row error: opening stock is loaded once, before trading. A branch or location the importer cannot reach is refused when the import is applied. A file of another use, or none, is 422 `REFERENCE_NOT_FOUND`; one not `CLEAN` is 422 `FILE_NOT_CLEAN`; someone else's upload also needs `platform.file.read.any`.\n\nPermission: `mdm.import.create`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - REFERENCE_NOT_FOUND
  - FILE_NOT_CLEAN
  - IMPORT_ENTITY_NOT_AVAILABLE
  - RATE_LIMITED
x-permission: mdm.import.create
