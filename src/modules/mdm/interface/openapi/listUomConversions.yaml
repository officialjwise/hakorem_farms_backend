operationId: listUomConversions
tags:
  - mdm
summary: "List unit conversions"
description: "A product's alternative units and their exact factors to its base unit (FR-MDM-003, CR-011): one `fromUom` is `numerator / denominator` of `toUom`, and `factor` is the same value with three decimal places. Only a countable product converts: a 50 kg bag of grower pellets held by the kilogram, a crate of 24 cabbages counted by the head. A catch-weight product never has one, because its weighed kilograms are what is charged (`nominalPackKg` is an estimate). Live conversions only, oldest first, unless `includeArchived=true`; an archived conversion keeps the factor a quantity was converted with.\n\nPermission: `mdm.product.read`."
x-permission: mdm.product.read
x-error-codes:
  - VALIDATION_FAILED
  - INVALID_CURSOR
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: productId
    in: query
    required: false
    description: "Only this product's conversions."
    schema:
      type: string
      format: uuid
  - name: includeArchived
    in: query
    required: false
    description: "Also list archived conversions."
    schema:
      type: boolean
      default: false
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
