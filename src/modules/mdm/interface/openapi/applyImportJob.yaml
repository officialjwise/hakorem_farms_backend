operationId: applyImportJob
tags:
  - mdm
summary: "Apply a validated import"
description: "Applies every row in one transaction, or none. Only a `VALIDATED` import whose dry run found no row error is applied; anything else is 422 `IMPORT_NOT_VALIDATED`. The rows are checked again inside the transaction: if the database moved since the dry run and a row no longer passes, nothing is written, the new errors are added to the job and the answer is 422 `IMPORT_NOT_VALIDATED`. Each row is written through the entity's own rules and audited, so applying also needs the entity's create or update permission for the rows that create or change records (for customers `mdm.customer.create` and `mdm.customer.update`; for products, suppliers and locations their own `.create` and `.update`; for price list entries `mdm.price_list.update`). Locations and price list entries are also checked at each branch the file writes: a grant at one branch does not write another's (403). Price list entries are written into each list's `DRAFT` version, never an active one. Opening stock waits for the inventory module (B5).\n\nPermission: `mdm.import.apply`."
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - IMPORT_NOT_VALIDATED
  - RATE_LIMITED
x-permission: mdm.import.apply
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "202":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ImportJob"
        example:
          id: "019a7aaa-ae38-7b71-80a9-bfe518c538c2"
          entity: PRODUCT
          direction: IMPORT
          file:
            id: "019a7aaa-cd27-7554-9a8c-5e1c9276d6fa"
            originalName: catalogue-2026-11.xlsx
            contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          status: APPLIED
          rowsTotal: 42
          rowsValid: 42
          rowsApplied: 42
          rowsToCreate: 40
          rowsToUpdate: 2
          createdAt: "2026-11-01T10:00:00Z"
          createdBy:
            id: "019a7a86-4f35-7afd-b035-b8ab03a83188"
            displayName: "Kwabena Owusu"
