operationId: listLocations
tags:
  - mdm
summary: "List stock locations"
description: "Live locations the caller's grants reach, in creation order: a grant for a whole branch reaches its every location, a grant at one location only that location (its branch's virtual locations are not added). Virtual locations are left out unless `includeVirtual=true`.\n\nPermission: `mdm.location.read`."
x-permission: mdm.location.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: kind
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/LocationKind"
  - name: includeVirtual
    in: query
    required: false
    schema:
      type: boolean
  - name: parentId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
