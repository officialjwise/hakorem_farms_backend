operationId: archiveWeightBand
tags:
  - mdm
summary: "Archive a weight band"
description: "Soft delete with a reason. The record stays in history and on documents that used it. Refused with 422 `RECORD_IN_USE` (`USED_BY_LIVE_PRICES`) while a pending or active price list version prices with the band.\n\nPermission: `mdm.weight_band.archive`."
x-permission: mdm.weight_band.archive
x-error-codes:
  - VALIDATION_FAILED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - UNAUTHENTICATED
  - FORBIDDEN
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - VERSION_CONFLICT
  - RECORD_IN_USE
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ArchiveRequest"
      example:
        version: 3
        reason: "No longer used"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/WeightBand"
        example:
          id: "019a7a8c-3af4-7f87-84bf-01494e897a27"
          code: GOAT-S
          minKg: "10.000"
          maxKg: "18.000"
          speciesId: "019a7a8b-a049-7e16-b34e-ea33ee146311"
          version: 2
          createdAt: "2026-11-02T08:00:00Z"
          updatedAt: "2026-11-10T14:00:00Z"
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/BusinessRuleViolation"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
