operationId: listReasonCodes
tags:
  - mdm
summary: "List reason codes"
description: "A fixed list changed only by migration, as the threat model requires; the contract has no write operation for it. Ordered by code. The example shows a part of the list, not all of it. `GOODS_RECEIPT_REJECTION` (B09e continued 2, 2.3.0) holds the reasons for goods rejected at the door, which a goods receipt line names in `rejectionReasonCode`: `CRACKED`, `BROKEN`, `DIRTY`, `SHORT`, `WRONG_ITEM_DELIVERED` and `QUALITY_REJECTED`. `STOCK_ADJUSTMENT` holds `BREAKAGE` (broken or cracked in store, no note) and `RODENT_DAMAGE`, both written off to the `WASTAGE` loss group.\n\nPermission: `mdm.reason_code.read`."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
x-permission: mdm.reason_code.read
parameters:
  - name: domain
    in: query
    required: false
    schema:
      type: string
      enum:
        - STOCK_ADJUSTMENT
        - MORTALITY
        - CULL
        - WASTAGE
        - PRICE_OVERRIDE
        - VOID
        - REFUND
        - RETURN
        - CANCELLATION
        - DELIVERY_FAILURE
        - CASH_MOVEMENT
        - HOLD_RELEASE
        - BILLING_ADJUSTMENT
        - PAYMENT_REVERSAL
        - GOODS_RECEIPT_REJECTION
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ReasonCodePage"
        examples:
          default:
            value:
              data:
                - code: BREAKAGE
                  domain: STOCK_ADJUSTMENT
                  description: "Broken or cracked in store"
                  requiresNote: false
                  lossAccountGroup: WASTAGE
                - code: CHARGE_OMITTED
                  domain: BILLING_ADJUSTMENT
                  description: "A charge was left off the invoice"
                  requiresNote: true
                  lossAccountGroup: null
                - code: CHEQUE_DISHONOURED
                  domain: PAYMENT_REVERSAL
                  description: "Cheque returned unpaid by the bank"
                  requiresNote: true
                  lossAccountGroup: null
                - code: COUNT_ERROR
                  domain: STOCK_ADJUSTMENT
                  description: "Earlier count was wrong"
                  requiresNote: true
                  lossAccountGroup: SHRINKAGE
                - code: CRACKED
                  domain: GOODS_RECEIPT_REJECTION
                  description: "Cracked on arrival"
                  requiresNote: false
                  lossAccountGroup: null
                - code: CUSTOMER_CHANGED_MIND
                  domain: VOID
                  description: "Customer changed mind before leaving"
                  requiresNote: false
                  lossAccountGroup: null
                - code: DAMAGED_IN_DELIVERY
                  domain: REFUND
                  description: "Damaged in delivery"
                  requiresNote: true
                  lossAccountGroup: null
                - code: DISEASE_SUSPECTED
                  domain: MORTALITY
                  description: "Died, disease suspected"
                  requiresNote: true
                  lossAccountGroup: MORTALITY
                - code: OVERCHARGED
                  domain: REFUND
                  description: "Customer was overcharged"
                  requiresNote: true
                  lossAccountGroup: null
                - code: QUALITY_COMPLAINT
                  domain: REFUND
                  description: "Quality complaint upheld"
                  requiresNote: true
                  lossAccountGroup: null
                - code: RECORDED_IN_ERROR
                  domain: PAYMENT_REVERSAL
                  description: "Payment recorded in error"
                  requiresNote: true
                  lossAccountGroup: null
                - code: RETURN_QUALITY
                  domain: RETURN
                  description: "Returned for quality"
                  requiresNote: true
                  lossAccountGroup: null
                - code: RETURN_UNWANTED
                  domain: RETURN
                  description: "Returned unused, not wanted"
                  requiresNote: false
                  lossAccountGroup: null
                - code: RETURN_WRONG_ITEM
                  domain: RETURN
                  description: "Returned, wrong item"
                  requiresNote: true
                  lossAccountGroup: null
                - code: UNDERCHARGED
                  domain: BILLING_ADJUSTMENT
                  description: "Customer was undercharged"
                  requiresNote: true
                  lossAccountGroup: null
                - code: WRONG_ITEM
                  domain: REFUND
                  description: "Wrong item supplied"
                  requiresNote: true
                  lossAccountGroup: null
              page:
                nextCursor: null
                limit: 25
                hasMore: false
          empty:
            summary: "Nothing matches: no rows and no next page"
            value:
              data: []
              page:
                nextCursor: null
                limit: 25
                hasMore: false
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthenticated"
  "403":
    $ref: "#/components/responses/Forbidden"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
