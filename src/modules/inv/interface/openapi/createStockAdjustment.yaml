operationId: createStockAdjustment
tags:
  - inv
summary: "Draft a stock adjustment"
description: "Drafts a gain or loss at a physical location with a reason from the fixed list for `STOCK_ADJUSTMENT` or `WASTAGE`, and a note when the reason needs one. Values come from the cost pool, never from the request: a loss at what the pool would give up, a gain at the pool's average. Animals are never adjusted: they leave by a sale, a death or a cull, each with its own controls. A typed weight is recorded as `MANUAL`. Refusals are `STOCK_ADJUSTMENT_INVALID` with the rule in `details[].code`: `REASON_NOT_ALLOWED`, `NOTE_REQUIRED`, `NOT_A_STOCK_LOCATION`, `EXCEPTION_NOT_OPEN`, `RESOLVED_THROUGH_THE_EXCEPTION` (a held transfer variance is written off through `resolveStockException` only, 1.19.0), `ANIMAL_NOT_ADJUSTED`, `NO_LINES`, `LINE_REPEATED`, `STOCK_UNIT_REQUIRED`, `PRODUCT_NOT_TRACKED`, `PRODUCT_NOT_STOCKED`, `PRODUCT_NOT_ACTIVE`, `NOT_FOR_THIS_PRODUCT`, `STOCK_UNIT_NOT_ACTIVE`, `NOT_IN_THIS_BRANCH`.\n\nPermission: `inv.adjustment.create`, scoped to the location."
x-permission: inv.adjustment.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - STOCK_ADJUSTMENT_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
