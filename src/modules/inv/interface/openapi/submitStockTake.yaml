operationId: submitStockTake
tags:
  - inv
summary: "Post the variances"
description: "Refuses a take with a line awaiting its recount (`STOCK_TAKE_NOT_COUNTED`). Values the variances again from the pools as they are now and judges their value, gains and losses together, against the `STOCK_WRITE_OFF` threshold (50,000 pesewas in the seed). Below it, posts one `STOCKTAKE_LOSS` (to the branch's loss location, reason `COUNT_ERROR`) or `STOCKTAKE_GAIN` (from its adjustment location, reason `FOUND_STOCK`) per variance. At or above it the answer is `202` and stock is unchanged until a different user approves; the approval binds to the lines and their values, and a rejected take is cancelled. A posted take is immutable.\n\nPermission: `inv.stock_take.post`, scoped to the take's location.\n\nMay require approval of kind `STOCK_WRITE_OFF`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user holding `inv.adjustment.approve` approves, with a fresh step-up."
x-permission: inv.stock_take.post
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - STOCK_TAKE_NOT_COUNTED
  - INSUFFICIENT_STOCK
  - STOCK_UNIT_NOT_AVAILABLE
  - STOCK_UNIT_RESERVED
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
