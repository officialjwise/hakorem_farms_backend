operationId: createStockHold
tags:
  - inv
summary: "Place a quarantine or investigation hold"
description: "Places a `QUARANTINE` or `INVESTIGATION` hold on an active animal or lot, from now until `endsAt` or until released. While it is in force the lot or animal cannot be sold, processed or dispatched (`STOCK_UNIT_ON_HOLD` on those operations); pen moves and write-offs are not blocked. The hold is its own `STOCK_HOLD` document, which is its `sourceDocument`. A `WITHDRAWAL` hold is placed only by recording a treatment and is refused here (400).\n\nPermission: `inv.hold.create`, scoped to the unit's branch and, for an animal, where it stands."
x-permission: inv.hold.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - STOCK_HOLD_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/StockHoldCreate"
      example:
        stockUnitId: "019a7a91-2f3b-74f5-9a2d-582bcbe2d109"
        kind: INVESTIGATION
        note: "Customer reported off smell from a pack of this lot"
