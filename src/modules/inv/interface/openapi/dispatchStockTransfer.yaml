operationId: dispatchStockTransfer
tags:
  - inv
summary: "Dispatch a transfer into transit"
description: "Moves every line from the source into the source branch's in-transit location, which is still the farm's stock: it keeps its value and cannot be sold. A transfer within one branch changes no cost. Stock under a hold cannot be dispatched (`STOCK_UNIT_ON_HOLD`); a branch without an in-transit location is refused (`NO_IN_TRANSIT_LOCATION`). A transfer within one location tree and branch may be dispatched and received in one step by sending receive straight after.\n\nPermission: `inv.transfer.dispatch`, scoped to the source location."
x-permission: inv.transfer.dispatch
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - STOCK_TRANSFER_INVALID
  - REFERENCE_NOT_FOUND
  - INSUFFICIENT_STOCK
  - STOCK_UNIT_NOT_AVAILABLE
  - STOCK_UNIT_ON_HOLD
  - STOCK_UNIT_RESERVED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
