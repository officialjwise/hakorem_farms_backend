operationId: listStockMovements
tags:
  - inv
summary: "Search the stock movement ledger"
description: "The append-only movement ledger, newest first, narrowed to the branches and locations the reader's grants reach (a movement is shown when its branch and either of its locations is reached). `reversedByMovementId` names the movement that reversed one. There is no operation that edits or deletes a movement. `sort` names one field of this list (`occurredAt`, `valuePesewas`) and `direction` is `asc` (the default with a field) or `desc`; the server applies it before paging, through the shared sort (CR-019, ADR-0054), breaking ties by the movement id in the same direction, so following `nextCursor` never skips or repeats a row. Any other field, any other direction, or a `direction` without `sort` is 400 `VALIDATION_FAILED` with detail `SORT_NOT_ALLOWED`; a cursor from another sort is 400 `INVALID_CURSOR`. Without `sort` the order is newest first (by id, descending), as the example shows. A product's name (master data's) is not sortable. `valuePesewas` is a cost: only a reader of movements, who sees it on every row, may sort by it.\n\nPermission: `inv.movement.read`."
x-permission: inv.movement.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: productId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: stockUnitId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: locationId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: movementType
    in: query
    required: false
    schema:
      type: string
  - name: sourceDocumentId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: sort
    in: query
    required: false
    schema:
      type: string
      enum:
        - occurredAt
        - valuePesewas
  - name: direction
    in: query
    required: false
    schema:
      type: string
      enum:
        - asc
        - desc
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
