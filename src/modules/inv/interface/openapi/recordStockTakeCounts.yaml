operationId: recordStockTakeCounts
tags:
  - inv
summary: "Record counted quantities"
description: "While `COUNTING`, records first counts (`isRecount` absent or false), which the counter may correct until counting closes; a typed weight is recorded as `MANUAL`. In `REVIEW`, records the recount of a line that needs one (`isRecount: true`), once, and the variance follows the recount.\n\nPermission: `inv.stock_take.count`, scoped to the take's location."
x-permission: inv.stock_take.count
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - STOCK_TAKE_INVALID
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/StockTakeCounts"
      example:
        counts:
          - lineId: "019a7aba-df52-7881-adba-90eecb6b09cc"
            countedQty: "34.000"
          - lineId: "019a7aba-fe41-7265-b79d-2f26451ca804"
            countedQty: "30.000"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/StockTake"
        example:
          id: "019a7aba-06c9-7349-b881-3d6a7794b648"
          stockTakeNo: STK-2026-DDW-000014
          status: COUNTING
          location:
            id: "019a7a84-7f34-76a9-8be1-736ae249ec48"
            code: SHOP
            name: "Shop floor"
            kind: SHOP_FLOOR
          scope: CYCLE
          snapshotAt: "2026-11-13T06:00:00Z"
          countedBy:
            id: "019a7a86-8d13-7ec4-93fc-f519f70a6df7"
            displayName: "Yaw Boateng"
          lineCount: 24
          countedLineCount: 11
          gainValuePesewas: null
          lossValuePesewas: null
          currency: GHS
          approvalRequestId: null
          branchId: "019a7a83-2aef-79e3-9f1b-a708a7ae1fe6"
          version: 2
          createdAt: "2026-11-12T08:00:00Z"
