operationId: listStockExceptions
tags:
  - inv
summary: "List stock exceptions that need a person"
description: "Stock exceptions that need a person, newest first: negative stock, an offline conflict, a hold or reservation conflict, a temperature excursion, balance drift, or a transfer shortfall held in transit (ADR-0048). `summary` names the two conflicting facts. Narrowed to the branches the reader's grants reach and, for a grant at one location, the exceptions at that location.\n\nPermission: `inv.exception.read`."
x-permission: inv.exception.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - OPEN
        - RESOLVED
  - name: kind
    in: query
    required: false
    schema:
      type: string
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
