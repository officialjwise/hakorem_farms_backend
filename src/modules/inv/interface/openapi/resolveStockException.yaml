operationId: resolveStockException
tags:
  - inv
summary: "Mark a stock exception resolved"
description: "Resolves an open exception once, with a `resolutionKind` and a note, audited. A transfer shortfall held in transit (a `TRANSFER_VARIANCE` with no `movementId`, ADR-0048) takes `WRITE_OFF` or `FOUND` and no `resolutionDocumentId`: `WRITE_OFF` drafts and submits a stock adjustment in transit with the variance's reason, valued from the cost pool, so at or above the `STOCK_WRITE_OFF` threshold (seed 50,000 pesewas, copied onto the adjustment) it answers 202 `ApprovalPending` and the exception stays open until a different person holding `inv.adjustment.approve` approves with step-up; below it the loss posts at once. `FOUND` names `foundLocationId`, a stock location of either branch of the transfer, and returns the held quantity there as a `TRANSFER_RECEIPT` against the transfer, with no expense; the resolution document is the transfer. While a write-off waits for approval nothing else is decided (`WRITE_OFF_PENDING`); a rejected write-off leaves the variance held. Any other exception takes `ADJUSTED` with the posted adjustment that names it, or `NO_CORRECTION`; with no `resolutionKind`, a `resolutionDocumentId` means `ADJUSTED` and none means `NO_CORRECTION`. A resolved exception is refused (`INVALID_STATE_TRANSITION`).\n\nPermission: `inv.exception.resolve`, scoped to the exception's branch and location, and to the found location."
x-permission: inv.exception.resolve
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - STOCK_EXCEPTION_INVALID
  - STOCK_ADJUSTMENT_INVALID
  - REFERENCE_NOT_FOUND
  - INSUFFICIENT_STOCK
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
