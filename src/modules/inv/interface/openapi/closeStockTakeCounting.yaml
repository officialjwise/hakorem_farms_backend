operationId: closeStockTakeCounting
tags:
  - inv
summary: "Close counting and show variances"
description: "Closes counting once every line is counted (`STOCK_TAKE_NOT_COUNTED` otherwise) and values each variance from its cost pool: a loss at what the pool would give up, a gain at the pool's average. The tolerance is zero: every line whose count differs from the expected figure is flagged for a recount.\n\nPermission: `inv.stock_take.count`, scoped to the take's location."
x-permission: inv.stock_take.count
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - STOCK_TAKE_NOT_COUNTED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
