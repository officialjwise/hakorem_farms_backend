operationId: listStockReservations
tags:
  - inv
summary: "List stock reservations"
description: "Stock promised to a checkout, order or quote, oldest first. A reservation is made in process by the module that holds it (SHP, ORD, QUO) at serializable isolation: never above what is available, one active reservation per animal, never of stock in transit or of a unit under a hold. An outbound movement that names it consumes it whole; the scheduled job ends it `EXPIRED` at `expiresAt` (every minute) and publishes `inv.ReservationExpired`. Narrowed to the branches the reader's grants reach and, for a grant at one location, the reservations at that location.\n\nPermission: `inv.reservation.read`."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
x-permission: inv.reservation.read
