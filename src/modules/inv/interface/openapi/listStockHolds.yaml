operationId: listStockHolds
tags:
  - inv
summary: "List holds that block sale"
description: "Holds on animals and lots, oldest first. `active=true` lists the holds in force now (begun, not ended, not released); `active=false` the others. Narrowed to the branches the reader's grants reach and, for a grant at one location, to the animals standing there and the lots with stock there.\n\nPermission: `inv.hold.read`."
x-permission: inv.hold.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: active
    in: query
    required: false
    schema:
      type: boolean
  - name: kind
    in: query
    required: false
    schema:
      type: string
      enum:
        - WITHDRAWAL
        - QUARANTINE
        - INVESTIGATION
  - name: stockUnitId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
