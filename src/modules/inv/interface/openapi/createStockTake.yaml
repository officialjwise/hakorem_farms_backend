operationId: createStockTake
tags:
  - inv
summary: "Plan a stock take or cycle count"
description: "Plans a count of one location: of every product there (`FULL`) or of the listed products (`CYCLE`, `productIds` required). The location is a live physical location other than in-transit and a site. Animals are not counted here (`ANIMAL_NOT_COUNTED`): a missing animal is a death, a cull or a theft with its own controls. A take whose scope shares a product with another open take of the same location is refused (`SCOPE_OVERLAP`); a full take shares every product.\n\nPermission: `inv.stock_take.create`, scoped to the location."
x-permission: inv.stock_take.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - STOCK_TAKE_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
