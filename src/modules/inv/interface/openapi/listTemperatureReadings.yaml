operationId: listTemperatureReadings
tags:
  - inv
summary: "List cold-chain temperature readings"
description: "Readings within the caller's grants, oldest first, with `isExcursion` against the range the location had when the reading was recorded.\n\nPermission: `inv.cold_chain.read`."
x-permission: inv.cold_chain.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: locationId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: excursionsOnly
    in: query
    required: false
    schema:
      type: boolean
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
