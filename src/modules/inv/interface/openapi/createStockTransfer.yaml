operationId: createStockTransfer
tags:
  - inv
summary: "Draft a transfer between locations"
description: "Drafts a transfer between two physical locations that hold stock (never in-transit itself or a site). Each line names an animal or a lot by its stock unit, or an untracked product by itself; an animal moves whole and must be at the source. Refusals are `STOCK_TRANSFER_INVALID` with the rule in `details[].code`: `SAME_LOCATION`, `NOT_A_STOCK_LOCATION`, `NO_LINES`, `LINE_REPEATED`, `STOCK_UNIT_REQUIRED`, `PRODUCT_NOT_TRACKED`, `PRODUCT_NOT_STOCKED`, `PRODUCT_NOT_ACTIVE`, `NOT_FOR_THIS_PRODUCT`, `STOCK_UNIT_NOT_ACTIVE`, `WHOLE_ANIMALS_ONLY`, `NOT_AT_SOURCE`. `transferNo` is null until document numbering exists.\n\nPermission: `inv.transfer.create`, scoped to the source location."
x-permission: inv.transfer.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - STOCK_TRANSFER_INVALID
  - REFERENCE_NOT_FOUND
  - RATE_LIMITED
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
