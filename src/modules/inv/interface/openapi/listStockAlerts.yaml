operationId: listStockAlerts
tags:
  - inv
summary: "List low-stock and expiring-stock alerts"
description: "Open alerts within the caller's grants, newest first. `LOW_STOCK` (available at or below the reorder point) and `BELOW_MINIMUM` (under the minimum) belong to a reorder rule and are raised once per crossing, in the transaction of the movement, reservation or hold that crossed it, and cleared once stock rises above the level again; `onHandQty` is what is available now, `thresholdQty` the level crossed and `suggestedQty` what brings it back to the maximum, all in the product's base unit (`uom`); a rule counted in a selling unit also answers them in that unit (`inRuleUnit`, B09e continued): whole units and what is left over, and the suggestion in whole units rounded up so the order reaches the maximum. `EXPIRING` (within the lead time of the product's rule, default 3 days) and `EXPIRED` (past the expiry date, and refused to any sale with `STOCK_UNIT_EXPIRED`, so flagged for write-off) belong to a lot where it stands and are raised by the daily job; `onHandQty` is its on hand there and `daysToExpiry` counts from today in Africa/Accra. Each alert is also published as `inv.StockAlertRaised`.\n\nPermission: `inv.stock.read`."
x-permission: inv.stock.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: kind
    in: query
    required: false
    schema:
      type: string
      enum:
        - LOW_STOCK
        - BELOW_MINIMUM
        - EXPIRING
        - EXPIRED
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
