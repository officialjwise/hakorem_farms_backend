operationId: listReorderRules
tags:
  - inv
summary: "List reorder rules"
description: "The live reorder rules within the caller's grants, in id order: per product and branch, or one location of it, with the minimum, the reorder point (a `LOW_STOCK` alert is raised when available stock falls to or below it), the maximum (the suggested reorder brings stock back to it) and the expiry alert lead time (null takes the default of 3 days).\n\nPermission: `inv.reorder_rule.read`."
x-permission: inv.reorder_rule.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: productId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
