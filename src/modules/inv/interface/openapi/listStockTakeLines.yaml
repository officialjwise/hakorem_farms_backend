operationId: listStockTakeLines
tags:
  - inv
summary: "List the lines of a stock take"
description: "The lines and, from review on, the variance report: expected, counted and recounted quantity, the variance and its value at cost. While the take is `DRAFT` or `COUNTING`, `expectedQty`, `varianceQty`, `varianceValuePesewas` and `varianceDirection` are null for every reader: the count is blind. In review, `needsRecount` marks every line whose first count differs from the expected figure and has not been recounted.\n\nPermission: `inv.stock_take.read`, scoped to the take's location."
x-permission: inv.stock_take.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
