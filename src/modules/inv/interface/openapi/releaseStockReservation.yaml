operationId: releaseStockReservation
tags:
  - inv
summary: "Release a reservation"
description: "Releases an active reservation by hand, once, with a reason: what it promised is available again at once, and `inv.ReservationReleased` is published for its holder. A reservation consumed, expired or already released is refused (`INVALID_STATE_TRANSITION`).\n\nPermission: `inv.reservation.release`, scoped to the reservation's branch and location."
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - RATE_LIMITED
x-permission: inv.reservation.release
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Customer will not collect; quote withdrawn"
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/StockReservation"
        example:
          id: "019a7ab0-99f7-7ffb-9533-088363a68161"
          product:
