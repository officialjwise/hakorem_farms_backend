operationId: getStockException
tags:
  - inv
summary: "Get a stock exception"
description: "One stock exception, scoped to its branch and, when it names one, its location.\n\nPermission: `inv.exception.read`."
x-permission: inv.exception.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
