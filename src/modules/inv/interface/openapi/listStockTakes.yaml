operationId: listStockTakes
tags:
  - inv
summary: "List stock takes"
description: "Stock takes and cycle counts, oldest first, narrowed to the branches and locations the reader's grants reach. `status` is one of `DRAFT`, `COUNTING`, `REVIEW`, `PENDING_APPROVAL`, `POSTED`, `CANCELLED`.\n\nPermission: `inv.stock_take.read`."
x-permission: inv.stock_take.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: locationId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
