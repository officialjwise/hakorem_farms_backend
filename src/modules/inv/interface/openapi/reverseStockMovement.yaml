operationId: reverseStockMovement
tags:
  - inv
summary: "Correct a movement with a reversing movement"
description: "Writes a new movement with source and destination swapped, carrying the original's value; the original is never changed and stays visible, linked to its reversal. A movement is reversed once (`STOCK_MOVEMENT_ALREADY_REVERSED`, also while a reversal waits for approval). The reason is from the stock adjustment list (`COUNT_ERROR`, `RECEIPT_ERROR` and the others), and the note is kept. A transfer's movements, a value-only movement and a reversal are never reversed by hand, and a movement whose cost pool no longer holds its value is corrected with an adjustment instead (`STOCK_REVERSAL_NOT_POSSIBLE`, the rule in `details[].code`). The reversal is recorded as a `STOCK_REVERSAL` document, the reversing movement's source document.\n\nPermission: `inv.movement.reverse`, scoped to the movement's branch and physical location.\n\nMay require approval of kind `STOCK_REVERSAL` (at or above 50,000 pesewas in the seed). When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user holding `inv.adjustment.approve` approves, with a fresh step-up."
x-permission: inv.movement.reverse
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - STOCK_MOVEMENT_ALREADY_REVERSED
  - STOCK_REVERSAL_NOT_POSSIBLE
  - REFERENCE_NOT_FOUND
  - INSUFFICIENT_STOCK
  - STOCK_UNIT_NOT_AVAILABLE
  - STOCK_UNIT_RESERVED
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
