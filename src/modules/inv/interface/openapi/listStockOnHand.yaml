operationId: listStockOnHand
tags:
  - inv
summary: "List stock on hand with its value at cost"
description: "Derived from the movement ledger through the trigger-maintained balance, at physical locations, narrowed to the branches and locations the reader is granted. `valueAtCostPesewas` is the line's share of its cost pool by largest remainder, and `totalValueAtCostPesewas` is the exact value of all matching stock at cost, computed by the backend, so the screen never sums rows. `uomDisplayDecimals` says how many decimals to show (CR-003). `priceBand` is null until the stock screen's channel is decided. `sort` names one field of this list (`onHandQty`) and `direction` is `asc` (the default with a field) or `desc`; the server applies it before paging, through the shared sort (CR-019, ADR-0054), breaking ties by the line's location, product and stock unit ids in the same direction, so following `nextCursor` never skips or repeats a row. Any other field, any other direction, or a `direction` without `sort` is 400 `VALIDATION_FAILED` with detail `SORT_NOT_ALLOWED`; a cursor from another sort is 400 `INVALID_CURSOR`. Without `sort` the order is by location id, then product id, then stock unit id (an untracked line first), as the example shows. A product's or location's name (master data's, not inventory's) and `valueAtCostPesewas` (each line's share of its cost pool, computed when read) are not sortable.\n\nPermission: `inv.stock.read`."
x-permission: inv.stock.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - RATE_LIMITED
parameters:
  - name: branchId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: locationId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: productId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: categoryId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: stockUnitId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: includeZero
    in: query
    required: false
    schema:
      type: boolean
  - name: expiringWithinDays
    in: query
    required: false
    schema:
      type: integer
  - name: sort
    in: query
    required: false
    schema:
      type: string
      enum:
        - onHandQty
  - name: direction
    in: query
    required: false
    schema:
      type: string
      enum:
        - asc
        - desc
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
