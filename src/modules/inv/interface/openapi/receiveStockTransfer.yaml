operationId: receiveStockTransfer
tags:
  - inv
summary: "Confirm receipt at the destination"
description: "Confirms what arrived, line by line: every dispatched line once, never more than was dispatched, an animal whole or not at all. Received plus variance equals dispatched; a shortfall needs a reason from the stock adjustment or wastage list, is never a loss at receipt: it stays held in transit at its value with an open `TRANSFER_VARIANCE` stock exception (no `movementId`), which a manager clears through `resolveStockException` by a write-off with approval at the threshold or as found (ADR-0048, 1.19.0). Held stock is never sold, reserved or dispatched. Refusals are `TRANSFER_VARIANCE` with the rule in `details[].code`: `VARIANCE_REASON_REQUIRED`, `NO_VARIANCE`, `MORE_THAN_DISPATCHED`, `WHOLE_ANIMALS_ONLY`, `LINE_UNKNOWN`, `LINE_REPEATED`, `LINE_MISSING`, `REASON_NOT_ALLOWED`. Between branches the value moves to the receiving branch's pool.\n\nPermission: `inv.transfer.receive`, scoped to the destination location."
x-permission: inv.transfer.receive
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - TRANSFER_VARIANCE
  - INSUFFICIENT_STOCK
  - STOCK_UNIT_NOT_AVAILABLE
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/TransferReceive"
      example:
        lines:
          - lineId: "019a7ab6-85b6-7485-a9bd-5121ae87c9ff"
            qtyReceived: "29.750"
            varianceReasonCode: DRIP_LOSS
