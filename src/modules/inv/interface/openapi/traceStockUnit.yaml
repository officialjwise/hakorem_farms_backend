operationId: traceStockUnit
tags:
  - inv
summary: "Trace a lot or animal backward and forward"
description: "Answers UAT scenario 3 in one request: a sold meat lot back to the individual animal, its supplier, its feed and veterinary cost, and forward to every sale. `costByElement` is what the origins of the trace cost (the animals, or the unit itself when it came from nowhere else). `healthEvents` is empty until the livestock register exists; `customer` and `billingDocument` on a sale are null until orders and billing exist.\n\nPermission: `inv.trace.read`."
x-permission: inv.trace.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
security:
  - staffSession: []
  - apiKey: []
responses:
