operationId: submitStockAdjustment
tags:
  - inv
summary: "Submit an adjustment for posting"
description: "Values the lines again from their pools and judges the total against the threshold (50,000 pesewas in the seed). Below it the adjustment posts at once: one movement per line, to the branch's virtual loss location or from its adjustment location. At or above it the answer is `202` and stock is unchanged until a different user approves; the approval binds to the lines and their values, so a pool that moves meanwhile voids it. A posted adjustment is immutable.\n\nPermission: `inv.adjustment.create`, scoped to the location.\n\nMay require approval of kind `STOCK_WRITE_OFF`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user holding `inv.adjustment.approve` approves, with a fresh step-up."
x-permission: inv.adjustment.create
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - CSRF_TOKEN_INVALID
  - ORIGIN_NOT_ALLOWED
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_REUSED
  - NOT_FOUND
  - INVALID_STATE_TRANSITION
  - STOCK_ADJUSTMENT_INVALID
  - REFERENCE_NOT_FOUND
  - INSUFFICIENT_STOCK
  - STOCK_UNIT_NOT_AVAILABLE
  - STOCK_UNIT_RESERVED
  - PERIOD_NOT_OPEN
  - POSTING_RULE_MISSING
  - SUBLEDGER_REQUIRED
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
