operationId: listStockUnitMovements
tags:
  - inv
summary: "List the movements of one animal or lot"
description: "An animal's or a lot's movements, newest first. Read as the stock unit is (an animal at its current location, a lot branch-wide), then narrowed to the reader's grants.\n\nPermission: `inv.movement.read`."
x-permission: inv.movement.read
x-error-codes:
  - VALIDATION_FAILED
  - UNAUTHENTICATED
  - FORBIDDEN
  - PASSWORD_CHANGE_REQUIRED
  - NOT_FOUND
  - RATE_LIMITED
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
