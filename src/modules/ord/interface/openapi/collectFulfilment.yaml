operationId: collectFulfilment
tags:
  - ord
summary: "Hand a collection order to the customer"
description: "Hands a packed collection order to the customer at the branch (2.36.0, B11 continued 7, FR-ORD-011, FR-BIL-005, ADR-0021), in one serializable transaction: every packed pick list of the order goes (the order must be `PACKED`, else 422 `INVALID_STATE_TRANSITION`); the billing document is issued on the weighed quantity (an `INVOICE` for a customer with an account, a `RECEIPT` for a guest), with no delivery fee; the order's deposits are allocated to it oldest first and what they hold beyond it is asked back to the original method (`WEIGHED_BELOW_PAID`), unless a backorder of the order is still to be sent; each pick is issued for the sale from where it was picked to the customer (never below zero online: 422 `INSUFFICIENT_STOCK`); the order's reservations end; a line packed with its rest back-ordered leaves a backorder (`parentOrderId`); the pick lists become `COLLECTED` and the order `READY_FOR_COLLECTION`. With nothing left to pay the order is `COMPLETED` at once; what is left is **paid at the till** (`payInvoiceAtTill`, a guest's receipt included) and the order completes when its document is settled. `ord.OrderCollected` is written to the outbox. Refusals: 422 `FULFILMENT_INVALID` with `NOT_A_COLLECTION` (a delivery order is dispatched with `dispatchFulfilment`) or `CREDIT_DISPATCH_NOT_AVAILABLE` (an order on account, B11 continued 8).\n\nEach write is one serializable transaction, idempotent by its key: a replay answers the first result.\n\nPermission: `ord.fulfilment.dispatch`."
x-permission: ord.fulfilment.dispatch
