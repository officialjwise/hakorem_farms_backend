operationId: cancelOrder
tags:
  - ord
summary: "Cancel an order before dispatch"
description: "Runs at serializable isolation, as one transaction: every reservation the order holds is released, every pending provider charge is released (money that still arrives clears as an unmatched deposit with a break), and the refund of what each cleared payment still holds is asked for to its original method with the reason `ORDER_CANCELLED`, waiting for a different approver (kind `REFUND`). Only a `PLACED` or `CONFIRMED` order is cancelled; any other status, a dispatched order included, is 422 INVALID_STATE_TRANSITION (`details[].code` the status). The reason is a `CANCELLATION` reason (else 422 ORDER_INVALID `REASON_NOT_ALLOWED`; `NOTE_REQUIRED` when the reason asks for a note). Every open line becomes `CANCELLED`, and the history records the change with the reason.\n\nPermission: `ord.order.cancel`."
x-permission: ord.order.cancel
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonCodeRequest"
      example:
        reasonCode: CUSTOMER_CANCELLED
        note: "Customer called to cancel"
