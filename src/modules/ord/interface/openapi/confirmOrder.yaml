operationId: confirmOrder
tags:
  - ord
summary: "Confirm an order: reserve stock and check credit"
description: "Runs at serializable isolation. First the payment or credit check: a cash-on-delivery order needs none, a prepaid order needs its estimate received in cleared payments (else 422 ORDER_INVALID `PREPAYMENT_SHORT`), and a credit order needs a credit policy to pass it. Then every open line is reserved for the order from the stock a remote buyer may be promised, oldest first. If any line cannot be covered, nothing is reserved, the order stays `PLACED`, and the answer is 422 STOCK_UNAVAILABLE with one `NOT_ENOUGH_STOCK` detail per short line (`field` `/lines/<lineNo>`, the message saying how much is short). A confirmed order holds its stock until fulfilment, cancellation or void. Only a `PLACED` order is confirmed (else 422 INVALID_STATE_TRANSITION, `details[].code` the status). An order with a price override not yet approved is 422 PRICE_OVERRIDE_NEEDS_APPROVAL, one detail per line (`/lines/<lineNo>/agreedUnitPricePesewas`, `APPROVAL_PENDING` or `APPROVAL_REJECTED`), and nothing is reserved (A-230). For a business account over its credit limit or on hold, returns 202 with an approval for a credit override (credit control, B10; until it is built a credit order is refused with 422 ORDER_INVALID `CREDIT_CHECK_UNAVAILABLE`, A-224).\n\nPermission: `ord.order.confirm`.\n\nMay require approval of kind `CREDIT_OVERRIDE`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves."
x-permission: ord.order.confirm
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
