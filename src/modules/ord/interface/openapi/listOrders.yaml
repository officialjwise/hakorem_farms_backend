operationId: listOrders
tags:
  - ord
summary: "List orders on every channel"
description: "Every channel in one list, newest first, at the branches where the caller reads orders for the whole branch. `from` and `to` bound `placedAt` (from inclusive, to exclusive); `q` matches the start of an order number or part of a guest's name.\n\nPermission: `ord.order.read`."
x-permission: ord.order.read
parameters:
  - name: channel
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/Channel"
  - name: status
    in: query
    required: false
    schema:
      type: string
  - name: customerId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: shiftId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: salespersonId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: q
    in: query
    required: false
    schema:
      type: string
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
