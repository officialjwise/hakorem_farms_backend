        customerId: "019a7a87-848b-7de0-9318-e6d5c4925fb3"
        fulfilmentMode: COLLECTION
        paymentTerms: COD
        lines:
          - productId: "019a7a8e-6b1f-7a02-9c41-2f6d8e1b5a30"
            quantity: "4.000"
          - productId: "019a7a8e-8c27-7b3d-a1e5-4d9f0c2a6b71"
            quantity: "10.000"
        notes: "Collecting Friday morning for the hotel kitchen"
