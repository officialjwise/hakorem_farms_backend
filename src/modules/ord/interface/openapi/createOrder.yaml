operationId: createOrder
tags:
  - ord
summary: "Enter an order for a customer"
description: "Enters a PLACED order at the one branch where the caller enters orders, numbered from its `SALES_ORDER` series; nothing is reserved or charged until `confirmOrder`. Every line is priced by the pricing engine now and keeps the full pricing record. A line the pricing engine cannot price is refused with 422 QUOTE_REQUIRED naming the line; raise a quote instead. Every agreed price that differs from list needs a `PRICE_OVERRIDE` reason. A price above list up to the ceiling needs nothing more. A price below list within the band needs nothing more while the line's whole variance (the difference extended over the line) is at or under the seller's per-line limit (`PRICE_OVERRIDE_PER_LINE`, the largest among the roles they hold at the branch; with none set, every price below list waits). A price outside the band, or below list beyond that limit, makes the order wait for a different user: it is entered `PLACED` with those lines' `varianceApprovalRequestId` set, and the answer is 202 `ApprovalPending` (kind `PRICE_OVERRIDE`, its subject the order, with its number). The order cannot be confirmed, nor its proforma issued, until a holder of `ord.price_override.approve`, with a fresh step-up, who neither asked, nor sold, nor wrote the order, approves (422 MAKER_CANNOT_CHECK otherwise; the database refuses it too). A rejected override leaves the order `PLACED` and unconfirmable; cancelling it withdraws a waiting override (A-230). Until delivery scheduling, catch weight and promotions on staff orders are built, `DELIVERY`, a line priced per kilogram and a coupon are refused (422 ORDER_INVALID: `FULFILMENT_NOT_AVAILABLE`, `CATCH_WEIGHT_NOT_AVAILABLE`, `COUPON_NOT_AVAILABLE`); every other rule a line breaks is also named in `details[].code` (A-224).\n\nPermission: `ord.order.create`."
x-permission: ord.order.create
parameters:
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
