operationId: cancelDelivery
tags:
  - del
summary: "Cancel a dispatched delivery before it leaves"
description: "A dispatched delivery cancelled before it left the farm (2.35.0, B11 continued 6; FR-ORD-014, A-364 (a)): its goods still wait on the van (`SCHEDULED` or `ASSIGNED`) and it is a stop of no planned or started run. FR-ORD-014 allows no cancel of an order after dispatch but the delivery return, so the cancellation **is** that return, in one transaction: the delivery `CANCELLED` with its `CANCELLATION` reason (its slot freed); each dispatched pick moved from the vehicle into the branch's returns hold (`returnsLocationId`, a live `RETURNS_HOLD` of the delivery's branch), not sellable until inspected; the order moved `DISPATCHED` to `DELIVERY_FAILED` to `RETURNED`, each step with the cancellation's reason; the whole document credited through the `CREDIT_NOTE` approval and, once that credit note is issued, what the customer paid beyond what the document still asks refunded through the `REFUND` approval, to the original method or to store credit (`refundDestination`, a customer account only), exactly as `returnDeliveryToStock`. `del.DeliveryCancelled` in the outbox. Audited. **Refusals:** a delivery on its way, failed (use `returnDeliveryToStock`) or finished 422 `INVALID_STATE_TRANSITION`; 422 `DELIVERY_INVALID` with `ON_A_RUN`, `NOT_A_RETURNS_HOLD`, `REASON_UNKNOWN`, `REASON_NOT_ALLOWED` (not a `CANCELLATION` reason), `NOTE_REQUIRED` or `STORE_CREDIT_NEEDS_CUSTOMER`; another branch's delivery 403. The same key answers the first cancellation.\n\nPermission: `del.delivery.assign`."
x-error-codes:
  - DELIVERY_INVALID
x-permission: del.delivery.assign
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
