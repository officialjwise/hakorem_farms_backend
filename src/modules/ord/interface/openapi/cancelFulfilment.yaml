operationId: cancelFulfilment
tags:
  - ord
summary: "Cancel a fulfilment and return picked stock"
description: "Cancels a pick list not yet packed (`PICK_LIST` or `PICKING`, else 422 `INVALID_STATE_TRANSITION`) with its reason: its picks are withdrawn and kept, nothing goes back to stock (a pick moved none), and its lines may go on another pick list. The order stays where it is; `cancelOrder` ends the order itself, picking or not.\n\nEach write is one serializable transaction, idempotent by its key: a replay answers the first result.\n\nPermission: `ord.fulfilment.pick`."
x-permission: ord.fulfilment.pick
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/ReasonRequest"
      example:
        reason: "Counted twice in error at the morning check"
