operationId: createFulfilment
tags:
  - ord
summary: "Create a pick list for a confirmed order"
description: "A pick list of a `CONFIRMED` or `PICKING` order at one pick location of its branch (a physical, live location: never in transit, a van, a site or the returns hold, else 422 `FULFILMENT_INVALID` `NOT_A_PICK_LOCATION`), numbered `PCK-...` from its own series. Of every open line's remainder, or of `lines` (part of the order, FR-ORD-008): a line not on the order `LINE_NOT_ON_ORDER`, not open `LINE_NOT_OPEN`, named twice `LINE_REPEATED`, above what no other pick list asks `QUANTITY_ABOVE_REMAINING`; a catch-weight line goes whole on one pick list (`CATCH_WEIGHT_LINE_WHOLE`); nothing left `NOTHING_TO_PICK`. The database refuses pick lists asking more of a line than it ordered. The first pick list moves the order `CONFIRMED` to `PICKING`. Another status is 422 `INVALID_STATE_TRANSITION`. Nothing moves stock: a pick names what is taken; stock moves at dispatch.\n\nEach write is one serializable transaction, idempotent by its key: a replay answers the first result.\n\nPermission: `ord.fulfilment.pick`."
x-permission: ord.fulfilment.pick
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/FulfilmentCreate"
      example:
        pickLocationId: "019a7a84-4156-72e2-a81a-36fbeee7afd9"
