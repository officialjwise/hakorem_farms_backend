operationId: submitReturn
tags:
  - ord
summary: "Submit a return: credit note, stock and refund"
description: "Always 202 with an `ApprovalPending` body (kind `RETURN`), and only by the return's maker (422 ORDER_INVALID `NOT_RETURN_MAKER`); a return already submitted is 422 INVALID_STATE_TRANSITION. Nothing takes effect until a holder of `ord.return.approve`, with a fresh step-up, approves who is not its maker (422 MAKER_CANNOT_CHECK, also refused by the database). On approval, in the approval's transaction: the credit note is issued against the original receipt for the returned quantities, made by the return's maker under that approval; each line not written off comes back into stock at its share of the cost it left at (`RESTOCK` to where it was sold from, `RETURNS_HOLD` to the branch's returns holding area; `WRITE_OFF` moves no stock); and the refund of what the sale now owes the customer is asked for against that credit note from the cleared payment that paid the most of it, the return's maker its maker, so that neither the maker nor the credit note's maker may approve it. A rejection gives the quantities back. Every submission and completion is on the daily exception report with the refunds (`REFUND`, abuse case 12). The `200` response is kept for the contract and not used.\n\nPermission: `ord.return.create`.\n\nMay require approval of kind `RETURN`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves."
x-permission: ord.return.create
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/OrderReturn"
        example:
          id: "019a7a9e-79ed-74b3-b9eb-540215f0ccdf"
          returnNo: RET-2026-DDW-000012
          status: COMPLETED
          order:
            id: "019a7af4-82a5-7557-ba8f-5e4c8a38d72a"
            docType: SALES_ORDER
