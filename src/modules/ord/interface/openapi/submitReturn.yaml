            docType: RECEIPT
            number: RCP-2026-DDW-T1-018700
          kind: RETURN
          reasonCode: DAMAGED_IN_DELIVERY
          lines:
            - id: "019a7af4-c083-791e-9e56-9abb7d9a1399"
              orderLineId: "019a7af4-df72-7302-a83a-38f2f74bb1d0"
              product:
                id: "019a7a8d-ae28-7631-8b69-6be302d5e4c0"
                sku: EGG-0003
                name: "Eggs, big, crate of 30"
              qty: "2.000"
