operationId: writeOffDelivery
tags:
  - del
summary: "Write a failed delivery's goods off the van"
description: "Writes a failed delivery's goods off the van with a reason (2.33.0, B11 continued 4; FR-DEL-011; the owner, 2026-11-23: every item on a van is delivered, returned to stock or written off with a reason, and anything unaccounted for goes on the driver variance report). Only a `FAILED` delivery, its order `DELIVERY_FAILED`; anything else 422 `INVALID_STATE_TRANSITION`. The reason is `UNACCOUNTED_ON_VAN` (the driver cannot account for the goods; a note is needed; the row then appears on `listDriverGoodsVariances`) or one from the `WASTAGE` list (spoiled, damaged, expired, cold chain failure), with its note where the reason asks for one; otherwise 422 `DELIVERY_INVALID` `REASON_UNKNOWN`, `REASON_NOT_ALLOWED` or `NOTE_REQUIRED`. It goes through **INV's stock adjustment** at the vehicle (each dispatched pick a loss valued at cost, never a figure from the request) and its `STOCK_WRITE_OFF` approval: below the policy's threshold it posts at once and answers **200** with the delivery `WRITTEN_OFF`; at or above it, it answers **202** and the goods stay on the van until a different holder of `inv.adjustment.approve` approves, when the delivery is `WRITTEN_OFF` in that approval's transaction (refused, the goods are still aboard and the write-off may be asked again). A write-off never takes the van below zero (422 `INSUFFICIENT_STOCK`, nothing written), and a stock adjustment invalid at the vehicle 422 `STOCK_ADJUSTMENT_INVALID`. Written off, the goods have left the van, so its run may close; the order is `RETURNED`; the whole document is credited and what was paid asked back exactly as `returnDeliveryToStock` does (`CREDIT_NOTE`, then `REFUND`, the caller their maker). While one write-off waits, another or a return to stock is 422 `DELIVERY_INVALID` `WRITE_OFF_PENDING`. The same key answers the first write-off. Audited.\n\nPermission: `del.delivery.write_off`."
x-permission: del.delivery.write_off
x-owner-module: ord
x-error-codes:
  - DELIVERY_INVALID
  - INSUFFICIENT_STOCK
  - STOCK_ADJUSTMENT_INVALID
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
