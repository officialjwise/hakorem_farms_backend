operationId: proposeSubstitution
tags:
  - ord
summary: "Propose a substitute for a line"
description: "Another product for an open line of a `PICKING` order (FR-ORD-013), in `uom` (the line's unit when left out; a unit the product is not sold by `UNIT_NOT_SOLD`), priced by the engine now (`NO_PRICE` when it cannot; a product priced by the kilogram `CATCH_WEIGHT_NOT_AVAILABLE`). The same product in a smaller quantity is `proposeShortPick` (`SAME_PRODUCT`). A named animal is one animal (`STOCK_UNIT_REQUIRED`, `ONE_ANIMAL_PER_LINE`). The order moves to `AWAITING_CUSTOMER` and `ord.CustomerConsentRequested` goes through the outbox for the customer's message; nothing is substituted until the customer accepts. One question waits at a time (`CONSENT_PENDING`).\n\nEach write is one serializable transaction, idempotent by its key: a replay answers the first result.\n\nPermission: `ord.fulfilment.pick`."
x-permission: ord.fulfilment.pick
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
