operationId: listFulfilments
tags:
  - ord
summary: "List pick lists and fulfilments"
description: "The pick lists at the branches the caller reads whole, newest first, filtered by `orderId` (an order's own pick lists, CR-053), `status`, `pickLocationId` and `date` (the Africa/Accra day the pick list was made).\n\nPermission: `ord.fulfilment.read`."
x-permission: ord.fulfilment.read
parameters:
  - name: orderId
    in: query
    required: false
    description: "An order's own pick lists (CR-053)."
    schema:
      type: string
      format: uuid
  - name: status
    in: query
    required: false
    schema:
      type: string
      enum:
        - PICK_LIST
        - PICKING
        - PACKED
        - DISPATCHED
        - COLLECTED
        - CANCELLED
  - name: pickLocationId
    in: query
    required: false
    schema:
      type: string
      format: uuid
  - name: date
    in: query
    required: false
    schema:
      type: string
      format: date
  - name: cursor
    in: query
    required: false
    schema:
      type: string
  - name: limit
    in: query
    required: false
    schema:
      $ref: "#/components/schemas/PageLimit"
security:
  - staffSession: []
  - apiKey: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
