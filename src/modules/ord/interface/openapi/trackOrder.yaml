operationId: trackOrder
tags:
  - shp
summary: "Track an order by its tracking link"
description: "No session: the link's token is the only key (owner's decision 5, 2026-11-17; ADR-0074). The token is made when the order is placed, `trk_` and 43 base64url characters carrying 256 random bits; it is never the order id nor derived from it, is stored only as its hash, and reads its order for thirty days from when it was made. Anything else (a guessed, altered, expired or another order's token, the order id, or the signed form of 1.51.0 to 2.0.0) answers 404 NOT_FOUND, saying nothing about whether an order exists. The answer carries no name, phone or address."
parameters:
  - name: token
    in: path
    required: true
    description: "The tracking link's token, as `placeOrder` answered it."
    schema:
      type: string
security: []
responses:
  "200":
    description: OK
    headers:
      X-Correlation-Id:
        $ref: "#/components/headers/CorrelationId"
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/OrderTracking"
        example:
          orderNo: SO-2026-DDW-004216
          status: DISPATCHED
          placedAt: "2026-11-13T07:41:00Z"
          fulfilmentMode: DELIVERY
          steps:
            - status: PLACED
              label: "Order placed"
              at: "2026-11-13T07:41:00Z"
              done: true
            - status: CONFIRMED
              label: "Payment received"
              at: "2026-11-13T07:43:00Z"
              done: true
            - status: PACKED
              label: "Weighed and packed"
              at: "2026-11-13T10:20:00Z"
              done: true
            - status: DISPATCHED
              label: "On the way"
              at: "2026-11-13T11:00:00Z"
              done: true
            - status: DELIVERED
              label: Delivered
              at: null
              done: false
          delivery:
            slotDate: "2026-11-14"
            slotStartsAt: "10:00"
            slotEndsAt: "12:00"
            status: OUT_FOR_DELIVERY
            driverFirstName: Kwesi
            etaMinutes: 25
          estimatedTotalPesewas: 45000
          finalTotalPesewas: 44300
          paidPesewas: 45000
          currency: GHS
          lines:
            - name: "Full chicken, 15 kg pack"
              quantity: "1.000"
              uom: PACK
              weightKg: "14.650"
            - name: "Eggs, big, crate of 30"
              quantity: "2.000"
              uom: CRATE
              weightKg: null
  "400":
    $ref: "#/components/responses/BadRequest"
  "404":
    $ref: "#/components/responses/NotFound"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"
