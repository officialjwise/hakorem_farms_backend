  required: true
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PickRecord"
      example:
        picks:
          - id: "019a7af4-63b6-7b74-a0ac-c015108738f2"
            orderLineId: "019a7af0-66e7-7521-9a5a-5aee60b6d3cc"
            stockUnitId: "019a7a91-104c-7b12-804a-b9f4523132d2"
            packBarcode: "226110602014650"
            qty: "1.000"
            weightKg: "14.650"
            weightSource: SCALE
