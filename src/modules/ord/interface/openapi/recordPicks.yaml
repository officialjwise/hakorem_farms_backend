operationId: recordPicks
tags:
  - ord
summary: "Record picked packs or animals with their weights"
description: "Each pick by its client id (UUIDv7): a resubmitted pick with the same figures is stored once, an id used for another pick is 422 `FULFILMENT_INVALID` `PICK_ID_REUSED`. A pick is of an open line of this pick list (`LINE_NOT_ON_PICK_LIST`), in the line's unit, and the picks never come to more than the pick list asks (`PICK_OVER`; the database holds the cap). A lot is named (`STOCK_UNIT_REQUIRED`, `STOCK_UNIT_OTHER_PRODUCT`), an animal is the line's own (`STOCK_UNIT_OTHER_ANIMAL`, `ONE_ANIMAL_PER_LINE`), an untracked product names none (`STOCK_UNIT_NOT_TRACKED`). A catch-weight pick carries its weight and source (`WEIGHT_REQUIRED`, `WEIGHT_SOURCE_REQUIRED`) and takes its weighed kilograms of stock. A pick never takes more than the pick location holds that nobody else is promised, the order's own reservations counted as its own (`STOCK_SHORT`): a balance below zero offers nothing. `withdraw` takes picks of this pick list back first (a pack swapped).\n\nThe line is re-priced at its weighed quantity, `half_up(price per kg x weighed kg)` once over the line (FR-ORD-009): its `fulfilledWeightKg`, `weightSource` (the least trusted pack's) and `finalLineTotalPesewas`. A catch-weight line above the estimate plus its tolerance, or above the most the customer was shown, makes the order ask the customer (`HIGHER_TOTAL`, the order `AWAITING_CUSTOMER`, `withinTolerance` false); a swap that brings it back within withdraws the question. Below the estimate less the tolerance the line shows `toleranceState` `BELOW`, the prompt to add a pack; it may still be packed at the lower total. Only a `PICK_LIST` or `PICKING` pick list of a `PICKING` or `AWAITING_CUSTOMER` order (else 422 `INVALID_STATE_TRANSITION`).\n\n**Broken on the pick (2.37.0, CR-054 point 1):** a pick may name `damaged` (`qty` in `uom`, the line's unit when left out, so five single eggs on a line in crates; a `STOCK_ADJUSTMENT` reason such as `BREAKAGE`): those units are written off from the pick location in this transaction through a stock adjustment and its STOCK_WRITE_OFF approval, posted at once under the threshold, else waiting for a different person; the fulfilment line names it (`damaged`, with the adjustment). The goods picked are counted as before. Refused: `BREAKAGE_NOT_BY_WEIGHT` (a catch-weight line), `UNIT_NOT_SOLD`, `INEXACT_QUANTITY`; the adjustment's own refusals (422 `STOCK_ADJUSTMENT_INVALID`, `REASON_NOT_ALLOWED`; 422 `INSUFFICIENT_STOCK` when the location does not hold them).\n\nEach write is one serializable transaction, idempotent by its key: a replay answers the first result.\n\nPermission: `ord.fulfilment.pick`.\n\nAccepted from an offline queue: the client supplies the pick id (UUIDv7), and a resubmission with the same id stores nothing twice."
x-permission: ord.fulfilment.pick
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
