operationId: packFulfilment
tags:
  - ord
summary: "Mark a fulfilment packed"
description: "Seals a pick list (FR-ORD-011): every open line picked in full (`SHORT_PICK_NOT_AGREED` otherwise, unless the customer agreed to the smaller quantity, packed at exactly that), a catch-weight line with at least one pack weighed (`NOTHING_PICKED`) and within its tolerance or consented above it (`TOLERANCE_EXCEEDED`), each refusal naming `/pickList/<lineNo>`. While the order waits for its customer, 422 `CONSENT_PENDING`. The order moves to `PACKED` once no pick list of it is still being picked and every open line is packed. Publishes `ord.FulfilmentPacked`.\n\nEach write is one serializable transaction, idempotent by its key: a replay answers the first result.\n\nPermission: `ord.fulfilment.pick`."
x-permission: ord.fulfilment.pick
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
security:
  - staffSession: []
  - apiKey: []
