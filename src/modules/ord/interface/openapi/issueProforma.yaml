operationId: issueProforma
tags:
  - bil
summary: "Issue a proforma invoice for an order"
description: "Issues the order's proforma invoice, numbered from its `PROFORMA` series (`PRO-...`), at the prices the order's lines keep (the agreed price, with the resolved list price beside it) and taxed as the order is; it posts nothing to the ledger and changes nothing on the order but naming it. Only a `PLACED` or `CONFIRMED` order (422 INVALID_STATE_TRANSITION, `details[].code` the status), once (422 ORDER_INVALID `PROFORMA_ISSUED`: print another copy with `reprintBillingDocument`), and only once every price override on it is approved (422 PRICE_OVERRIDE_NEEDS_APPROVAL, `APPROVAL_PENDING` or `APPROVAL_REJECTED` per line), so an unapproved price is never offered on paper. Authorised at the order's branch (A-201, A-230).\n\nPermission: `bil.proforma.create`."
x-permission: bil.proforma.create
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
