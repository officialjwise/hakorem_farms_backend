operationId: voidOrder
tags:
  - ord
summary: "Void a completed counter sale"
description: "Always 202 with an `ApprovalPending` body (kind `SALE_VOID`); nothing changes until a supervisor holding `ord.void.approve`, with a fresh step-up, approves who is neither the person asking (422 MAKER_CANNOT_CHECK) nor the cashier who made the sale (422 MAKER_CANNOT_CHECK, also refused by the database). Only a `COMPLETED` counter or collection sale is voided (else 422 INVALID_STATE_TRANSITION, or ORDER_INVALID `NOT_A_COUNTER_SALE`), on the business day it completed (`VOID_DAY_CLOSED`, judged again at approval), with no void already waiting (`VOID_PENDING`), and paid only in cash or store credit, cleared and never refunded (`TENDER_NOT_VOIDABLE`: money through the provider or a bank goes back through a return and a refund against its credit note). The reason is a `VOID` reason. On approval, in the approval's transaction, the stock, receipt and payments are reversed by new records: each payment reversed (the mirror of its journal), the receipt credited in full by a credit note, and each stock issue reversed; the order becomes `VOIDED` and the original stays. Every request and every void is on the daily exception report (`SALE_VOID`). This is the control for abuse case 1.\n\nPermission: `ord.order.void`.\n\nMay require approval of kind `SALE_VOID`. When it does, the response is `202` with an `ApprovalPending` body and nothing takes effect until a different user approves."
x-permission: ord.order.void
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CsrfToken"
